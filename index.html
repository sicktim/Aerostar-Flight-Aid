  function climboutSvg(st, twinPts, sePts, checked, maxAglFull, startNm, rwyNm, reqs, zoom) {
    var W = U.chartW(640), H = 230, padL = 48, padR = 12, padT = 10, padB = 22;
    zoom = zoom || 1;
    // the data extends to maxAglFull; the VIEW is the fit extents ÷ zoom,
    // anchored at the runway start (svg clips whatever falls outside)
    var maxAgl = maxAglFull / zoom;
    var maxObX = 0;
    checked.forEach(function (c) { maxObX = Math.max(maxObX, c.x); });
    // required-gradient lines: DER at 35 ft → own top altitude
    var lines = [];
    (reqs || []).forEach(function (rq) {
      if (rq.grad == null || rq.top == null || rq.grad <= 0) return;
      var topAgl = rq.top - st.fieldElev;
      if (topAgl <= 35) return;
      lines.push({ tag: rq.tag, grad: rq.grad, topAgl: topAgl, dashes: rq.dashes,
        dEnd: rwyNm + (topAgl - 35) / rq.grad });
    });
    var maxLineX = 0;
    lines.forEach(function (l) { maxLineX = Math.max(maxLineX, l.dEnd * 1.08); });
    var maxX = Math.max(maxObX * 1.25, maxLineX,
      (twinPts && twinPts.length ? twinPts[twinPts.length - 1][0] : 2), rwyNm + 1) / zoom;
    function x(nm) { return padL + (W - padL - padR) * nm / maxX; }
    function y(agl) { return H - padB - (H - padT - padB) * agl / maxAgl; }
    function path(pts) {
      return pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' ');
    }
    // y-axis labeled in MSL (owner 2026-08-23), gridlines dimmed; steps
    // follow the VIEW range so a zoomed-in chart still has readable rungs
    var gl = '';
    var stepA = maxAgl > 3000 ? 1000 : (maxAgl > 1500 ? 500 : (maxAgl > 600 ? 200 : (maxAgl > 250 ? 100 : 50)));
    if (U.isPhone()) {
      // phone (owner 2026-10-04): rungs on ROUND MSL values (1,000s when the
      // view allows — never field-elevation offsets like 1,200 / 2,200), and
      // only as many labels as the short axis can carry
      var fe = st.fieldElev, mult = 1;
      while (maxAgl / (stepA * mult) > 6) mult = mult === 1 ? 2 : (mult === 2 ? 5 : mult * 2);
      for (var msl = Math.ceil(fe / stepA) * stepA; msl - fe <= maxAgl; msl += stepA) {
        var yy = y(msl - fe);
        gl += '<line class="svg-grid-dim" x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '"/>';
        if (Math.round(msl / stepA) % mult === 0 && yy > 20) {
          gl += '<text class="svg-axis" x="' + (padL - 4) + '" y="' + (yy + 4) + '" text-anchor="end">' + U.fmtComma(msl) + '</text>';
        }
      }
      gl += '<text class="svg-axis" x="4" y="10" font-size="9">FT MSL</text>';
    } else
    for (var a = 0; a <= maxAgl; a += stepA) {
      var isTop = a + stepA > maxAgl;
      gl += '<line class="svg-grid-dim" x1="' + padL + '" y1="' + y(a) + '" x2="' + (W - padR) + '" y2="' + y(a) + '"/>' +
        '<text class="svg-axis" x="4" y="' + (y(a) + 4) + '">' + U.fmtComma(st.fieldElev + a) +
        (isTop ? ' FT MSL' : '') + '</text>';
    }
    var nmStep = maxX > 20 ? 5 : (maxX > 6 ? 2 : (maxX > 2.5 ? 1 : (maxX > 1 ? 0.5 : 0.25)));
    if (U.isPhone()) { while (maxX / nmStep > 7) nmStep *= 2; }   // narrow axis: fewer distance labels
    for (var n = 0; n <= maxX + 1e-9; n += nmStep) {
      gl += '<text class="svg-axis" x="' + x(n) + '" y="' + (H - 6) + '" text-anchor="middle">' +
        (n % 1 ? n.toFixed(2).replace(/0+$/, '') : n) + 'nm</text>';
    }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + gl +
      // runway band on the surface — ink-bright to stand out (owner)
      '<rect class="svg-bandink" x="' + x(0) + '" y="' + (y(0) - 3) + '" width="' + (x(rwyNm) - x(0)) + '" height="6"/>' +
      '<text class="svg-axis" x="' + x(rwyNm / 2) + '" y="' + (y(0) - 8) + '" text-anchor="middle" font-size="9">RWY</text>';
    // 50-ft crossing marker
    if (startNm != null) {
      svg += '<line x1="' + x(startNm) + '" y1="' + y(0) + '" x2="' + x(startNm) + '" y2="' + y(50) +
        '" stroke="currentColor" opacity="0.5" stroke-width="1.5" stroke-dasharray="3 3"/>';
    }
    // required-gradient lines (Obstacle, ATC) — departure-procedure basis:
    // from the departure end of the runway at 35 ft AGL, rising at the
    // required ft/nm, STOPPING at each requirement's own top altitude. Kept
    // quiet: thin, dim, distinct dash patterns, tiny end labels, no legend.
    lines.forEach(function (l, li) {
      // clip the line to the VIEW (right edge or top) — the label only shows
      // where the line's visible end is, never pinned into frame
      var dEnd = Math.min(maxX, l.dEnd);
      var aglEnd = Math.min(l.topAgl, 35 + (dEnd - rwyNm) * l.grad);
      if (aglEnd > maxAgl) { aglEnd = maxAgl; dEnd = rwyNm + (maxAgl - 35) / l.grad; }
      svg += '<line x1="' + x(rwyNm) + '" y1="' + y(35) + '" x2="' + x(dEnd) + '" y2="' + y(aglEnd) +
        '" stroke="currentColor" opacity="0.5" stroke-width="1.5" stroke-dasharray="' + l.dashes + '"/>';
      if (dEnd >= l.dEnd - 1e-9) {
        svg += '<text class="svg-axis" x="' + (x(dEnd) - 4) + '" y="' + Math.max(y(aglEnd) - 4 + (li ? 12 : 0), 20) +
          '" text-anchor="end" font-size="9">' + l.tag + ' ' + l.grad + '</text>';
      }
    });
    // obstacles: small-headed lollipops, colored by clearance (green = both
    // paths clear, red = a violation, amber = not checked), label beside
    checked.forEach(function (c) {
      var col = c.status === 'ok' ? '#3fd68f' : (c.status === 'viol' ? '#ff6b6b' : '#ffb347');
      // no clamping: an obstacle above/beyond the zoomed view clips out of
      // frame rather than pinning to the edge where it would misread
      var ox = x(c.x), oy = y(Math.max(0, c.agl));
      svg += '<line x1="' + ox + '" y1="' + y(0) + '" x2="' + ox + '" y2="' + (oy + 4) +
        '" stroke="' + col + '" stroke-width="2.5"/>' +
        '<circle cx="' + ox + '" cy="' + oy + '" r="4" fill="' + col + '"/>';
      var flip = ox > W - 70;
      svg += '<text x="' + (flip ? ox - 8 : ox + 8) + '" y="' + (oy + 4) + '" fill="' + col +
        '" font-size="11" font-weight="700"' + (flip ? ' text-anchor="end"' : '') + '>' +
        c.ob.label + '</text>';
    });
    // a 1-point path is a path that never started — draw nothing rather than a stub
    if (twinPts && twinPts.length > 1) svg += '<path d="' + path(twinPts) + '" fill="none" stroke="#4fa3ff" stroke-width="3"/>';
    if (sePts && sePts.length > 1) svg += '<path d="' + path(sePts) + '" fill="none" stroke="#e9a23b" stroke-width="2.5" stroke-dasharray="8 5"/>';
    // legend
    svg += '<rect class="svg-legendbox" x="' + (padL + 6) + '" y="' + (padT + 2) + '" width="150" height="34" rx="5"/>' +
      '<line x1="' + (padL + 14) + '" y1="' + (padT + 12) + '" x2="' + (padL + 38) + '" y2="' + (padT + 12) + '" stroke="#4fa3ff" stroke-width="3"/>' +
      '<text class="svg-ink" x="' + (padL + 44) + '" y="' + (padT + 16) + '">2 ENGINE</text>' +
      '<line x1="' + (padL + 14) + '" y1="' + (padT + 27) + '" x2="' + (padL + 38) + '" y2="' + (padT + 27) + '" stroke="#e9a23b" stroke-width="3" stroke-dasharray="8 5"/>' +
      '<text class="svg-ink" x="' + (padL + 44) + '" y="' + (padT + 31) + '">OEI (Vyse)</text>' +
      '</svg>';
    var div = U.el('div');
    div.innerHTML = svg;
    return div;
  }

  function wSel(map, gw) {
    // interpolate the printed speed-schedule table between weight rows
    // (owner 2026-08-29); clamped to the printed rows, rounded to 1 kt
    var keys = Object.keys(map).map(Number).sort(function (a, b) { return a - b; });
    var ys = keys.map(function (k) { return map[String(k)]; });
    return Math.round(C.interp1(keys, ys, gw).v);
  }

  function takeoffSpeeds(flaps, gw) {
    // published inset tables (stepped, not interpolated — use published row)
    function mph(k) { return Math.round(C.ktToMph(k)); }
    if (flaps === '20') {
      var t = gw > 5750 ? { to: 87, ob: 90 } : { to: 85, ob: 88 };
      return { takeoff: t.to, obstacle: t.ob, engFail: t.to === 87 ? 87 : 85,
        takeoffMph: mph(t.to), obstacleMph: mph(t.ob), engFailMph: mph(t.to === 87 ? 87 : 85) };
    }
    // rows desc by weight; use the smallest published weight >= gw (published
    // steps, no interpolation; conservative for lighter weights within a step)
    var rows = [[6000, 96, 100], [5500, 92, 96], [5000, 88, 93], [4750, 85, 90]];
    var pick = rows[0];
    for (var i = 0; i < rows.length; i++) if (rows[i][0] >= gw) pick = rows[i];
    return { takeoff: pick[1], obstacle: pick[2], engFail: pick[1],
      takeoffMph: mph(pick[1]), obstacleMph: mph(pick[2]), engFailMph: mph(pick[1]) };
  }

  UI.registerTab({ id: 'dep', label: 'DEP', sub: 'takeoff·climb', render: render });
})();


/* tab_emer.js — Emergency return to departure field. Reuses DEP conditions
   (safe: weather/runway unchanged in the return timeframe) but requires an
   explicit fuel-burned entry for weight — never silently reuses takeoff fuel. */

(function () {
  'use strict';
  var C = Core, U = UI;

  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  // Every section on this page runs the same lookups against different figures,
  // so one off-chart condition (one tailwind, one clamped weight) yields the
  // identical chip text in each. U.warnChips dedups within a single call; this
  // carries that across the page so a condition is stated once, under the first
  // section it affects. A warning unique to one section is untouched and still
  // prints there. Chips only — the per-section NO CHART ANSWER banner and the
  // red legend swatch are what fail closed, and they are emitted per section.
  function newWarns(seen, warns) {
    return (warns || []).filter(function (w) {
      if (own(seen, w)) return false;
      seen[w] = 1;
      return true;
    });
  }

  // A null distance means the POH chart has no answer for these conditions.
  // rwyGraphic simply omits that line, which reads as "fits the runway" — so
  // say it out loud and paint the legend swatch red instead of a fits colour.
  function noDataBanner(parent, entries, what) {
    var miss = [], i;
    for (i = 0; i < entries.length; i++) {
      if (entries[i].val == null) { entries[i].color = '#ff5252'; miss.push(entries[i].label); }
    }
    if (!miss.length) return false;
    parent.appendChild(U.el('div', 'banner viol',
      'NO CHART ANSWER — ' + miss.join(', ') + '. Runway fit is NOT checked for ' +
      (miss.length === entries.length ? 'any ' + what + ' distance'
        : (miss.length === 1 ? 'that distance' : 'those distances')) +
      '; see the flags below.'));
    return true;
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function render(page) {
    var st = U.store;
    // this tab reuses the DEP conditions — cleared/empty entries mean no
    // landing numbers until they are entered on DEP (owner 2026-08-23)
    var condMiss = U.missing(['fieldElev', 'altimeter', 'oat', 'windDir', 'windSpd', 'rwyHdg', 'rwyLen']);
    var toGw = U.grossWeight();
    var gw = toGw - st.emerBurnGal * D.aircraft_tables.weights.fuel_density_lb_per_gal;

    // phase 2: the return may use a DIFFERENT runway at the departure airport
    // (owner 2026-08-30) — its own heading (wind) and LDA; otherwise DEP's.
    var emerOwn = !!(st.emerRwy && st.emerRwyHdg != null);
    var rwyHdg = emerOwn ? st.emerRwyHdg : st.rwyHdg;
    var ldaSrc = emerOwn ? 'LDA' : (st.rwyLda != null ? 'LDA' : 'RWY');
    var lda = emerOwn ? st.emerLda : (st.rwyLda != null ? st.rwyLda : st.rwyLen);
    var eff = { rwyHdg: rwyHdg, lda: lda, ldaSrc: ldaSrc };

    var hdr = U.el('div', 'pagehead');
    hdr.appendChild(U.el('h2', null, 'EMERGENCY RETURN — ' + (st.depApt && Airports.get(st.depApt) ? esc(st.depApt) : 'DEPARTURE FIELD')));
    hdr.appendChild(Airports.headerControls('emer'));   // [ RWY xx ] — pick another runway at the DEP airport
    page.appendChild(hdr);
    // one chip between the title and the weight box, no extra spacing, no notes (owner 2026-09-13)
    page.appendChild(U.el('div', 'chip src emerfrom', 'From departure conditions'));
    var s = U.el('div', 'sect'); page.appendChild(s);
    var g = U.el('div', 'grid'); s.appendChild(g);
    U.num(g, { label: 'Fuel burned since T/O', key: 'emerBurnGal', unit: 'gal', min: 0, max: 165.5 });
    // POH caution option (right-justified): partial-power approaches can
    // increase AIR distance up to 250% — toggle applies ×2.5 to the air
    // segment (over-50 minus ground roll) as a dashed extension on the charts
    var af = U.el('div', 'fld');
    af.style.marginLeft = 'auto';
    af.appendChild(U.el('label', null, 'Powered approach'));
    var arow = U.el('div', 'row');
    var ab = U.el('button', 'tgl' + (st.emerAirX ? ' on' : ''), '+250%');
    ab.addEventListener('click', function () { U.set('emerAirX', !st.emerAirX); });
    arow.appendChild(ab);
    af.appendChild(arow);
    g.appendChild(af);
    var o = U.el('div', 'out'); s.appendChild(o);
    U.res(o, 'Landing weight', U.fmtComma(gw) + ' <small>lb</small>', gw > 6000 ? 'bad' : null);
    s.appendChild(U.el('div', 'footnote',
      'Landing charts: idle power from 50-ft obstacle, max effective braking, level paved dry ' +
      'runway. POH caution: partial-power approaches can increase air distance up to 250%.'));
    if (condMiss.length) {
      U.awaitBlock(s, condMiss.map(function (l) { return l + ' (DEP)'; }), 120);
      return;
    }
    var pa = C.pressureAlt(st.fieldElev, st.altimeter);
    // return wind: the picker's worst case for the chosen runway when there is one, else DEP's
    var wind = st.emerWindDir != null && st.emerWindSpd != null ? C.windComponents(st.emerWindDir, st.emerWindSpd, eff.rwyHdg)
      : C.windComponents(st.windDir, st.windSpd, eff.rwyHdg);

    var seen = {};   // chip texts already printed on this page
    renderLanding(page, 'LANDING — FLAPS 45°', D.fig8_20, D.fig8_21, st, pa, wind, gw, [[6000, 96], [5500, 91], [5000, 89], [4500, 85]], seen, eff);
    if (U.feat('emerFup')) {
      renderLanding(page, 'LANDING — FLAPS UP', D.fig8_22, D.fig8_23, st, pa, wind, gw, [[6000, 111], [5500, 107], [5000, 102], [4500, 98]], seen, eff);
    }

    // balked landing
    var s2 = U.sect(page, 'BALKED LANDING (GO-AROUND)');
    var balk = C.evalClimbChart(D.fig8_11, st.oat, pa, gw);
    var o2 = U.el('div', 'out'); s2.appendChild(o2);
    U.res(o2, 'Balked-ldg ROC', U.fmtComma(balk.v) + ' <small>fpm</small>',
      balk.v == null ? 'warn' : (balk.v < 200 ? 'warn' : null),
      (balk.v == null ? 'NO CHART ANSWER at these conditions — ' : '') +
      U.spdFmt(D.aircraft_tables.climb_speeds_kias.balked_landing_all_weights).main + ' · flaps 45° · gear down · both engines');
    U.warnChips(s2, newWarns(seen, balk.warn));
  }

  function renderLanding(page, title, fig50, figRoll, st, pa, wind, gw, appRows, seen, eff) {
    var s = U.sect(page, title);
    var r50 = C.evalThreePanel(fig50, st.oat, pa, gw, wind.head);
    var roll = C.evalThreePanel(figRoll, st.oat, pa, gw, wind.head);
    var app = interpApproach(appRows, gw);
    // +250% air-distance option (POH caution): dashed extension on the
    // over-50 line — ground roll + 2.5 × (over-50 − ground roll)
    var dash = null;
    if (st.emerAirX && r50.v != null && roll.v != null && r50.v > roll.v) {
      dash = roll.v + 2.5 * (r50.v - roll.v);
    }
    var entries = [
      { label: 'OVER 50\'', val: r50.v, color: '#4fa3ff', dash: dash },
      { label: 'GND ROLL', val: roll.v, color: '#2fbf7d' }
    ];
    noDataBanner(s, entries, 'landing');
    // compact APP SPD cell in line with (above, left-justified) the chart
    var o = U.el('div', 'out'); s.appendChild(o);
    var sp = U.spdFmt(app);
    var rApp = U.res(o, 'App spd', sp.main, null, sp.sub);
    rApp.style.flex = '0 1 auto';
    rApp.style.minWidth = '0';
    // landing checks against LDA (owner 2026-08-23); no LDA entered → TORA
    U.rwyGraphic(s, entries, eff.lda,
      { rwLabel: eff.ldaSrc + ' ' + U.fmtComma(eff.lda) + ' FT' });
    U.warnChips(s, newWarns(seen, r50.warn.concat(roll.warn)));
    return s;
  }

  function interpApproach(rows, gw) {
    // POH's own worked example interpolates approach speed linearly by weight
    var ws = rows.map(function (r) { return r[0]; }).reverse();
    var vs = rows.map(function (r) { return r[1]; }).reverse();
    var r = Core.interp1(ws, vs, gw);
    return Math.round(r.v);
  }

  UI.registerTab({ id: 'emer', label: 'EMER<br>RTN', sub: 'return·land', render: render });
})();


/* tab_cruise.js — N8247J factory cruise tables (Fig 8-14 Best Power / 8-15
   Economy), range/endurance profiles, holding, descent. All values
   interpolated from digitized POH data. */

(function () {
  'use strict';
  var C = Core, U = UI;

  // altitude pages that carry weight in cruiseLookup's blend at altFt. Core
  // reads BOTH bracketing pages even when one weighs nothing, so a page-tagged
  // clamp chip can name an altitude the aircraft is not at.
  function contribPages(mixture, altFt) {
    var alts = (mixture === 'ec' ? D.fig8_15 : D.fig8_14).altitudes;
    var lo = alts[0], hi = alts[alts.length - 1], i;
    var a = Math.max(lo.alt_ft, Math.min(hi.alt_ft, altFt));
    for (i = 0; i < alts.length - 1; i++) {
      if (a >= alts[i].alt_ft && a <= alts[i + 1].alt_ft) { lo = alts[i]; hi = alts[i + 1]; break; }
    }
    var t = hi.alt_ft === lo.alt_ft ? 0 : (a - lo.alt_ft) / (hi.alt_ft - lo.alt_ft);
    var out = [];
    if (t < 0.99) out.push(lo);   // same thresholds core uses to decide
    if (t > 0.01) out.push(hi);   // "between altitude pages"
    return out;
  }

  // MAP rows on one page that carry weight at mapInHg — same bracket-and-clamp
  // core does inside a page.
  function contribRows(pg, rpm, mapInHg) {
    var rows = [], i;
    for (i = 0; i < pg.rows.length; i++) if (pg.rows[i].rpm === rpm) rows.push(pg.rows[i]);
    if (!rows.length) return rows;
    rows.sort(function (a, b) { return a.map - b.map; });
    var m = Math.max(rows[0].map, Math.min(rows[rows.length - 1].map, mapInHg));
    var lo = rows[0], hi = rows[rows.length - 1];
    for (i = 0; i < rows.length - 1; i++) {
      if (m >= rows[i].map && m <= rows[i + 1].map) { lo = rows[i]; hi = rows[i + 1]; break; }
    }
    var t = hi.map === lo.map ? 0 : (m - lo.map) / (hi.map - lo.map);
    var out = [];
    if (t < 1) out.push(lo);
    if (t > 0) out.push(hi);
    return out;
  }

  // Does the day this pilot entered actually read an unpublished column? Core
  // blends both bracketing pages and both bracketing MAP rows, and its day-column
  // chips carry no page tag, so a std/hot/cold flag can describe a row that
  // weighs nothing — a "cold-day column" caution on numbers that came entirely
  // from the printed standard column. dev 0 reads std only; ±20 reads that end
  // column only; in between, both.
  function dayColMissing(mixture, rpm, altFt, mapInHg, dev) {
    var d = Math.max(-20, Math.min(20, dev)), need, miss = false;
    if (d < 0) need = d > -20 ? ['cold', 'std'] : ['cold'];
    else if (d > 0) need = d < 20 ? ['hot', 'std'] : ['hot'];
    else need = ['std'];
    contribPages(mixture, altFt).forEach(function (p) {
      contribRows(p, rpm, mapInHg).forEach(function (r) {
        need.forEach(function (k) { if (!r[k]) miss = true; });
      });
    });
    return miss;
  }

  // drop chips belonging to a page — or to a day column — that did not
  // contribute to the numbers shown
  function ownWarns(warns, pages, dayMissing) {
    return (warns || []).filter(function (w) {
      if (/day column not published/.test(w)) return dayMissing;
      var m = /page rows at (-?\d+) ft/.exec(w);
      return !m || pages.indexOf(parseInt(m[1], 10)) >= 0;
    });
  }

  function mixName(m) { return m === 'bp' ? 'Best power' : 'Economy'; }
  function sgn(x, dp) { return (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(dp); }
  function delta(x, dp, goodWhenUp) {
    // ± chip vs the selected row: KTAS/nm-per-gal up = good, gph up = bad
    var z = Math.abs(x) < (dp ? 0.05 : 0.5);
    var cls = z ? 'z' : ((x > 0) === goodWhenUp ? 'g' : 'r');
    return '<span class="md ' + cls + '">' + (z ? (dp ? '0.0' : '0') : sgn(x, dp)) + '</span>';
  }

  // one page row read at the pilot's altitude / ISA day, weight-corrected
  function readRow(mix, rpm, map, alt, dev, gw) {
    var b = C.cruiseLookup(mix, rpm, map, alt, dev);
    if (!b.v) return { map: map, rpm: rpm, mix: mix, v: null, warn: b.warn };
    var kt = C.cruiseWeightKtasCorr(b.v.ktas, gw, alt), gt = b.v.gph * 2;
    return { map: map, rpm: rpm, mix: mix, v: { pct: b.v.pct, ktasTbl: b.v.ktas, ktas: kt, gph: b.v.gph, gphT: gt, sr: kt / gt, boxed: !!b.v.boxed }, warn: b.warn };
  }

  // every printed setting on the nearest page, all RPMs x both mixtures
  function allSettings(alt, dev, gw) {
    var out = [];
    ['ec', 'bp'].forEach(function (mix) {
      [2200, 2300, 2400].forEach(function (rpm) {
        C.cruiseRows(mix, rpm, alt).rows.forEach(function (r) { out.push(readRow(mix, rpm, r.map, alt, dev, gw)); });
      });
    });
    return out.filter(function (r) { return r.v; });
  }

  // OPTIMUM: the settings nothing beats on BOTH speed and fuel (see
  // Specific Range/FRONTIER-EXPLAINED.md) — a pairwise filter, no fitting
  function frontier(pts) {
    return pts.filter(function (p) {
      return !pts.some(function (q) {
        return q.v.ktas >= p.v.ktas && q.v.gphT <= p.v.gphT && (q.v.ktas > p.v.ktas || q.v.gphT < p.v.gphT);
      });
    }).sort(function (a, b) { return b.v.ktas - a.v.ktas; });
  }

  function sameSetting(a, b) {
    return a && b && a.rpm === b.rpm && a.mix === b.mix && Math.abs(a.map - b.map) < 0.05;
  }

  function lerp(x0, y0, x1, y1, x) { return x1 === x0 ? y0 : y0 + (y1 - y0) * (x - x0) / (x1 - x0); }

  // Fig 8-18 holding is 45% / 2200 / economy; the MAP and TAS for 45% come
  // from the Fig 8-15 pages (POH note) — read the 45% row on the pages that
  // bracket the altitude and interpolate MAP / KTAS / GPH between them.
  function holdSetup(alt, dev, gw) {
    var alts = D.fig8_15.altitudes, pts = [], i;
    for (i = 0; i < alts.length; i++) {
      var pg = alts[i], row = null, j;
      for (j = 0; j < pg.rows.length; j++) {
        var r = pg.rows[j];
        if (r.rpm !== 2200 || !r.std || r.std.pct == null) continue;
        if (!row || Math.abs(r.std.pct - 45) < Math.abs(row.std.pct - 45)) row = r;
      }
      if (!row || Math.abs(row.std.pct - 45) > 0.6) continue;
      var b = C.cruiseLookup('ec', 2200, row.map, pg.alt_ft, dev);
      // weight-corrected like every other KTAS on the page (owner spot check 2026-08-25)
      if (b.v) pts.push({ alt: pg.alt_ft, map: row.map, ktas: C.cruiseWeightKtasCorr(b.v.ktas, gw, pg.alt_ft), gph: b.v.gph, warn: b.warn });
    }
    if (!pts.length) return null;
    var a = Math.max(pts[0].alt, Math.min(pts[pts.length - 1].alt, alt)), lo = pts[0], hi = pts[pts.length - 1];
    for (i = 0; i < pts.length - 1; i++) if (a >= pts[i].alt && a <= pts[i + 1].alt) { lo = pts[i]; hi = pts[i + 1]; break; }
    return {
      map: lerp(lo.alt, lo.map, hi.alt, hi.map, a),
      ktas: lerp(lo.alt, lo.ktas, hi.alt, hi.ktas, a),
      gph: Math.max(lo.gph, hi.gph),   // between pages the POH takes the higher flow
      clamped: a !== alt
    };
  }

  // chart TAS -> CAS (density ratio) -> IAS (Section 5 position-error table, gear/flaps up)
  function iasFromTas(tasKt, alt, oatC) {
    var theta = (oatC + 273.15) / 288.15, sigma = C.deltaRatio(alt) / theta;
    var cas = tasKt * Math.sqrt(sigma);
    var t = D.aircraft_tables.position_error_kt.gear_flaps_up, i;
    var xs = t.cas, ys = t.ias;
    if (cas <= xs[0]) return ys[0] + (cas - xs[0]);
    if (cas >= xs[xs.length - 1]) return ys[ys.length - 1] + (cas - xs[xs.length - 1]);
    for (i = 0; i < xs.length - 1; i++) if (cas >= xs[i] && cas <= xs[i + 1]) return lerp(xs[i], ys[i], xs[i + 1], ys[i + 1], cas);
    return cas;
  }

  function iasText(kias) {
    var mph = Math.round(kias * 1.15078), kt = Math.round(kias);
    return U.store.iasUnit === 'kt' ? { v: kt, u: 'KIAS' } : { v: mph, u: 'MPH' };
  }

  // KTAS vs total gph for the page rows; POH-style box around the
  // min-fuel-flow rows; selected row ringed in --entry
  function mapChart(parent, rows, sel, bg) {
    var pts = rows.filter(function (r) { return r.v; });
    var bgp = (bg || []).filter(function (r) { return r.v; });
    if (pts.length < 2) return;
    var W = U.chartW(640), H = 170, x0 = U.isPhone() ? 30 : 46, x1 = W - 20, y0 = 16, y1 = 134;
    var kts = pts.concat(bgp).map(function (r) { return r.v.ktas; }), gs = pts.concat(bgp).map(function (r) { return r.v.gphT; });
    var kLo = Math.floor((Math.min.apply(null, kts) - 3) / 10) * 10, kHi = Math.ceil((Math.max.apply(null, kts) + 3) / 10) * 10;
    var gLo = Math.floor(Math.min.apply(null, gs) - 1), gHi = Math.ceil(Math.max.apply(null, gs) + 1);
    function X(k) { return x0 + (k - kLo) / (kHi - kLo) * (x1 - x0); }
    function Y(g) { return y1 - (g - gLo) / (gHi - gLo) * (y1 - y0); }
    var h = '', k, g, gStep = (gHi - gLo) > 12 ? 5 : 2;
    h += '<line class="crz-grid" x1="' + x0 + '" x2="' + x0 + '" y1="' + y0 + '" y2="' + y1 + '"/>';
    for (k = kLo; k <= kHi; k += 10) {
      h += '<line class="crz-grid" x1="' + X(k).toFixed(1) + '" x2="' + X(k).toFixed(1) + '" y1="' + y0 + '" y2="' + y1 + '"/>';
      h += '<text class="crz-axis" x="' + X(k).toFixed(1) + '" y="' + (y1 + 14) + '" text-anchor="middle">' + k + '</text>';
    }
    for (g = Math.ceil(gLo / gStep) * gStep; g <= gHi; g += gStep) {
      h += '<line class="crz-grid" x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(g).toFixed(1) + '" y2="' + Y(g).toFixed(1) + '"/>';
      h += '<text class="crz-axis" x="' + (x0 - 6) + '" y="' + (Y(g) + 4).toFixed(1) + '" text-anchor="end">' + g + '</text>';
    }
    h += '<text class="crz-axis" x="' + (x0 - 6) + '" y="' + (y0 - 4) + '" text-anchor="end">gph</text>';
    h += '<text class="crz-axis" x="' + x1 + '" y="' + (y1 + 30) + '" text-anchor="end">KTAS</text>';
    bgp.forEach(function (r) {
      h += '<circle class="crz-bg" cx="' + X(r.v.ktas).toFixed(1) + '" cy="' + Y(r.v.gphT).toFixed(1) + '" r="2.5"/>';
    });
    var sorted = pts.slice().sort(function (a, b) { return a.v.ktas - b.v.ktas; });
    h += '<polyline class="crz-line" points="' + sorted.map(function (r) { return X(r.v.ktas).toFixed(1) + ',' + Y(r.v.gphT).toFixed(1); }).join(' ') + '"/>';
    var bx = pts.filter(function (r) { return r.v.boxed; });
    if (bx.length) {
      var bk = bx.map(function (r) { return X(r.v.ktas); }), bg = bx.map(function (r) { return Y(r.v.gphT); });
      var rx = Math.min.apply(null, bk) - 12, ry = Math.min.apply(null, bg) - 12;
      var rw = Math.max.apply(null, bk) - rx + 12, rh = Math.max.apply(null, bg) - ry + 12;
      h += '<rect class="crz-box" x="' + rx.toFixed(1) + '" y="' + ry.toFixed(1) + '" width="' + rw.toFixed(1) + '" height="' + rh.toFixed(1) + '" rx="6"/>';
      h += '<text class="crz-boxlab" x="' + (rx + rw / 2).toFixed(1) + '" y="' + (U.isPhone() && ry < 14 ? ry + rh + 11 : ry - 4).toFixed(1) + '" text-anchor="middle">RESTRICTED LEANING</text>';   // phone: under the box when it touches the top edge
    }
    pts.forEach(function (r) {
      h += '<circle class="' + (r.v.boxed ? 'crz-ptmin' : 'crz-pt') + '" cx="' + X(r.v.ktas).toFixed(1) + '" cy="' + Y(r.v.gphT).toFixed(1) + '" r="3.5"/>';
    });
    if (sel && sel.v) {
      var sx = X(sel.v.ktas).toFixed(1), sy = Y(sel.v.gphT).toFixed(1);
      h += '<circle class="crz-selring" cx="' + sx + '" cy="' + sy + '" r="7"/><circle class="crz-sel" cx="' + sx + '" cy="' + sy + '" r="3.5"/>';
      // label sits right of the ring so it never straddles the POH box edge
      h += '<text class="crz-sellab" x="' + (X(sel.v.ktas) + 11).toFixed(1) + '" y="' + (Y(sel.v.gphT) + 4).toFixed(1) + '" text-anchor="start">' + sel.map.toFixed(1) + '"</text>';
    }
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('class', 'crz-chart');
    svg.innerHTML = h;
    parent.appendChild(svg);
  }

  function render(page) {
    var st = U.store;
    // default = predicted fuel at start of cruise (TO fuel − climb fuel; taxi
    // is already out of the DEP number via W&B). Overridden in flight here.
    var csf = U.cruiseStartFuel();
    var fuel = st.cruiseFuelGal != null ? st.cruiseFuelGal : csf.gal;
    var gw = st.zfw + fuel * 6.0;
    // cruiseAlt starts EMPTY (owner 2026-08-23) — nothing on this tab
    // calculates until it is entered
    var altOk = st.cruiseAlt != null;
    var isa = altOk ? C.isaTempC(st.cruiseAlt) : null;
    var oat = st.cruiseOat != null ? st.cruiseOat : isa;
    var dev = altOk && oat != null ? oat - isa : 0;

    // ---- conditions ----
    var s = U.sect(page, 'CRUISE CONDITIONS');
    var g = U.el('div', 'grid'); s.appendChild(g);
    U.num(g, { label: 'Pressure altitude', key: 'cruiseAlt', unit: 'ft', min: 0, max: 25000, allowNull: true });
    U.num(g, {
      label: 'OAT @ alt', unit: '°C', min: -60, max: 40, key: 'cruiseOat', allowNeg: true, size: 3, allowNull: true,
      getFn: function () { return oat; },
      setFn: function (v) { U.set('cruiseOat', v); }
    });
    U.num(g, {
      label: 'Fuel remaining <span class="chip src">edit in flight</span>', unit: 'gal', min: 0, max: 165.5, key: 'cruiseFuelGal', size: 5,
      getFn: function () { return fuel; },
      setFn: function (v) { U.set('cruiseFuelGal', v); }
    });
    if (!altOk) {
      var strip0 = U.el('div', 'statline'); strip0.style.justifyContent = 'space-around';
      strip0.appendChild(U.el('span', 'stat', '<small>Weight</small>' + U.fmtComma(gw) + ' lb'));
      s.appendChild(strip0);
    }
    if (st.cruiseFuelGal == null) {
      s.appendChild(U.el('div', 'footnote', csf.climbGal != null
        ? 'Predicted cruise-start fuel: TO ' + U.fmtN(st.fuelGal, 0) + ' − climb ' + U.fmtN(csf.climbGal, 1) + ' gal.'
        : 'Fuel defaulted to DEP takeoff fuel — climb fuel has no chart answer to deduct.'));
      U.warnChips(s, csf.warn);
    }
    if (!altOk) {
      U.awaitBlock(s, ['CRUISE PRESSURE ALT'], 120);
      return;
    }

    var rowsInfo = C.cruiseRows(st.cruiseMix, st.cruiseRpm, st.cruiseAlt);
    var strip = U.el('div', 'statline'); strip.style.justifyContent = 'space-around';
    strip.appendChild(U.el('span', 'stat' + (st.cruiseOat == null ? ' warn' : ''), '<small>ISA</small>' + (dev >= 0 ? '+' : '') + dev.toFixed(0) + '°C' +
      (st.cruiseOat == null ? ' <small>assumed</small>' : '')));
    strip.appendChild(U.el('span', 'stat', '<small>Weight</small>' + U.fmtComma(gw) + ' lb'));
    strip.appendChild(U.el('span', 'stat', '<small>Table page</small>' + U.fmtComma(rowsInfo.page_alt_ft) + ' ft'));
    // insert the strip before the footnote/chips so the entries read first
    s.insertBefore(strip, g.nextSibling);

    // ---- power setting ----
    s = U.sect(page, 'POWER SETTING');
    // POWER TABLES: the segs pick one POH page and a MAP row is tapped on it.
    // OPTIMUM: no segs — the tapped row sets RPM, mixture and MAP together,
    // so the selection can only move along the line (owner 2026-08-24).
    var opt = U.feat('crzOptimum') && st.cruiseView === 'opt';
    if (U.feat('crzOptimum')) U.subtabs(s, { key: 'cruiseView', choices: [{ v: 'tbl', label: 'POWER TABLES' }, { v: 'opt', label: 'OPTIMUM' }] });
    if (!opt) {
      g = U.el('div', 'grid'); s.appendChild(g);
      U.seg(g, { label: 'RPM', key: 'cruiseRpm', choices: [{ v: 2200, label: '2200' }, { v: 2300, label: '2300' }, { v: 2400, label: '2400' }] });
      U.seg(g, { label: 'Mixture', key: 'cruiseMix', choices: [{ v: 'bp', label: 'BEST PWR' }, { v: 'ec', label: 'ECONOMY' }] });
    }

    // page rows, highest MAP first (POH order), each read at the pilot's day
    var rows = rowsInfo.rows.slice().sort(function (a, b) { return b.map - a.map; })
      .map(function (r) { return readRow(st.cruiseMix, st.cruiseRpm, r.map, st.cruiseAlt, dev, gw); });
    var selMap = st.cruiseMap;
    if (selMap == null && rows.length) {
      // default: row nearest 65% power
      var best = rows[0];
      rows.forEach(function (r) {
        var p0 = r.v ? r.v.pct : 999, pb = best.v ? best.v.pct : 999;
        if (Math.abs(p0 - 65) < Math.abs(pb - 65)) best = r;
      });
      selMap = best.map;
    }
    // cruiseMap persists across altitude/RPM/mixture changes, so it can name a
    // MAP this page does not publish. Snap to the nearest published row and
    // say so — the number shown must be the one the pilot actually sets.
    var pages = contribPages(st.cruiseMix, st.cruiseAlt).map(function (p) { return p.alt_ft; });
    var useMap = selMap, mapFlag = null, sel = null;
    if (rows.length && useMap != null) {
      rows.forEach(function (r) { if (!sel || Math.abs(r.map - useMap) < Math.abs(sel.map - useMap)) sel = r; });
      if (Math.abs(sel.map - useMap) > 0.05) {
        mapFlag = useMap.toFixed(1) + ' not published at ' + U.fmtComma(rowsInfo.page_alt_ft) + ' ft — nearest row ' + sel.map.toFixed(1);
      }
      useMap = sel.map;
    }

    strip = U.el('div', 'statline');
    strip.appendChild(U.el('span', 'stat' + (mapFlag ? ' warn' : ''), '<small>Selected</small>' + (useMap != null ? useMap.toFixed(1) + ' inHg' : '—')));
    strip.appendChild(U.el('span', 'stat', '<small>RPM</small>' + st.cruiseRpm));
    strip.appendChild(U.el('span', 'stat', '<small>Mixture</small>' + mixName(st.cruiseMix)));
    s.appendChild(strip);
    if (mapFlag) s.appendChild(U.el('div', 'caution', mapFlag));

    var o = U.el('div', 'out five'); s.appendChild(o);
    var boxed = !!(sel && sel.v && sel.v.boxed);
    if (sel && sel.v) {
      var v = sel.v;
      // 1 dp: at 0 dp a flagged 75.4 and an unflagged 74.6 both print "75%"
      U.res(o, '% power', U.fmtN(v.pct, 1) + '<small>%</small>', v.pct > 75 ? 'warn' : null,
        v.pct > 75 ? 'above 75% — FULL RICH required' : null);
      U.res(o, 'MAP', useMap.toFixed(1) + ' <small>inHg</small>');
      U.res(o, 'KTAS', U.fmtN(v.ktas, 0), null, Math.round(v.ktas * 1.15078) + ' MPH');
      var ff = U.res(o, boxed ? 'Min fuel flow' : 'Fuel flow', U.fmtN(v.gph, 1) + ' <small>GPH/eng</small>', boxed ? 'warn' : null,
        U.fmtN(v.gphT, 1) + ' GPH total');
      if (boxed) ff.firstChild.className = 'min';
      U.res(o, 'Spec. range', U.fmtN(v.sr, 1) + ' <small>nm/gal</small>', null, 'zero wind');
    } else {
      U.res(o, '% power', '—', 'warn', 'no published table value at this setting — read the adjacent column or page');
      U.res(o, 'MAP', useMap != null ? useMap.toFixed(1) + ' <small>inHg</small>' : '—');
      U.res(o, 'KTAS', '—');
      U.res(o, 'Fuel flow', '—');
      U.res(o, 'Spec. range', '—');
    }

    if (pages.length > 1) s.appendChild(U.el('div', 'footnote', 'Fuel flow not interpolated — higher fuel flow used per POH.'));
    U.warnChips(s, ownWarns(sel ? sel.warn : [], pages,
      dayColMissing(st.cruiseMix, st.cruiseRpm, st.cruiseAlt, useMap != null ? useMap : 24, dev)));

    // leaning — numbered steps, switched by the selected cell (POH Section 8 / table notes)
    var ln = U.el('div', 'lean');
    function step(n, html) { ln.appendChild(U.el('div', 'ls', '<b>' + n + '</b><span>' + html + '</span>')); }
    if (boxed) {
      ln.appendChild(U.el('div', 'lt min', 'Leaning — minimum fuel flow setting'));
      step(1, 'Do <b class="w">not</b> lean below ' + U.fmtN(sel.v.gph, 1) + ' GPH/eng — not to peak EGT, not for any reason. Detonation risk.');
      step(2, 'If peak EGT or 1650°F is reached before ' + U.fmtN(sel.v.gph, 1) + ' GPH, stop there — further leaning prohibited.');
      step(3, 'Full rich above 75% power, at 2400 RPM, or at the max MAP shown for this RPM. Between chart pages use the higher fuel flow.');
    } else if (st.cruiseMix === 'bp') {
      ln.appendChild(U.el('div', 'lt', 'Leaning — best power'));
      step(1, 'Lean to peak EGT (not above 1650°F), then enrich by 100°F.');
      step(2, 'Add 1 GPH/eng to indicated fuel flow.');
      step(3, 'Never lean above 75% power. Full rich above 75% / 2400 RPM / max MAP. Between chart pages use the higher fuel flow.');
    } else {
      ln.appendChild(U.el('div', 'lt', 'Leaning — economy'));
      step(1, 'Lean to peak EGT (not above 1650°F) and stay at peak.');
      step(2, 'Add 1 GPH/eng to indicated fuel flow.');
      step(3, 'CHT ≤ 205°C. Never lean above 75% power. Between chart pages use the higher fuel flow.');
    }
    s.appendChild(ln);

    // ---- POWER SETTINGS: one POH page (tables) or the OPTIMUM frontier across every RPM x mixture ----
    s = U.sect(page, (opt ? 'OPTIMUM SETTINGS · ' : 'POWER TABLE · ') + U.fmtComma(rowsInfo.page_alt_ft) + ' FT PAGE');
    var every = opt ? allSettings(st.cruiseAlt, dev, gw) : null;
    var listRows = opt ? frontier(every) : rows;
    var curSel = sel ? { rpm: st.cruiseRpm, mix: st.cruiseMix, map: sel.map, v: sel.v } : null;
    if (listRows.length) {
      if (opt) {
        s.appendChild(U.el('div', 'note', 'Blue line — nothing is both faster and burns less fuel.'));
        if (curSel && !listRows.some(function (r) { return sameSetting(r, curSel); })) {
          s.appendChild(U.el('div', 'caution', 'Selected ' + (st.cruiseMix === 'ec' ? 'ECON' : 'BEST') + ' ' + st.cruiseRpm + ' / ' +
            curSel.map.toFixed(1) + '" is not on the OPTIMUM line — something is both faster and cheaper. Tap a row to move to it.'));
        }
      }
      mapChart(s, listRows, curSel, every);
      s.appendChild(U.el('div', 'mhdr', '<span class="c set">Setting</span><span class="c"></span><span class="c"></span><span class="c"></span><span class="c"></span><span class="c"></span>' +
        '<span class="c">RPM</span><span class="c">Mix</span><span class="c">MAP</span><span class="c">% pwr</span><span class="c">KTAS</span><span class="c">gph total</span><span class="c">nm/gal</span><span class="c"></span>'));
      var list = U.el('div', 'mlist'); s.appendChild(list);
      var bestSr = null;
      listRows.forEach(function (r) { if (r.v && (!bestSr || r.v.sr > bestSr.v.sr)) bestSr = r; });
      var box = null;
      listRows.forEach(function (r) {
        var isSel = opt ? sameSetting(r, curSel) : r === sel;
        var e = U.el('div', 'mrow' + (isSel ? ' sel' : ''));
        var h = '<span class="c">' + r.rpm + '</span>' +
          '<span class="c"><b class="mix ' + (r.mix === 'ec' ? 'ec' : 'bp') + '">' + (r.mix === 'ec' ? 'ECON' : 'PWR') + '</b></span>' +
          '<span class="c">' + r.map.toFixed(1) + '"</span>';
        if (r.v) {
          var sv = curSel && curSel.v ? curSel.v : null, amb = r.v.boxed ? ' amb' : '';
          function nc(val, d, cls) { return '<span class="c n' + (cls || '') + '"><span class="nv">' + val + '</span>' + (d || '<span class="md"></span>') + '</span>'; }
          h += '<span class="c">' + U.fmtN(r.v.pct, 0) + '%</span>';
          h += nc(U.fmtN(r.v.ktas, 0), sv && !isSel ? delta(r.v.ktas - sv.ktas, 0, true) : '');
          h += nc(U.fmtN(r.v.gphT, 1), sv && !isSel ? delta(r.v.gphT - sv.gphT, 1, false) : '', amb);
          h += nc(U.fmtN(r.v.sr, 1), sv && !isSel ? delta(r.v.sr - sv.sr, 1, true) : '');
        } else {
          h += '<span class="c">—</span><span class="c">—</span><span class="c">—</span><span class="c">—</span>';
        }
        h += '<span class="c tag ' + (isSel ? 'g' : 'a') + '">' + (isSel ? 'SELECTED' : (r === bestSr ? 'BEST RANGE' : '')) + '</span>';
        e.innerHTML = h;
        e.addEventListener('click', function () {
          if (opt) { U.set('cruiseRpm', r.rpm); U.set('cruiseMix', r.mix); }
          U.set('cruiseMap', r.map);
        });
        // contiguous restricted-leaning rows share one POH-style box
        if (r.v && r.v.boxed) {
          if (!box) { box = U.el('div', 'poh'); list.appendChild(box); }
          box.appendChild(e);
        } else { box = null; list.appendChild(e); }
      });
    } else {
      s.appendChild(U.el('div', 'note', 'No rows published for ' + st.cruiseRpm + ' RPM on this page.'));
    }

    // ---- altitude sweep: top leanable MAP per table page for this RPM / mixture ----
    if (U.feat('crzSweep')) {
    s = U.sect(page, 'FASTEST LEANABLE MAP &nbsp;·&nbsp; ' + st.cruiseRpm + ' <b class="mix ' + st.cruiseMix + '">' + (st.cruiseMix === 'ec' ? 'ECON' : 'PWR') + '</b>');
    var alts = (st.cruiseMix === 'ec' ? D.fig8_15 : D.fig8_14).altitudes;
    var t = U.el('table', 'tbl');
    var th = '<tr><th>PA ft</th><th>MAP</th><th>KTAS</th><th>gph</th><th>nm/gal</th><th>% pwr</th></tr>';
    alts.forEach(function (pg) {
      var top = null;
      pg.rows.forEach(function (r) {
        if (r.rpm !== st.cruiseRpm) return;
        var rr = readRow(st.cruiseMix, st.cruiseRpm, r.map, pg.alt_ft, dev, gw);
        if (rr.v && !rr.v.boxed && (!top || rr.map > top.map)) top = rr;
      });
      var cur = pg.alt_ft === rowsInfo.page_alt_ft ? ' class="hl"' : '';
      th += '<tr><td' + cur + '>' + U.fmtComma(pg.alt_ft) + '</td>' + (top
        ? '<td' + cur + '>' + top.map.toFixed(1) + '"</td><td' + cur + '>' + U.fmtN(top.v.ktas, 0) + '</td><td' + cur + '>' + U.fmtN(top.v.gphT, 1) + '</td><td' + cur + '>' + U.fmtN(top.v.sr, 1) + '</td><td' + cur + '>' + U.fmtN(top.v.pct, 0) + '%</td>'
        : '<td colspan="5">no leanable row</td>') + '</tr>';
    });
    t.innerHTML = th;
    s.appendChild(t);
    }

    // ---- endurance · holding (actual fuel remaining; owner 2026-08-25) ----
    if (U.feat('crzEndur')) {
      s = U.sect(page, 'ENDURANCE · HOLDING');
      var hold = D.aircraft_tables.holding;
      var resvGalTot = st.resvMin / 60 * hold.gph_total + st.resvGal;
      // two groups: ENDURANCE wears the SELECTED row's accent treatment and
      // restates that setting in its eyebrow; HOLDING is its own neutral group
      var pair = U.el('div', 'grp2'); s.appendChild(pair);
      var mixBadge = '<b class="mix ' + st.cruiseMix + '">' + (st.cruiseMix === 'ec' ? 'ECON' : 'PWR') + '</b>';
      var gE = U.el('div', 'grp selgrp'); pair.appendChild(gE);
      gE.appendChild(U.el('div', 'grpt', 'At ' + st.cruiseRpm + ' ' + mixBadge + ' ' + (useMap != null ? useMap.toFixed(1) + '"' : '—') +
        (sel && sel.v ? ' · ' + U.fmtN(sel.v.gphT, 1) + ' GPH' : '')));
      o = U.el('div', 'out'); gE.appendChild(o);
      if (sel && sel.v) {
        // endurance to dry tanks at the SELECTED row's fuel flow (the flow the
        // pilot actually sets); the reserve is inside that time
        var minRow = null;
        rows.forEach(function (r) { if (r.v && (!minRow || r.v.gphT < minRow.v.gphT)) minRow = r; });
        U.res(o, 'Total endurance', hrs(fuel / sel.v.gphT), null,
          'incl. ' + U.fmtN(resvGalTot, 0) + ' gal reserve' +
          (minRow === sel ? ' · lowest fuel flow on this page' : ''));
      } else {
        U.res(o, 'Total endurance', '—', 'warn', 'no published fuel flow at the selected setting');
      }
      var gH = U.el('div', 'grp'); pair.appendChild(gH);
      gH.appendChild(U.el('div', 'grpt', 'Holding · 45% · ' + hold.rpm + ' <b class="mix ec">ECON</b>'));
      o = U.el('div', 'out'); gH.appendChild(o);
      var holdFuel = Math.max(0, fuel - resvGalTot);
      var hr = U.res(o, 'Hold until reserve', hrs(holdFuel / hold.gph_total), holdFuel < 10 ? 'warn' : null,
        U.fmtN(holdFuel, 0) + ' gal above reserve · ' + hold.gph_total + ' GPH');
      // the reserve itself lives in the cell: minutes at the holding flow
      // (+ extra gallons), tap to change
      var rb = U.el('button', 'cbtn', 'RESERVE ' + st.resvMin + ' MIN' + (st.resvGal ? ' + ' + st.resvGal + ' GAL' : '') +
        ' = ' + U.fmtN(resvGalTot, 0) + ' GAL');
      rb.addEventListener('click', function () {
        U.modal('RESERVE', function (bd) {
          bd.appendChild(U.el('div', 'note', 'Minutes at the holding flow (' + hold.gph_total + ' GPH total), plus any extra gallons.'));
          var gg = U.el('div', 'grid'); gg.style.marginTop = '8px'; bd.appendChild(gg);
          U.num(gg, { label: 'Time', key: 'resvMin', unit: 'min', min: 0, max: 180, size: 3, focus: true });
          U.num(gg, { label: 'Extra fuel', key: 'resvGal', unit: 'gal', min: 0, max: 80, size: 3 });
        }, { width: '300px' });
      });
      hr.appendChild(rb);
      // holding setup at this altitude: MAP / flow / IAS for 45% power
      var hs = holdSetup(st.cruiseAlt, dev, gw);
      var hc = U.el('div', 'res hold'); o.appendChild(hc);
      hc.appendChild(U.el('label', null, 'Holding parameters'));
      if (hs) {
        var ias = iasText(iasFromTas(hs.ktas, st.cruiseAlt, oat));
        // owner's srow alignment: prefix flush left, value centered, unit flush right
        hc.appendChild(U.el('div', 'v',
          '<div class="srow"><span class="pfx">MAP</span><span class="sv">' + hs.map.toFixed(1) + '</span><span class="su">inHg</span></div>' +
          '<div class="srow"><span class="pfx">FUEL</span><span class="sv">' + U.fmtN(hs.gph, 1) + '</span><span class="su">GPH/eng</span></div>' +
          '<div class="srow"><span class="pfx">IAS</span><span class="sv">' + ias.v + '</span><span class="su">' + ias.u + '</span></div>'));
        if (hs.clamped) hc.appendChild(U.el('div', 'note', 'altitude outside the 45% rows — edge page used'));
      } else {
        hc.appendChild(U.el('div', 'v', '—'));
        hc.appendChild(U.el('div', 'note', 'no 45% row published'));
      }
    }

    // ---- descent ----
    if (U.feat('crzDescent')) {
      s = U.sect(page, 'DESCENT (FIG 8-19)');
      g = U.el('div', 'grid'); s.appendChild(g);
      U.num(g, { label: 'Level-off / dest elev (MSL)', key: 'destElev', unit: 'ft', min: 0, max: 20000 });
      if (st.altimeter == null) {
        U.awaitBlock(s, ['ALTIMETER (DEP)']);
        return;
      }
      // Fig 8-19 is a pressure-altitude chart and cruiseAlt is PA, so the MSL
      // field elevation has to be converted before the 1500 ft is added
      var loPa = C.pressureAlt(st.destElev, st.altimeter) + 1500;
      var des = C.descendBetween(st.cruiseAlt, loPa);
      o = U.el('div', 'out'); s.appendChild(o);
      if (des.v) {
        U.res(o, 'Time', U.fmtN(des.v.time_min, 0) + ' <small>min</small>');
        U.res(o, 'Fuel', U.fmtN(des.v.fuel_gal, 1) + ' <small>gal</small>');
        U.res(o, 'Distance', U.fmtN(des.v.dist_nm, 0) + ' <small>nm</small>', null, 'zero wind');
      }
      U.warnChips(s, des.warn);
      s.appendChild(U.el('div', 'footnote', '2200 / 24.0", economy, 215 KIAS, to 1500 ft above ' + U.fmtComma(st.destElev) + ' ft.'));
    }
  }

  function reserveGal() {
    // 45-min reserve at the holding fuel flow (chart note basis)
    return 0.75 * D.aircraft_tables.holding.gph_total;
  }

  function hrs(h) {
    if (h == null) return '—';
    var m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60;
    return hh + '<small>h</small>' + (mm < 10 ? '0' : '') + mm + '<small>m</small>';
  }

  UI.registerTab({
    id: 'crz', label: 'CRZ', sub: 'power·range',
    dyn: function () { return { hidden: !U.feat('crz') }; },
    render: render
  });
})();


/* tab_ldg.js — Destination landing planning. Own conditions (the destination
   field, not DEP's). Landing fuel tracks the latest CRZ fuel remaining until
   the pilot enters an override here — an entered value STICKS even when CRZ
   fuel changes afterwards (work-ahead planning); blank the field to resume
   tracking. */

(function () {
  'use strict';
  var C = Core, U = UI;

  function own(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  // page-level chip dedup, same mechanism as EMER: both landing sections run
  // the same lookups, so one off-chart condition is stated once, under the
  // first section it affects. Per-section NO CHART ANSWER banners still fail
  // closed on their own.
  function newWarns(seen, warns) {
    return (warns || []).filter(function (w) {
      if (own(seen, w)) return false;
      seen[w] = 1;
      return true;
    });
  }

  // A null distance means the POH chart has no answer for these conditions.
  // rwyGraphic simply omits that line, which reads as "fits the runway" — so
  // say it out loud and paint the legend swatch red instead of a fits colour.
  function noDataBanner(parent, entries, what) {
    var miss = [], i;
    for (i = 0; i < entries.length; i++) {
      if (entries[i].val == null) { entries[i].color = '#ff5252'; miss.push(entries[i].label); }
    }
    if (!miss.length) return false;
    parent.appendChild(U.el('div', 'banner viol',
      'NO CHART ANSWER — ' + miss.join(', ') + '. Runway fit is NOT checked for ' +
      (miss.length === entries.length ? 'any ' + what + ' distance'
        : (miss.length === 1 ? 'that distance' : 'those distances')) +
      '; see the flags below.'));
    return true;
  }

  var COND = ['ldgFieldElev', 'ldgAltimeter', 'ldgOat', 'ldgWindDir', 'ldgWindSpd', 'ldgRwyHdg', 'ldgLda'];

  function render(page) {
    var st = U.store;
    var condMiss = U.missing(COND);
    var condOk = !condMiss.length;
    var pa = st.ldgFieldElev != null && st.ldgAltimeter != null
      ? C.pressureAlt(st.ldgFieldElev, st.ldgAltimeter) : null;
    var wind = (st.ldgWindDir != null && st.ldgWindSpd != null && st.ldgRwyHdg != null)
      ? C.windComponents(st.ldgWindDir, st.ldgWindSpd, st.ldgRwyHdg) : null;
    var isaDev = pa != null && st.ldgOat != null ? st.ldgOat - C.isaTempC(pa) : null;

    // ---- conditions (pagehead + CLEAR, mirroring DEP) ----
    var hdr = U.el('div', 'pagehead');
    hdr.appendChild(U.el('h2', null, 'LANDING CONDITIONS'));
    hdr.appendChild(Airports.headerControls('ldg'));   // phase 2: [ ICAO ] [ CHOOSE RWY ] → elev / hdg / LDA
    var clr = U.el('button', 'btn sm danger', 'CLEAR…');
    clr.addEventListener('click', function () {
      var m = U.modal('CLEAR LANDING', function (b) {
        b.appendChild(U.el('div', 'note',
          'Reset landing conditions, LDA and the landing-fuel override? ' +
          'Fuel resumes tracking CRZ; weight and settings are kept.'));
        var gg = U.el('div', 'grid');
        gg.style.marginTop = '10px';
        b.appendChild(gg);
        var yes = U.el('button', 'btn danger', '✕ YES — CLEAR');
        yes.addEventListener('click', function () {
          U.resetLanding();
          if (m) m.close();
          U.set('ldgFieldElev', U.store.ldgFieldElev);   // persist + re-render
        });
        gg.appendChild(yes);
        var no = U.el('button', 'btn', 'KEEP');
        no.addEventListener('click', function () { if (m) m.close(); });
        gg.appendChild(no);
      });
    });
    hdr.appendChild(clr);
    page.appendChild(hdr);
    var s = U.el('div', 'sect'); page.appendChild(s);
    var g = U.el('div', U.isPhone() ? 'grid cond' : 'grid'); s.appendChild(g);   // phone: DEP's two tight rows
    // same entry order as DEP: wind, OAT, altimeter, field elev, runway
    U.windCell(g, 'ldgWindDir', 'ldgWindSpd');
    U.num(g, { label: 'OAT', key: 'ldgOat', unit: '°C', labelUnit: '°C', min: -40, max: 50, allowNeg: true, size: 3, allowNull: true });
    U.num(g, { label: 'Altimeter', key: 'ldgAltimeter', unit: 'inHg', labelUnit: '', dp: 2, min: 27.5, max: 31.5, size: 5, allowNull: true,
      parseFn: U.parseAltimeter });
    U.num(g, { label: 'Field elev', key: 'ldgFieldElev', unit: 'ft', labelUnit: 'ft', min: -1000, max: 10000, size: 4, allowNull: true });
    var gRwy = U.group(g);
    U.num(gRwy, { label: 'Rwy hdg', key: 'ldgRwyHdg', unit: '°M', labelUnit: '', min: 0, max: 360, size: 3, allowNull: true });
    U.num(gRwy, { label: 'LDA', key: 'ldgLda', unit: 'ft', labelUnit: 'ft', min: 1000, max: 20000, size: 5, allowNull: true });
    // derived strip — same as DEP (crosswind vs the Section 2 demo placard)
    var xwLimKt = D.aircraft_tables.limits_kt.demonstrated_crosswind_kt;
    var xwWarn = wind && xwLimKt != null && Math.abs(wind.cross) > xwLimKt;
    var strip = U.el('div', 'statline');
    strip.style.justifyContent = 'space-around';
    strip.appendChild(U.el('span', 'stat', '<small>Press alt</small>' +
      (pa == null ? '—' : U.fmtComma(pa) + ' ft')));
    strip.appendChild(U.el('span', 'stat', '<small>ISA</small>' +
      (isaDev == null ? '—' : (isaDev >= 0 ? '+' : '') + isaDev.toFixed(0) + '°C')));
    var isTail = wind && wind.head < -0.05;
    strip.appendChild(U.el('span', 'stat' + (isTail ? ' warn' : ''),
      '<small>' + (isTail ? 'TAILwind' : 'Headwind') + '</small>' +
      (wind ? Math.abs(wind.head).toFixed(0) + ' kt' : '—')));
    strip.appendChild(U.el('span', 'stat' + (xwWarn ? ' warn' : ''),
      '<small>Xwind</small>' + (wind ? Math.abs(wind.cross).toFixed(0) + ' kt ' + (wind.cross >= 0 ? 'R' : 'L') +
      (xwWarn ? ' — over ' + xwLimKt + ' kt demo' : '') : '—')));
    s.appendChild(strip);
    Airports.sourceNote(s, 'ldg');

    // ---- landing fuel & weight ----
    s = U.sect(page, 'LANDING FUEL & WEIGHT');
    g = U.el('div', 'grid'); s.appendChild(g);
    // default = what the CRZ fuel-remaining field currently shows (its entered
    // in-flight value, else the predicted cruise-start). An entry here sticks.
    var csf = U.cruiseStartFuel();
    var crzFuel = st.cruiseFuelGal != null ? st.cruiseFuelGal : csf.gal;
    var fuel = st.ldgFuelGal != null ? st.ldgFuelGal : crzFuel;
    var gw = st.zfw + fuel * D.aircraft_tables.weights.fuel_density_lb_per_gal;
    U.num(g, { label: 'Landing fuel', unit: 'gal', min: 0,
      max: U.fuelCapGal(), size: 5,
      key: 'ldgFuelGal', allowNull: true,
      chip: st.ldgFuelGal == null ? (st.cruiseFuelGal != null ? 'from CRZ' : 'predicted') : null,
      getFn: function () { return fuel; },
      setFn: function (v) { U.set('ldgFuelGal', v); } });
    // POH partial-power caution, ×2.5 on the AIR segment (same as EMER)
    var af = U.el('div', 'fld');
    af.style.marginLeft = 'auto';
    af.appendChild(U.el('label', null, 'Powered approach'));
    var arow = U.el('div', 'row');
    var ab = U.el('button', 'tgl' + (st.ldgAirX ? ' on' : ''), '+250%');
    ab.addEventListener('click', function () { U.set('ldgAirX', !st.ldgAirX); });
    arow.appendChild(ab);
    af.appendChild(arow);
    g.appendChild(af);
    var o = U.el('div', 'out'); s.appendChild(o);
    var maxLdg = D.aircraft_tables.weights.max_landing_lb;
    U.res(o, 'Landing weight', U.fmtComma(gw) + ' <small>lb</small>', gw > maxLdg ? 'bad' : null,
      gw > maxLdg ? 'OVER MAX ' + U.fmtComma(maxLdg) + ' LB' : null);
    var seen = {};   // chip texts already printed on this page
    if (st.ldgFuelGal == null && st.cruiseFuelGal == null) {
      // pure prediction — surface its caveats here too (CRZ shows the chain)
      U.warnChips(s, newWarns(seen, csf.warn));
    }
    s.appendChild(U.el('div', 'footnote',
      'Landing charts: idle power from 50-ft obstacle, max effective braking, level paved dry ' +
      'runway. POH caution: partial-power approaches can increase air distance up to 250%.'));

    if (!condOk) {
      var sw = U.sect(page, 'LANDING — FLAPS 45°');
      U.awaitBlock(sw, condMiss, 150);
      return;
    }

    renderLanding(page, 'LANDING — FLAPS 45°', D.fig8_20, D.fig8_21, st, pa, wind, gw,
      [[6000, 96], [5500, 91], [5000, 89], [4500, 85]], seen);
    if (U.feat('ldgFup')) {
      renderLanding(page, 'LANDING — FLAPS UP', D.fig8_22, D.fig8_23, st, pa, wind, gw,
        [[6000, 111], [5500, 107], [5000, 102], [4500, 98]], seen);
    }

    // balked landing
    var s2 = U.sect(page, 'BALKED LANDING (GO-AROUND)');
    var balk = C.evalClimbChart(D.fig8_11, st.ldgOat, pa, gw);
    var o2 = U.el('div', 'out'); s2.appendChild(o2);
    U.res(o2, 'Balked-ldg ROC', U.fmtComma(balk.v) + ' <small>fpm</small>',
      balk.v == null ? 'warn' : (balk.v < 200 ? 'warn' : null),
      (balk.v == null ? 'NO CHART ANSWER at these conditions — ' : '') +
      U.spdFmt(D.aircraft_tables.climb_speeds_kias.balked_landing_all_weights).main + ' · flaps 45° · gear down · both engines');
    U.warnChips(s2, newWarns(seen, balk.warn));
  }

  function renderLanding(page, title, fig50, figRoll, st, pa, wind, gw, appRows, seen) {
    var s = U.sect(page, title);
    var r50 = C.evalThreePanel(fig50, st.ldgOat, pa, gw, wind.head);
    var roll = C.evalThreePanel(figRoll, st.ldgOat, pa, gw, wind.head);
    var app = interpApproach(appRows, gw);
    // +250% air-distance option (POH caution): dashed extension on the
    // over-50 line — ground roll + 2.5 × (over-50 − ground roll)
    var dash = null;
    if (st.ldgAirX && r50.v != null && roll.v != null && r50.v > roll.v) {
      dash = roll.v + 2.5 * (r50.v - roll.v);
    }
    var entries = [
      { label: 'OVER 50\'', val: r50.v, color: '#4fa3ff', dash: dash },
      { label: 'GND ROLL', val: roll.v, color: '#2fbf7d' }
    ];
    noDataBanner(s, entries, 'landing');
    // compact APP SPD cell in line with (above, left-justified) the chart
    var o = U.el('div', 'out'); s.appendChild(o);
    var sp = U.spdFmt(app);
    var rApp = U.res(o, 'App spd', sp.main, null, sp.sub);
    rApp.style.flex = '0 1 auto';
    rApp.style.minWidth = '0';
    U.rwyGraphic(s, entries, st.ldgLda, { rwLabel: 'LDA ' + U.fmtComma(st.ldgLda) + ' FT' });
    U.warnChips(s, newWarns(seen, r50.warn.concat(roll.warn)));
    return s;
  }

  function interpApproach(rows, gw) {
    // POH's own worked example interpolates approach speed linearly by weight
    var ws = rows.map(function (r) { return r[0]; }).reverse();
    var vs = rows.map(function (r) { return r[1]; }).reverse();
    var r = Core.interp1(ws, vs, gw);
    return Math.round(r.v);
  }

  UI.registerTab({
    id: 'ldg', label: 'LDG', sub: 'land',
    dyn: function () { return { hidden: !U.feat('ldg') }; },
    render: render
  });
})();


/* tab_press.js — cabin pressurization planner (POH 9-51/9-54 method + Fig 9-23)
   and oxygen duration. Inputs track their sources (CRZ dest elev, DEP 2-eng
   climb rate, CRZ descent) until overridden here; a source chip re-syncs.
   Results in flight order: TAKEOFF · CRUISE · DESCENT. Profile SVG. */

(function () {
  'use strict';
  var C = Core, U = UI;

  // a source chip beside a tracked field: lit while tracking, tap re-syncs
  // (drops the override). Same convention as LDG's fuel "from CRZ".
  function srcChip(label, key) {
    var b = U.el('button', 'tgl' + (U.store[key] == null ? ' on' : ''), label);
    b.addEventListener('click', function () { if (U.store[key] != null) U.set(key, null); });
    return b;
  }

  // occupied W&B seats (any slot carrying weight)
  function seatsOccupied() {
    var occ = U.store.wbOcc || {}, n = 0, k;
    for (k in occ) if (Object.prototype.hasOwnProperty.call(occ, k) && occ[k] > 0) n++;
    return Math.max(1, Math.min(6, n));
  }

  function render(page) {
    var st = U.store;
    var pMiss = U.missing(['fieldElev', 'altimeter', 'oat', 'cruiseAlt']);

    if (U.feat('press')) {
    var s = U.sect(page, 'PRESSURIZATION PLAN');
    if (pMiss.length) {
      U.awaitBlock(s, pMiss.map(function (l) { return l + (l === 'CRUISE PRESSURE ALT' ? '' : ' (DEP)'); }), 120);
    } else {
    // Fig 9-23's AIRPLANE ALT axis is pressure altitude and cruiseAlt is PA
    // app-wide, so MSL elevations are converted at the DEP altimeter
    var fieldPa = C.pressureAlt(st.fieldElev, st.altimeter);
    var gw = U.grossWeight();

    // ---- tracked inputs ----
    var destElev = st.pressDestElev != null ? st.pressDestElev : st.destElev;
    var twin0 = C.evalClimbChart(D.fig8_09, st.oat, fieldPa, gw);
    var depRate = twin0.v != null ? Math.round(twin0.v) : null;
    var climbFpm = st.pressClimbFpm != null ? st.pressClimbFpm : (depRate != null ? depRate : 1000);
    var destPa = C.pressureAlt(destElev, st.altimeter);
    // CRZ descent: Fig 8-19 from cruise PA to 1500 ft above the destination
    var loPa = destPa + 1500;
    var des = C.descendBetween(st.cruiseAlt, loPa);
    var crzRate = des.v && des.v.time_min > 0 ? Math.round((st.cruiseAlt - loPa) / des.v.time_min) : null;
    var descFpm = st.pressDescFpm != null ? st.pressDescFpm : (crzRate != null ? crzRate : 1500);

    var g = U.el('div', 'grid'); s.appendChild(g);
    U.num(g, { label: 'Destination elev', key: 'pressDestElev', unit: 'ft', min: -1000, max: 10000, size: 5, allowNull: true,
      getFn: function () { return destElev; }, setFn: function (v) { U.set('pressDestElev', v); },
      extras: [srcChip('CRZ', 'pressDestElev')] });
    U.num(g, { label: 'Aircraft climb rate', key: 'pressClimbFpm', unit: 'fpm', min: 300, max: 2000, size: 4, allowNull: true,
      getFn: function () { return climbFpm; }, setFn: function (v) { U.set('pressClimbFpm', v); },
      extras: [srcChip('DEP', 'pressClimbFpm')] });
    U.num(g, { label: 'Aircraft descent rate', key: 'pressDescFpm', unit: 'fpm', min: 300, max: 2500, size: 4, allowNull: true,
      getFn: function () { return descFpm; }, setFn: function (v) { U.set('pressDescFpm', v); },
      extras: [srcChip('CRZ', 'pressDescFpm')] });

    // ---- plan ----
    // STD controller cannot select a cabin below 5,000 ft (Fig 9-23 dashed
    // STD CONTROLLER line; POH 9-51). Sea-level option: field + 1,000.
    var floor = st.cabinCtrl === 'sl' ? 0 : 5000;
    var initSel = Math.max(floor, fieldPa + 1000);
    var climb = C.cabinClimbPlan(fieldPa, st.cruiseAlt, climbFpm, initSel, null, floor);
    var destSel = Math.max(floor, destPa + 1000);
    var desc = climb.v ? C.cabinDescentPlan(st.cruiseAlt, climb.v.cabinCruise, destPa, descFpm, destSel) : { v: null, warn: [] };

    if (climb.v) {
      var ph = U.el('div', 'phases'); s.appendChild(ph);
      function phase(cap) {
        var p = U.el('div', 'phase');
        p.appendChild(U.el('div', 'cap', cap));
        var o = U.el('div', 'out'); p.appendChild(o);
        ph.appendChild(p);
        return o;
      }
      var o1 = phase('Takeoff');
      U.res(o1, 'Set cabin', U.fmtComma(initSel) + ' <small>ft</small>', null,
        initSel === floor && floor > 0 ? 'controller minimum' : 'field + 1,000');
      var cabRate = climb.v.ratefpm;
      U.res(o1, 'Cabin rate', (cabRate < 0 ? '−' : '') + U.fmtComma(Math.abs(cabRate)) + ' <small>fpm</small>',
        cabRate > 600 ? 'warn' : null, cabRate < 0 ? 'cabin descends to cruise cabin' : null);
      var o2 = phase('Cruise');
      U.res(o2, 'Cabin alt', U.fmtComma(climb.v.cabinCruise) + ' <small>ft</small>', null,
        climb.v.cabinCruise <= floor ? 'controller minimum'
          : (climb.v.cabinCruise <= initSel ? 'field + 1,000 held (above ΔP schedule)' : 'ΔP 4.25 psi'));
      U.res(o2, 'Min MAP', U.fmtN(C.minMapForCabin(climb.v.cabinCruise), 1) + ' <small>inHg</small>', null, '2200 RPM');
      var o3 = phase('Descent');
      if (desc.v) {
        U.res(o3, 'Set cabin', U.fmtComma(desc.v.target) + ' <small>ft</small>', null,
          desc.v.target === floor && floor > 0 ? 'controller minimum' : 'destination + 1,000');
        U.res(o3, 'Cabin rate', U.fmtComma(desc.v.ratefpm) + ' <small>fpm</small>');
      } else {
        U.res(o3, 'Set cabin', '—', 'warn');
      }
    }
    // comfort guidance chip removed at the owner's request (2026-08-23);
    // every other core warning still surfaces
    U.warnChips(s, climb.warn.concat(desc.warn).filter(function (w) { return !/comfort/.test(w); }));

    if (climb.v && desc.v) {
      var s2 = U.sect(page, 'PROFILE');
      s2.appendChild(profileSvg(st, fieldPa, destPa, initSel, climb.v, desc.v, climbFpm, descFpm));
      s2.appendChild(U.el('div', 'footnote', 'Solid aircraft · dashed cabin · pressure altitude.'));
    }
    } // conditions entered
    } // press feature

    // ---- oxygen ----
    if (U.feat('oxygen')) {
    var s3 = U.sect(page, 'OXYGEN (SCOTT 8500 · 11 CU FT)');
    var g3 = U.el('div', 'grid'); s3.appendChild(g3);
    var persons = st.o2Persons != null ? st.o2Persons : seatsOccupied();
    U.num(g3, { label: 'Persons', key: 'o2Persons', unit: '', min: 1, max: 6, size: 1, allowNull: true,
      getFn: function () { return persons; }, setFn: function (v) { U.set('o2Persons', v); },
      extras: [srcChip('W&B', 'o2Persons')] });
    // min 0, not 200: an empty bottle is a real gauge reading. A floor here
    // silently rewrote a typed 0 to 200 psig and printed 8 minutes of oxygen
    // that does not exist — the core's 0-psig path must reach the pilot.
    U.num(g3, { label: 'Cylinder pressure', key: 'o2Psig', unit: 'psig', min: 0, max: 1800, size: 4 });
    if (st.cruiseAlt == null) {
      U.awaitBlock(s3, ['CRUISE PRESSURE ALT']);
      return;
    }
    var dur = C.o2DurationMin(persons, st.cruiseAlt, st.o2Psig);
    var o = U.el('div', 'out'); s3.appendChild(o);
    if (dur.v != null) {
      var m = Math.round(dur.v);
      U.res(o, 'Duration @ ' + U.fmtComma(Math.min(st.cruiseAlt, 25000)) + ' ft',
        Math.floor(m / 60) + '<small>h</small>' + (m % 60 < 10 ? '0' : '') + (m % 60) + '<small>m</small>',
        m < 30 ? 'warn' : null, 'constant-flow masks');
    }
    // a partial charge is information, not a caution — the core may return it as
    // a plain note. Older cores carry it in warn; render whichever arrives, once.
    var o2Note = (dur && typeof dur.note === 'string') ? dur.note : '';
    var o2Warn = dur.warn || [];
    if (o2Note) {
      s3.appendChild(U.el('div', 'note', o2Note));
      o2Warn = o2Warn.filter(function (w) { return w !== o2Note; });
    }
    U.warnChips(s3, o2Warn);
    } // oxygen feature
  }

  // fieldPa / destPa: MSL elevations converted to pressure altitude — the whole
  // plot shares the cruise altitude's PA scale. Cabin (dashed) rides with the
  // aircraft to its takeoff selection, then runs at the planned cabin rate to
  // the cruise cabin (up OR down), holds, descends at the planned rate to the
  // destination selection, and rejoins the aircraft — Fig 9-22.
  function profileSvg(st, fieldPa, destPa, initSel, climb, desc, climbFpm, descFpm) {
    var W = U.chartW(640), H = 220, padL = 44, padR = 10, padT = 12, padB = 22;
    var climbT = climb.climbTimeMin;
    var cruiseT = 20; // representative cruise segment for the sketch
    var descT = desc.timeMin;                                   // cruise → cabin selection
    var tailT = Math.max(0, (desc.target - destPa) / descFpm); // selection → field
    var totalT = climbT + cruiseT + descT + tailT;
    var maxAlt = Math.max(st.cruiseAlt, 1000) * 1.08;

    function x(t) { return padL + (W - padL - padR) * t / totalT; }
    function y(a) { return H - padB - (H - padT - padB) * a / maxAlt; }

    var tMeet = climbT + cruiseT + descT;
    var acft = [
      [0, fieldPa], [climbT, st.cruiseAlt],
      [climbT + cruiseT, st.cruiseAlt], [tMeet, desc.target], [totalT, destPa]
    ];
    var tSel = Math.min(climbT, Math.max(0, (initSel - fieldPa) / climbFpm));
    var cab = [
      [0, fieldPa], [tSel, initSel],
      [climbT, climb.cabinCruise],           // planned rate lands the cabin as the aircraft levels
      [climbT + cruiseT, climb.cabinCruise],
      [tMeet, desc.target], [totalT, destPa]
    ];
    function path(pts) {
      return pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' ');
    }
    var gl = '';
    for (var a = 0; a <= maxAlt; a += 5000) {
      gl += '<line class="svg-grid" x1="' + padL + '" y1="' + y(a) + '" x2="' + (W - padR) + '" y2="' + y(a) + '"/>' +
        '<text class="svg-axis" x="4" y="' + (y(a) + 4) + '">' + (a / 1000) + 'k</text>';
    }
    var div = document.createElement('div');
    div.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
      gl +
      '<path d="' + path(acft) + '" fill="none" stroke="#4fa3ff" stroke-width="3"/>' +
      '<path d="' + path(cab) + '" fill="none" stroke="#3fd68f" stroke-width="2.5" stroke-dasharray="7 5"/>' +
      '<text x="' + x(climbT / 2) + '" y="' + (y(st.cruiseAlt / 2) - 8) + '" fill="#4fa3ff" font-size="11">' + U.fmtComma(climbFpm) + ' fpm</text>' +
      '<text x="' + (x(climbT / 2) - 10) + '" y="' + (y(climb.cabinCruise / 2) + 26) + '" fill="#3fd68f" font-size="11">cabin ' + Math.round(climb.ratefpm) + ' fpm</text>' +
      '<text x="' + x(climbT + cruiseT / 2) + '" y="' + (y(st.cruiseAlt) - 6) + '" fill="#4fa3ff" font-size="11" text-anchor="middle">' + U.fmtComma(st.cruiseAlt) + ' ft</text>' +
      '<text x="' + x(climbT + cruiseT / 2) + '" y="' + (y(climb.cabinCruise) - 6) + '" fill="#3fd68f" font-size="11" text-anchor="middle">cabin ' + U.fmtComma(climb.cabinCruise) + '</text>' +
      '<text x="' + (x(totalT) - 4) + '" y="' + (y(st.cruiseAlt / 2) - 8) + '" fill="#4fa3ff" font-size="11" text-anchor="end">' + U.fmtComma(descFpm) + ' fpm</text>' +
      '<text x="' + (x(totalT) - 4) + '" y="' + (y(climb.cabinCruise / 2) + 26) + '" fill="#3fd68f" font-size="11" text-anchor="end">cabin ' + Math.round(desc.ratefpm) + ' fpm</text>' +
      '</svg>';
    return div;
  }

  UI.registerTab({
    id: 'press', label: 'PRESS', sub: 'cabin·O₂',
    dyn: function () {
      var p = U.feat('press'), o = U.feat('oxygen');
      if (p && o) return { label: 'PRESS', sub: 'cabin·O₂' };
      if (o) return { label: 'O₂', sub: 'oxygen' };
      if (p) return { label: 'PRESS', sub: 'cabin' };
      return { hidden: true };
    },
    render: render
  });
})();

  // iPad-style pill switch, label left / switch right. The whole button is a

  function esc(s) {

  // "8-3" -> 8003, "9-23" -> 9023, so the list runs in POH figure order
  function figOrder(fig) {
    var m = /^(\d+)-(\d+)/.exec(String(fig));
    return m ? (+m[1]) * 1000 + (+m[2]) : 1e9;
  }

  function push1(arr, v) { if (v != null && v !== '' && arr.indexOf(v) < 0) arr.push(v); }

  // a figure split over several files (8-16 / 8-17, one page per RPM) titles each
  // page with its own RPM — keep only the shared part so a merged entry does not
  // advertise one RPM while listing three pages
  function sharedTitle(titles) {
    if (titles.length < 2) return titles[0] || '';
    var p = titles[0], i, j, cut;
    for (i = 1; i < titles.length; i++) {
      j = 0;
      while (j < p.length && j < titles[i].length && p.charAt(j) === titles[i].charAt(j)) j++;
      p = p.slice(0, j);
    }
    cut = p.search(/[,;\/-][^,;\/-]*$/);
    if (cut > 0) p = p.slice(0, cut);

    return p.length > 8 ? p : titles.join(' / ');
  }

  // Printed CONDITIONS blocks are read out of D, never copied into this file, so
  // the modal cannot drift from the chart data. Files sharing a figure number
  // collapse into one entry when their conditions match.
  function conditionGroups() {
    var byFig = {}, order = [], k, f, g, key, ck, i;
    for (k in D) {
      f = D[k];
      if (!f || !Array.isArray(f.conditions) || !f.conditions.length) continue;
      key = String(f.figure || k);
      g = byFig[key];
      if (!g) { g = byFig[key] = { fig: key, titles: [], pages: [], rpms: [], sets: [] }; order.push(g); }
      push1(g.titles, f.title);
      push1(g.pages, f.poh_page);
      push1(g.rpms, f.rpm);
      ck = f.conditions.join(' | ');
      for (i = 0; i < g.sets.length; i++) if (g.sets[i].key === ck) break;
      if (i === g.sets.length) g.sets.push({ key: ck, list: f.conditions });
    }
    order.sort(function (a, b) { return figOrder(a.fig) - figOrder(b.fig); });
    return order;
  }

  function conditionsHtml() {
    var groups = conditionGroups(), out = '', i, j, g, sub, t;
    for (i = 0; i < groups.length; i++) {
      g = groups[i];
      sub = [];
      t = sharedTitle(g.titles);
      if (t) sub.push(esc(t));
      if (g.rpms.length > 1) sub.push(g.rpms.join(' / ') + ' RPM');
      if (g.pages.length) sub.push('POH p.' + g.pages.map(esc).join(', '));
      out += '<li><b>Fig ' + esc(g.fig) + '</b>' +
        (sub.length ? ' <span class="dim">' + sub.join(' · ') + '</span>' : '');
      for (j = 0; j < g.sets.length; j++) {
        out += '<br>' + g.sets[j].list.map(esc).join(' · ');
      }
      out += '</li>';
    }
    return out ? '<ul>' + out + '</ul>'
      : '<p class="dim">No printed conditions found in the loaded chart data.</p>';
  }

/* main.js — boot */
(function () {
  'use strict';
  function start() {
    UI.boot();
    // phase 2: restore the cached NASR airport data, then prompt if none / expired
    try { Airports.init(); } catch (e) {}
    // hosted copy (phone home-screen app): keep the page cached for offline
    // use. Never runs from a file (GoodReader) — service workers need a server.
    try {
      if (typeof location !== 'undefined' && navigator.serviceWorker &&
          (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    } catch (e) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
