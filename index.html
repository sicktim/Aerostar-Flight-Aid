<script>
/* core.js — math engine.
   POLICY: all PERFORMANCE numbers come from digitized POH data (D.*) by
   interpolation only. The only computed math is standard unit/atmosphere
   conversion, documented in PLAN.md and the in-app Method note.
   Every evaluator returns {v: value|null, warn: [strings]} so off-chart
   conditions are always surfaced, never silently extrapolated. */

var Core = (function () {
  'use strict';

  // ---------- generic interpolation ----------

  function lin(x, x0, x1, y0, y1) {
    if (x1 === x0) return y0;
    return y0 + (x - x0) * (y1 - y0) / (x1 - x0);
  }

  // xs strictly monotonic (asc or desc). Returns {v, clamped}
  // A blank cell ends the printed curve, it does not erase the gridline it sits
  // beside: when x lands exactly on a gridline that HAS a printed value, that
  // value is returned even though the neighbouring cell is blank. Only a
  // bracketing whose BOTH endpoints are printed may be interpolated.
  function interp1(xs, ys, x) {
    var n = xs.length, asc, i;
    // isFinite() COERCES — isFinite(null), isFinite(''), isFinite(true) and
    // isFinite('12') are all true — so the type test has to come first or a
    // non-number walks the interval scan and returns a number.
    if (typeof x !== 'number' || !isFinite(x) || !n) return { v: null, clamped: true };
    asc = xs[n - 1] > xs[0];
    var lo = asc ? xs[0] : xs[n - 1], hi = asc ? xs[n - 1] : xs[0];
    var clamped = false, bracketed = false;
    if (x < lo) { x = lo; clamped = true; }
    if (x > hi) { x = hi; clamped = true; }
    for (i = 0; i < n - 1; i++) {
      var a = xs[i], b = xs[i + 1];
      if ((asc && x >= a && x <= b) || (!asc && x <= a && x >= b)) {
        bracketed = true;
        if (ys[i] != null && ys[i + 1] != null) return { v: lin(x, a, b, ys[i], ys[i + 1]), clamped: clamped };
      }
    }
    for (i = 0; i < n; i++) if (x === xs[i] && ys[i] != null) return { v: ys[i], clamped: clamped };
    if (bracketed) return { v: null, clamped: clamped };
    return { v: ys[n - 1], clamped: clamped };
  }

  // points: [{x:..., y:...}] sorted by x
  function interpPts(points, x, xKey, yKey) {
    var xs = [], ys = [], i;
    for (i = 0; i < points.length; i++) { xs.push(points[i][xKey]); ys.push(points[i][yKey]); }
    return interp1(xs, ys, x);
  }

  // ---------- standard conversions (documented; not performance modeling) ----------

  var KT_PER_MPH = 1 / 1.15078;
  function mphToKt(m) { return m * KT_PER_MPH; }
  function ktToMph(k) { return k * 1.15078; }

  function pressureAlt(elevFt, altimeterInHg) {
    return elevFt + (29.92 - altimeterInHg) * 1000;
  }

  function isaTempC(paFt) { return 15 - 1.9812 * paFt / 1000; }

  // standard-atmosphere pressure ratio (troposphere)
  function deltaRatio(paFt) {
    return Math.pow(1 - 6.87559e-6 * paFt, 5.2559);
  }

  // TAS from CAS: sigma = delta/theta with ACTUAL temp; TAS = CAS/sqrt(sigma).
  function tasFromCas(casKt, paFt, oatC) {
    var theta = (oatC + 273.15) / 288.15;
    var sigma = deltaRatio(paFt) / theta;
    return casKt / Math.sqrt(sigma);
  }

  // temp aloft from field conditions via standard lapse (user directive)
  function tempAloft(fieldOatC, fieldElevFt, altFt) {
    return fieldOatC - 1.9812 * (altFt - fieldElevFt) / 1000;
  }

  // POH Section 5 position error (KNOTS — N8247J book). config: 'clean' | 'landing'
  function casFromIasKt(iasKt, config) {
    var t = D.aircraft_tables.position_error_kt;
    var tab = config === 'landing' ? t.gear_down_flaps_full : t.gear_flaps_up;
    if (typeof iasKt !== 'number' || !isFinite(iasKt)) return { v: null, warn: ['IAS is not a valid number'] };
    var r = interp1(tab.ias, tab.cas, iasKt);
    return { v: r.v, warn: r.clamped ? ['position-error table edge (' + iasKt.toFixed(0) + ' KIAS)'] : [] };
  }

  function windComponents(windDirDeg, windKt, rwyHdgDeg) {
    var d = (windDirDeg - rwyHdgDeg) * Math.PI / 180;
    return { head: windKt * Math.cos(d), cross: windKt * Math.sin(d) };
  }

  // gradient conversion: ft/min -> ft/nm via ground speed (kt)
  function ftPerNm(rocFpm, gsKt) {
    if (gsKt <= 0) return null;
    return rocFpm * 60 / gsKt;
  }

  // ---------- nomograph evaluation ----------

  // OAT/PA panel: grid values[paIdx][oatIdx], possibly null off-curve
  function evalOatPanel(panel, oatC, paFt, valueKey) {
    var warn = [];
    var oats = panel.oat_c, pas = panel.pressure_alt_ft;
    var grid = panel[valueKey || 'distance_ft'] || panel.values;
    var byPa = [], i;
    for (i = 0; i < pas.length; i++) {
      var r = interp1(oats, grid[i], oatC);
      if (r.clamped) warn.push('OAT clamped to chart edge');
      byPa.push(r.v);
    }
    var r2 = interp1(pas, byPa, paFt);
    if (r2.clamped) warn.push('pressure altitude clamped to chart edge');
    if (r2.v == null) warn.push('conditions fall off the printed curves');
    return { v: r2.v, warn: dedup(warn) };
  }

  // guideline family: [{at_ref, values:[...] over xs}] — follow chart procedure:
  // enter at reference with entryVal, blend between bracketing guidelines.
  function evalGuidelines(guidelines, xs, entryVal, x) {
    var warn = [];
    if (!guidelines || !guidelines.length) return { v: null, warn: ['no guidelines digitized'] };
    var g = guidelines.slice().sort(function (a, b) { return a.at_ref - b.at_ref; });
    var lo = g[0], hi = g[g.length - 1], i;
    if (entryVal < lo.at_ref || entryVal > hi.at_ref) {
      // outside printed family: use nearest two and extrapolate the blend,
      // but tell the pilot.
      warn.push('entry value outside printed guideline family — result approximate');
    }
    var g0 = g[0], g1 = g[g.length - 1];
    for (i = 0; i < g.length - 1; i++) {
      if (entryVal >= g[i].at_ref && entryVal <= g[i + 1].at_ref) { g0 = g[i]; g1 = g[i + 1]; break; }
    }
    if (entryVal < lo.at_ref) { g0 = g[0]; g1 = g[Math.min(1, g.length - 1)]; }
    if (entryVal > hi.at_ref) { g0 = g[Math.max(0, g.length - 2)]; g1 = g[g.length - 1]; }
    var r0 = interp1(xs, g0.values !== undefined ? g0.values : g0.distance_ft, x);
    var r1 = interp1(xs, g1.values !== undefined ? g1.values : g1.distance_ft, x);
    if (r0.clamped || r1.clamped) warn.push('input clamped to chart edge');
    if (r0.v == null || r1.v == null) return { v: null, warn: warn.concat(['off printed curves']) };
    var t = (g1.at_ref === g0.at_ref) ? 0 : (entryVal - g0.at_ref) / (g1.at_ref - g0.at_ref);
    return { v: r0.v + t * (r1.v - r0.v), warn: dedup(warn) };
  }

  // full three-panel chart (takeoff/landing).
  // windKt: signed (+headwind, -tailwind)
  function evalThreePanel(fig, oatC, paFt, weightLb, windKt) {
    var warn = [];
    var base = evalOatPanel(fig.oat_panel, oatC, paFt);
    pushAll(warn, base.warn);
    if (base.v == null) return { v: null, warn: warn };
    var wp = fig.weight_panel;
    var afterW = evalGuidelines(wp.guidelines, wp.weight_lb, base.v, clampWarn(weightLb, wp.weight_lb, warn, 'weight'));
    pushAll(warn, afterW.warn);
    if (afterW.v == null) return { v: null, warn: warn };
    var res;
    if (windKt >= 0) {
      var hw = fig.wind_panel.headwind;
      res = evalGuidelines(hw.guidelines, hw.wind_kt, afterW.v, clampWarn(windKt, hw.wind_kt, warn, 'headwind'));
    } else {
      var tw = fig.wind_panel.tailwind, twKt = -windKt;
      // FAIL CLOSED past the printed tailwind fan. Clamping here would return a
      // distance up to 16 % SHORT of the trend — the one clamp that runs in the
      // unsafe direction, and unbounded (nothing stops a 60-kt entry).
      var twMax = Math.max(tw.wind_kt[0], tw.wind_kt[tw.wind_kt.length - 1]);
      if (twKt > twMax) {
        warn.push('tailwind ' + twKt.toFixed(0) + ' kt beyond the printed ' + twMax + '-kt fan — no POH data');
        return { v: null, warn: dedup(warn), afterOat: base.v, afterWeight: afterW.v };
      }
      res = evalGuidelines(tw.guidelines, tw.wind_kt, afterW.v, clampWarn(twKt, tw.wind_kt, warn, 'tailwind'));
    }
    pushAll(warn, res.warn);
    return { v: res.v, warn: dedup(warn), afterOat: base.v, afterWeight: afterW.v };
  }

  // two-panel climb chart (ROC)
  function evalClimbChart(fig, oatC, paFt, weightLb) {
    var warn = [];
    var base = evalOatPanel(fig.oat_panel, oatC, paFt, fig.oat_panel.roc_fpm ? 'roc_fpm' : undefined);
    pushAll(warn, base.warn);
    if (base.v == null) return { v: null, warn: warn };
    var wp = fig.weight_panel;
    var res = evalGuidelines(wp.guidelines, wp.weight_lb, base.v, clampWarn(weightLb, wp.weight_lb, warn, 'weight'));
    pushAll(warn, res.warn);
    return { v: res.v, warn: dedup(warn) };
  }

  // returns NaN for a non-finite input so every downstream interp1 fails closed
  function clampWarn(x, xs, warn, label) {
    if (!isFinite(x)) { warn.push(label + ' is not a valid number'); return NaN; }
    var lo = Math.min(xs[0], xs[xs.length - 1]), hi = Math.max(xs[0], xs[xs.length - 1]);
    if (x < lo) { warn.push(label + ' below chart range — clamped'); return lo; }
    if (x > hi) { warn.push(label + ' above chart range — clamped'); return hi; }
    return x;
  }

  // ---------- service ceiling (Fig 8-12) ----------
  // ceiling_panel: {oat_c:[...], weights_lb: {"4500":[pa...], ...}}
  function evalServiceCeiling(oatC, weightLb) {
    var fig = D.fig8_12, warn = [];
    var p = fig.ceiling_panel;
    var ws = Object.keys(p.weights_lb).map(Number).sort(function (a, b) { return a - b; });
    var vals = [], i;
    for (i = 0; i < ws.length; i++) {
      var r = interp1(p.oat_c, p.weights_lb[String(ws[i])], oatC);
      if (r.clamped) warn.push('OAT clamped to chart edge');
      vals.push(r.v);
    }
    var r2 = interp1(ws, vals, clampWarn(weightLb, ws, warn, 'weight'));
    return { v: r2.v, warn: dedup(warn) };
  }

  // MSL correction per chart note 2
  function ceilingMsl(paCeiling, altimeterInHg) {
    return paCeiling + (altimeterInHg - 29.92) * 1000;
  }

  // ---------- cruise (N8247J factory tables, Figs 8-14 best power / 8-15 economy) ----------
  // File shape: {altitudes:[{alt_ft, wt_corr_ktas_per_500lb, rows:[{rpm, map,
  //   cold:{pct,ktas,gph,boxed?}|null, std:{...}, hot:{...}}]}]}
  // gph is PER ENGINE. Day columns are ISA-20 / ISA / ISA+20 exactly.

  function cruiseFile(mixture) { return mixture === 'ec' ? D.fig8_15 : D.fig8_14; }

  // MAP rows available at the chart page nearest to altFt for this RPM —
  // drives the row-picker UI (mirrors reading the actual POH page).
  function cruiseRows(mixture, rpm, altFt) {
    var alts = cruiseFile(mixture).altitudes, best = alts[0], i;
    for (i = 1; i < alts.length; i++) {
      if (Math.abs(alts[i].alt_ft - altFt) < Math.abs(best.alt_ft - altFt)) best = alts[i];
    }
    var rows = [];
    for (i = 0; i < best.rows.length; i++) if (best.rows[i].rpm === rpm) rows.push(best.rows[i]);
    return { page_alt_ft: best.alt_ft, rows: rows };
  }

  // blend a row's day columns to the actual ISA deviation. A printed dash means
  // the tables stop publishing at that setting on that day — they run 45 % to
  // 75 % power, so a dashed COLD cell sits ABOVE the 75 % top (more power and
  // MORE fuel flow than the standard column beside it) and a dashed HOT cell
  // below the 45 % floor. Substituting the published neighbour wholesale
  // under-reads fuel flow and hides the >75 % FULL RICH caution, so rebuild the
  // dashed column by reflecting the two columns that ARE printed — they are
  // ISA-20 / ISA / ISA+20, evenly spaced — and keep, per quantity, whichever of
  // the two readings is the conservative one: HIGHER fuel flow, HIGHER %power,
  // LOWER KTAS. Always warned; never less conservative than the printed cell.
  function cruiseDayBlend(row, dev, warn) {
    function cell(name) { return row[name] || null; }
    var c = cell('cold'), s = cell('std'), h = cell('hot');
    function rebuild(near, far, missName, used) {
      // only chip it when the rebuilt column actually carries weight: the cold
      // column is read for dev < 0, the hot column for dev > 0. At dev 0 the
      // answer is the printed standard column and the chip would be false.
      if (used) warn.push(missName + '-day column not published at this setting — conservative estimate from the printed columns');
      if (!far) return near;
      return {
        pct: Math.max(near.pct, 2 * near.pct - far.pct),
        ktas: Math.min(near.ktas, 2 * near.ktas - far.ktas),
        gph: Math.max(near.gph, 2 * near.gph - far.gph),
        boxed: !!(near.boxed || far.boxed)
      };
    }
    if (s) {
      var c0 = c, h0 = h;
      if (!c0) c = rebuild(s, h0, 'cold', dev < 0);
      if (!h0) h = rebuild(s, c0, 'hot', dev > 0);
    }
    function pick2(fLo, fHi, t, loName, hiName) {
      if (fLo && fHi) return { lo: fLo, hi: fHi, t: t };
      if (!fLo && fHi) { warn.push(loName + '-day column not published at this setting — using ' + hiName); return { lo: fHi, hi: fHi, t: 0 }; }
      if (fLo && !fHi) { warn.push(hiName + '-day column not published at this setting — using ' + loName); return { lo: fLo, hi: fLo, t: 0 }; }
      return null;
    }
    var sel = dev <= 0 ? pick2(c, s, (dev + 20) / 20, 'cold', 'standard')
                       : pick2(s, h, dev / 20, 'standard', 'hot');
    if (!sel) return null;
    function f(k) { return lin(sel.t, 0, 1, sel.lo[k], sel.hi[k]); }
    return {
      pct: f('pct'), ktas: f('ktas'), gph: f('gph'),
      boxed: !!(sel.lo.boxed || sel.hi.boxed)
    };
  }

  // Full lookup at (rpm, target MAP, altitude, ISA dev). Per the POH
  // between-charts rule, FUEL FLOW takes the HIGHER of the two bracketing
  // altitude pages; %power and KTAS interpolate linearly.
  function cruiseLookup(mixture, rpm, mapInHg, altFt, isaDevC) {
    var warn = [];
    var alts = cruiseFile(mixture).altitudes;
    var xs = alts.map(function (a) { return a.alt_ft; });
    altFt = clampWarn(altFt, xs, warn, 'altitude');
    if (!isFinite(altFt)) return { v: null, warn: dedup(warn) };
    if (!isFinite(mapInHg)) return { v: null, warn: dedup(warn.concat(['manifold pressure is not a valid number'])) };
    var dev = isaDevC;
    if (!isFinite(dev)) return { v: null, warn: dedup(warn.concat(['ISA deviation is not a valid number'])) };
    if (dev < -20) { dev = -20; warn.push('colder than table cold-day column — clamped to ISA-20'); }
    if (dev > 20) { dev = 20; warn.push('hotter than table hot-day column — clamped to ISA+20'); }

    // reading of one altitude page at the target MAP (interpolating across the
    // page's MAP rows for this RPM)
    function pageRead(page) {
      var rows = [], i;
      for (i = 0; i < page.rows.length; i++) if (page.rows[i].rpm === rpm) rows.push(page.rows[i]);
      if (!rows.length) return null;
      rows.sort(function (a, b) { return a.map - b.map; });
      var maps = rows.map(function (r) { return r.map; });
      var m = mapInHg;
      if (m < maps[0]) { m = maps[0]; warn.push('MAP below page rows at ' + U0(page.alt_ft) + ' ft — clamped'); }
      if (m > maps[maps.length - 1]) { m = maps[maps.length - 1]; warn.push('MAP above page rows at ' + U0(page.alt_ft) + ' ft — clamped'); }
      var lo = rows[0], hi = rows[rows.length - 1], i2;
      for (i2 = 0; i2 < rows.length - 1; i2++) {
        if (m >= rows[i2].map && m <= rows[i2 + 1].map) { lo = rows[i2]; hi = rows[i2 + 1]; break; }
      }
      var bLo = cruiseDayBlend(lo, dev, warn), bHi = cruiseDayBlend(hi, dev, warn);
      if (!bLo || !bHi) return null;
      var t = hi.map === lo.map ? 0 : (m - lo.map) / (hi.map - lo.map);
      return {
        pct: lin(t, 0, 1, bLo.pct, bHi.pct),
        ktas: lin(t, 0, 1, bLo.ktas, bHi.ktas),
        gph: lin(t, 0, 1, bLo.gph, bHi.gph),
        // ▣ means do-not-lean: it must survive from EVERY row that contributes
        boxed: !!((t < 1 && bLo.boxed) || (t > 0 && bHi.boxed))
      };
    }
    function U0(n) { return String(Math.round(n)); }

    var loP = alts[0], hiP = alts[alts.length - 1], i;
    for (i = 0; i < alts.length - 1; i++) {
      if (altFt >= alts[i].alt_ft && altFt <= alts[i + 1].alt_ft) { loP = alts[i]; hiP = alts[i + 1]; break; }
    }
    var rLo = pageRead(loP), rHi = pageRead(hiP);
    if (!rLo && !rHi) return { v: null, warn: dedup(warn.concat(['no table rows for ' + rpm + ' RPM'])) };
    if (!rLo) rLo = rHi;
    if (!rHi) rHi = rLo;
    var t = hiP.alt_ft === loP.alt_ft ? 0 : (altFt - loP.alt_ft) / (hiP.alt_ft - loP.alt_ft);
    var betweenPages = t > 0.01 && t < 0.99;
    var v = {
      pct: lin(t, 0, 1, rLo.pct, rHi.pct),
      ktas: lin(t, 0, 1, rLo.ktas, rHi.ktas),
      gph: betweenPages ? Math.max(rLo.gph, rHi.gph) : lin(t, 0, 1, rLo.gph, rHi.gph),
      // ▣ do-not-lean survives from EVERY page that contributes to the blend
      boxed: !!((t < 1 && rLo.boxed) || (t > 0 && rHi.boxed))
    };
    if (betweenPages) warn.push('between altitude pages — HIGHER fuel flow of the two used (POH rule)');
    return { v: v, warn: dedup(warn) };
  }

  // Cruise-table note 1: TAS increases for weight below the 6000-lb chart
  // basis at a PER-ALTITUDE rate (1.0 kt/500 lb at SL → 5.0 at 25,000 ft),
  // read from the per-page footnote rates stored in the data.
  function cruiseWeightKtasCorr(ktas, weightLb, altFt) {
    var alts = (D.fig8_14 && D.fig8_14.altitudes) || [];
    var rate = 3; // safe fallback if data missing
    if (alts.length) {
      var xs = alts.map(function (a) { return a.alt_ft; });
      var ys = alts.map(function (a) { return a.wt_corr_ktas_per_500lb != null ? a.wt_corr_ktas_per_500lb : 3; });
      var r = interp1(xs, ys, altFt == null ? 0 : altFt);
      if (r.v != null) rate = r.v;
    }
    var w = Math.min(6000, Math.max(4500, weightLb));
    return ktas + rate * (6000 - w) / 500;
  }

  // ---------- range / endurance profiles ----------
  // file: {best_power:{curves:[{map_inhg, points:[{alt_ft, range_nm|endurance_hr}]}]}, economy:{...}}
  function profileAtAltitude(file, mixture, altFt, yKey) {
    var curves = file[mixture].curves, out = [], i;
    for (i = 0; i < curves.length; i++) {
      var c = curves[i];
      var xs = c.points.map(function (p) { return p.alt_ft; });
      var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
      if (altFt < lo - 250 || altFt > hi + 250) { out.push({ map: c.map_inhg, v: null }); continue; }
      var r = interpPts(c.points, Math.max(lo, Math.min(hi, altFt)), 'alt_ft', yKey);
      out.push({ map: c.map_inhg, v: r.v });
    }
    return out;
  }

  function profileBest(file, mixture, yKey) {
    var curves = file[mixture].curves, best = null, i, j;
    for (i = 0; i < curves.length; i++) {
      var c = curves[i];
      for (j = 0; j < c.points.length; j++) {
        var p = c.points[j];
        if (!best || p[yKey] > best.value) best = { map: c.map_inhg, alt_ft: p.alt_ft, value: p[yKey] };
      }
    }
    return best;
  }

  // ---------- time/fuel/distance to climb & descend ----------

  // Fig 8-19 descend: single curve {time_min:[], fuel_gal:[], dist_nm:[]} vs pressure_alt_ft
  function descendBetween(hiFt, loFt) {
    var f = D.fig8_19, warn = [];
    if (!isFinite(hiFt) || !isFinite(loFt)) return { v: null, warn: ['descent altitudes are not valid numbers'] };
    if (hiFt <= loFt) return { v: null, warn: ['level-off at or above initial altitude'] };
    var xs = f.pressure_alt_ft;
    var curve = f.curves[Object.keys(f.curves)[0]];
    var hiC = clampWarn(hiFt, xs, warn, 'altitude'), loC = clampWarn(loFt, xs, warn, 'altitude');
    // both ends off the same edge of the chart would print a zero-fuel descent
    if (hiC === loC) return { v: null, warn: dedup(warn.concat(['both altitudes clamp to the same edge of Fig 8-19 — no descent to read'])) };
    function at(alt, key) { return interp1(xs, curve[key], alt).v; }
    return {
      v: {
        time_min: at(hiC, 'time_min') - at(loC, 'time_min'),
        fuel_gal: at(hiC, 'fuel_gal') - at(loC, 'fuel_gal'),
        dist_nm: at(hiC, 'dist_nm') - at(loC, 'dist_nm')
      },
      warn: dedup(warn)
    };
  }

  // Fig 8-13 climb — difference of readings at final and initial (OAT, PA).
  // The file's oat_panel maps (OAT, PA) -> effective altitude (grid
  // effective_alt_ft[paIdx][oatIdx]); weight curves are read at that
  // effective altitude, exactly as the chart is traced by hand.
  function climbEffAlt(f, pa, oat, warn) {
    var op = f.oat_panel;
    if (!op || !op.effective_alt_ft) return pa;
    var byPa = [], i;
    for (i = 0; i < op.pressure_alt_ft.length; i++) {
      var r = interp1(op.oat_c, op.effective_alt_ft[i], oat);
      if (r.clamped) warn.push('OAT clamped to Fig 8-13 chart edge');
      byPa.push(r.v);
    }
    var r2 = interp1(op.pressure_alt_ft, byPa, pa);
    if (r2.clamped) warn.push('altitude clamped to Fig 8-13 chart edge');
    return r2.v;
  }

  function climbBetween(weightLb, pa0, oat0, pa1, oat1) {
    var f = D.fig8_13, warn = [];
    if (!(pa1 > pa0)) return { v: null, warn: ['cruise altitude at or below departure altitude'] };
    // Fig 8-13 prints 4500/5000/5500/6000 lb only — clamp, never extrapolate
    var wKeys = Object.keys(f.curves).map(Number).sort(function (a, b) { return a - b; });
    var wt = clampWarn(weightLb, wKeys, warn, 'weight');
    if (!isFinite(wt)) return { v: null, warn: dedup(warn) };
    function reading(pa, oat) {
      var eff = climbEffAlt(f, pa, oat, warn);
      var w = nearestWeights(f, wt);
      var res = {}, keys = ['time_min', 'fuel_gal', 'dist_nm'];
      for (var k = 0; k < keys.length; k++) {
        var v0 = interpPts(f.curves[w.lo].points, eff, 'alt_ft', keys[k]).v;
        var v1 = interpPts(f.curves[w.hi].points, eff, 'alt_ft', keys[k]).v;
        res[keys[k]] = lin(wt, w.loW, w.hiW, v0, v1);
      }
      return res;
    }
    var a = reading(pa1, oat1), b = reading(pa0, oat0);
    return {
      v: { time_min: a.time_min - b.time_min, fuel_gal: a.fuel_gal - b.fuel_gal, dist_nm: a.dist_nm - b.dist_nm },
      warn: dedup(warn)
    };
  }

  function nearestWeights(f, weightLb) {
    var keys = Object.keys(f.curves).map(Number).sort(function (a, b) { return a - b; });
    var lo = keys[0], hi = keys[keys.length - 1], i;
    for (i = 0; i < keys.length - 1; i++) {
      if (weightLb >= keys[i] && weightLb <= keys[i + 1]) { lo = keys[i]; hi = keys[i + 1]; break; }
    }
    if (weightLb <= keys[0]) { lo = keys[0]; hi = keys[Math.min(1, keys.length - 1)]; }
    if (weightLb >= keys[keys.length - 1]) { lo = keys[keys.length - 2]; hi = keys[keys.length - 1]; }
    return { lo: String(lo), hi: String(hi), loW: lo, hiW: hi };
  }

  // ---------- pressurization (Fig 9-23 + POH 9-51/9-54 method) ----------

  function cabinAltForAircraft(acftAltFt) {
    var line = D.fig9_23.controller_line.points; // [{cabin_alt_ft, airplane_alt_ft}]
    var xs = line.map(function (p) { return p.airplane_alt_ft; });
    var ys = line.map(function (p) { return p.cabin_alt_ft; });
    if (acftAltFt <= Math.min.apply(null, xs)) return 0; // below max-dP line: cabin can hold SL
    return interp1(xs, ys, acftAltFt).v;
  }

  function minMapForCabin(cabinAltFt) {
    if (cabinAltFt >= 5200) return 20.0; // POH note
    var line = D.fig9_23.map_line.points; // [{cabin_alt_ft, map_inhg}]
    var xs = line.map(function (p) { return p.cabin_alt_ft; });
    var ys = line.map(function (p) { return p.map_inhg; });
    return interp1(xs, ys, cabinAltFt).v;
  }

  // POH climb method (9-51): cabin rate so cabin levels as/before airplane.
  // cabinFloor: the controller's minimum selectable cabin altitude — 5,000 ft
  // for the STANDARD controller (Fig 9-23's dashed STD CONTROLLER line runs
  // vertically at cabin 5,000 up to the 4.25-psi line), 0 for the sea-level
  // controller. Both share the same 4.25-psi schedule above it.
  function cabinClimbPlan(fieldElev, cruiseAlt, acftRateFpm, cabinSelInit, cruiseCabinSel, cabinFloor) {
    var warn = [];
    // Owner rule (2026-08-29): cruise cabin never below the initial selection
    // (field + 1,000) — the cabin never descends during the aircraft climb.
    var minCabin = Math.max(cabinFloor || 0, cabinAltForAircraft(cruiseAlt), cabinSelInit || 0);
    var cabinCruise = cruiseCabinSel != null ? cruiseCabinSel : Math.ceil(minCabin / 100) * 100;
    if (cabinCruise < minCabin - 25) {
      warn.push('selected cruise cabin below max-ΔP line — raised to minimum');
      cabinCruise = Math.ceil(minCabin / 100) * 100;
    }
    var climbTimeTotal = (cruiseAlt - fieldElev) / acftRateFpm;
    var timeToSel = Math.max(0, (cabinSelInit - fieldElev) / acftRateFpm);
    var remain = climbTimeTotal - timeToSel;
    if (remain <= 0) return { v: null, warn: ['cruise altitude below initial cabin selection'] };
    var rate = (cabinCruise - cabinSelInit) / remain;
    if (rate > 1000) warn.push('required cabin rate exceeds controller ~1000 fpm max');
    return { v: { cabinCruise: cabinCruise, ratefpm: rate, climbTimeMin: climbTimeTotal, minCabin: minCabin }, warn: warn };
  }

  // POH descent method (9-54, "simple way"): direct descent, meet at destination.
  function cabinDescentPlan(cruiseAlt, cruiseCabin, destElev, acftRateFpm, destCabinSel) {
    var warn = [];
    var target = destCabinSel != null ? destCabinSel : destElev + 1000;
    var t = (cruiseAlt - target) / acftRateFpm;
    if (t <= 0) return { v: null, warn: ['descent geometry invalid'] };
    var rate = (cruiseCabin - target) / t;
    if (rate < 0) warn.push('cabin must climb during descent (destination above cruise cabin)');
    if (rate > 500) warn.push('cabin descent rate exceeds comfort guidance (~300 fpm ideal)');
    return { v: { target: target, ratefpm: rate, timeMin: t }, warn: warn };
  }

  // ---------- oxygen ----------

  // Fig 9-27 plate: the cylinder is CHARGED TO 1800 PSIG, which is where the
  // Fig 9-28 line terminates at 100 % capacity. Read it off the chart.
  function o2FullChargePsi() {
    var f = D.fig9_28, pts = f && f.line && f.line.points;
    if (pts && pts.length) {
      var last = pts[pts.length - 1];
      if (typeof last.gage_psi === 'number' && last.gage_psi > 0) return last.gage_psi;
    }
    return 1800;
  }

  // Fig 9-28 "Capacity VS Oxygen Pressure" read in the direction the app uses:
  // supply-gauge psig in, percent of cylinder capacity out. Null if the figure
  // is not in this build.
  function o2PctCapacity(psig) {
    var f = D.fig9_28, pts = f && f.line_by_pressure && f.line_by_pressure.points;
    if (!pts || !pts.length) return null;
    return interpPts(pts, psig, 'gage_psi', 'pct_capacity').v;
  }

  function o2DurationMin(persons, altFt, pressurePsig) {
    var t = D.aircraft_tables.oxygen_duration, warn = [];
    var alts = t.altitudes_ft;
    var row = t.persons[String(persons)];
    if (!row) return { v: null, warn: ['persons 1-6 only'] };
    var mins = row.map(function (s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); });
    var a = altFt;
    if (a < alts[0]) { a = alts[0]; warn.push('below 8000 ft — using 8000 ft column'); }
    if (a > alts[alts.length - 1]) { a = alts[alts.length - 1]; warn.push('above 25,000 ft column — clamped'); }
    var base = interp1(alts, mins, a).v;
    // null base * a fraction would be 0 in JS — a printed 0h00m duration is a
    // WRONG answer, not a missing one
    if (base == null) return { v: null, warn: warn.concat(['altitude is not a valid number']) };
    // 0 psig is an EMPTY bottle, not an unstated one — only a missing entry
    // may be read as the full charge
    var full = o2FullChargePsi();
    var psig = pressurePsig == null ? full : pressurePsig;
    if (typeof psig !== 'number' || !isFinite(psig) || psig < 0) {
      return { v: null, warn: warn.concat(['bottle pressure is not a valid psig reading']) };
    }
    // the printed line stops at the full charge — above it there is no chart
    if (psig > full) { psig = full; warn.push('above the ' + full + ' psig full charge — clamped to 100 % of capacity'); }
    // POH 9-59 procedure: convert the gauge reading to percent of capacity on
    // Fig 9-28 and multiply the Fig 9-27 duration by it. Read the chart, don't
    // model it — the ratio is against the chart's own full-charge reading.
    var pctAt = o2PctCapacity(psig), pctFull = o2PctCapacity(full), frac;
    if (pctAt == null || pctFull == null || !(pctFull > 0)) {
      frac = psig / full;
      warn.push('Fig 9-28 not in this build — duration scaled by pressure/' + full);
    } else {
      frac = pctAt / pctFull;
    }
    if (frac < 0) frac = 0;
    if (frac > 1) frac = 1;
    // A serviced bottle rarely reads exactly the full-charge psig, so a partial
    // charge is NORMAL, not a hazard — it is informational, not a warning. Only
    // an empty or invalid/over-pressure reading is worth flagging amber (above).
    var note = null;
    if (frac === 0) warn.push('bottle empty (0 psig) — no oxygen available');
    else if (frac < 1) note = 'partial charge: ' + (frac * 100).toFixed(0) + ' % of capacity (Fig 9-28)';
    return { v: base * frac, warn: warn, note: note };
  }

  // ---------- stall ----------
  function stallSpeeds(weightLb, flaps, bankDeg) {
    var t = D.aircraft_tables.stall_speeds_kias_kcas, warn = [];
    var rows = t.configs.filter(function (c) { return c.flaps === flaps; });
    if (!rows.length) return { v: null, warn: ['no stall data for flaps ' + flaps] };
    rows.sort(function (a, b) { return a.weight_lb - b.weight_lb; });
    var ws = rows.map(function (r) { return r.weight_lb; });
    var w = clampWarn(weightLb, ws, warn, 'weight');
    var banks = t.bank_deg;
    var b = clampWarn(bankDeg, banks, warn, 'bank angle');
    function speedAt(kind) { // kind 0=IAS,1=CAS
      var perW = rows.map(function (r) {
        var ys = r.speeds.map(function (s) { return s[kind]; });
        return interp1(banks, ys, b).v;
      });
      return interp1(ws, perW, w).v;
    }
    return { v: { ias_kt: speedAt(0), cas_kt: speedAt(1) }, warn: dedup(warn) };
  }

  // ---------- weight & balance (N8247J POH Section 7 certified method) ----------
  // Pure arithmetic on documented arms/limits — the certificated moment method.
  // The Section 9 "tanks seek a common level" simultaneous-feed model that used
  // to drive the displayed CG track has been RETIRED (owner-corrected 2026-08-21):
  // the certified compliance check in POH 7-1/7-2 is the straight-line check
  // between the takeoff (max-fuel) point and a minimum-fuel point, not a feed
  // physics simulation. See D.wb_n8247j.fuel.burn_model.historical for the old
  // model's description, kept for provenance only — nothing below reads it.

  function wbData() { return D.wb_n8247j; }

  function wbFwdLimit(w) {
    var pts = wbData().envelope.fwd_limit;
    var xs = pts.map(function (p) { return p.wt; }), ys = pts.map(function (p) { return p.cg; });
    return interp1(xs, ys, w).v;
  }
  function wbAftLimit(w) {
    var pts = wbData().envelope.aft_limit;
    var xs = pts.map(function (p) { return p.wt; }), ys = pts.map(function (p) { return p.cg; });
    return interp1(xs, ys, w).v;
  }

  // Owner-specified fueling order (POH 7-1 placard: no wing fuel unless the
  // fuselage tank is full) with the optional +20 gal fuselage modification
  // (UNVERIFIED — data.fus_mod — default OFF, see wb_n8247j.json):
  //   1. fuselage up to its base capacity (41.5 gal)
  //   2. wings, filled EVENLY, up to fuel.wing_usable_gal_per_side each (62.0)
  //   3. overflow into the fuselage mod capacity (+20 gal), ONLY if modOn
  //   4. anything left over is unusable — clamp to max capacity and warn
  // Returns { wingL_gal, wingR_gal, fus_gal, clampedTo, warn }.
  // clampedTo is the max distributable total (gal) when totalGal exceeded it,
  // else null. wingL_gal/wingR_gal are always equal (this function distributes
  // evenly by fill order; per-tank MANUAL entry after the fact is done by
  // calling wbState directly with whatever wingL_gal/wingR_gal the pilot types).
  function wbDistributeFuel(totalGal, modOn) {
    var f = wbData().fuel, warn = [];
    var fusCap = f.fus_usable_gal;
    var wingEachCap = f.wing_usable_gal_per_side;
    var modExtra = (modOn && f.fus_mod) ? f.fus_mod.extra_gal : 0;
    var maxTotal = fusCap + wingEachCap * 2 + modExtra;
    var total = (typeof totalGal === 'number' && isFinite(totalGal)) ? totalGal : 0;
    if (total < 0) total = 0;
    var clampedTo = null;
    if (total > maxTotal) {
      clampedTo = maxTotal;
      warn.push('total fuel exceeds usable capacity (' + maxTotal.toFixed(1) + ' gal' +
        (modOn ? ', fuselage mod ON' : '') + ') — clamped');
      total = maxTotal;
    }
    var remain = total;
    var fus = Math.min(fusCap, remain);
    remain -= fus;
    var wingEach = Math.min(wingEachCap, remain / 2);
    remain -= wingEach * 2;
    if (modOn && remain > 0) {
      var extra = Math.min(modExtra, remain);
      fus += extra;
      remain -= extra;
    }
    return { wingL_gal: wingEach, wingR_gal: wingEach, fus_gal: fus, clampedTo: clampedTo, warn: warn };
  }

  // Configured empty weight/moment from the licensed figures and the cabin
  // furniture as installed (movable seats, 1.2.1.wb.1). units: [{weight,
  // stdArm, arm}] — stdArm is the arm the seat occupies in the licensed
  // (weighed) configuration, arm its CURRENT arm; arm null/undefined = the
  // seat is removed. A removed seat comes out of both weight and moment at
  // stdArm; a moved seat keeps its weight and shifts moment by
  // weight × (arm − stdArm). Returns plain { ew, moment, cg }.
  function wbConfigEmpty(emptyW, emptyMoment, units) {
    var ew = emptyW, m = emptyMoment, i, u;
    for (i = 0; i < units.length; i++) {
      u = units[i];
      if (u.arm == null) { ew -= u.weight; m -= u.weight * u.stdArm; }
      else if (u.arm !== u.stdArm) { m += u.weight * (u.arm - u.stdArm); }
    }
    return { ew: ew, moment: m, cg: ew > 0 ? m / ew : 0 };
  }

  // One loading state → weight/moment/CG + per-tank echo.
  // loads: { emptyW, emptyMoment (lb-in), items:[{wt, arm}],
  //          wingL_gal, wingR_gal, fusGal }
  //   — wingL_gal/wingR_gal are the SEPARATE left/right wing tanks (both use
  //     fuel.wing_arm_in, the tanks are laterally symmetric so only total wing
  //     fuel affects longitudinal CG, but the split is preserved on the return
  //     for the UI to render two independent tank gauges).
  //   — back-compat: a single combined `wingGal` (old field name) is still
  //     accepted in place of wingL_gal/wingR_gal and is split 50/50 on return.
  // Returns { weight, moment (lb-in), cg, wingL_gal, wingR_gal, fusGal, fuelGal }.
  function wbState(loads) {
    var d = wbData(), den = d.fuel.density_lb_per_gal;
    var w = loads.emptyW, m = loads.emptyMoment, i;
    for (i = 0; i < loads.items.length; i++) {
      w += loads.items[i].wt; m += loads.items[i].wt * loads.items[i].arm;
    }
    var hasSplit = loads.wingL_gal != null || loads.wingR_gal != null;
    var wingL = hasSplit ? (loads.wingL_gal || 0) : (loads.wingGal || 0) / 2;
    var wingR = hasSplit ? (loads.wingR_gal || 0) : (loads.wingGal || 0) / 2;
    var wingGal = wingL + wingR;
    var fusGal = loads.fusGal != null ? loads.fusGal : 0;
    w += wingGal * den; m += wingGal * den * d.fuel.wing_arm_in;
    w += fusGal * den; m += fusGal * den * d.fuel.fus_arm_in;
    var cg = w > 0 ? m / w : 0;
    return { weight: w, moment: m, cg: cg,
             wingL_gal: wingL, wingR_gal: wingR, fusGal: fusGal, fuelGal: wingGal + fusGal };
  }

  // A non-finite weight makes the envelope readers return null, and a non-finite
  // CG makes every comparison false. Either way the envelope was NOT checked —
  // say so and fail closed (ok:false), never print a silent pass.
  function wbCheck(stt, opts) {
    var d = wbData(), v = [], warn = [];
    var fwd = wbFwdLimit(stt.weight), aft = wbAftLimit(stt.weight);
    var cgOk = typeof stt.cg === 'number' && isFinite(stt.cg);
    var maxW = (opts && opts.maxW) != null ? opts.maxW : d.limits.max_takeoff_lb;
    if (stt.weight > maxW + 0.5) v.push('over max weight ' + maxW + ' lb');
    if (fwd == null || aft == null) warn.push('weight not a valid number — envelope not checked');
    else if (!cgOk) warn.push('CG not a valid number — envelope not checked');
    else {
      if (stt.cg < fwd - 0.005) v.push('CG forward of limit (' + fwd.toFixed(2) + ' in)');
      if (stt.cg > aft + 0.005) v.push('CG aft of limit (' + aft.toFixed(2) + ' in)');
    }
    var checked = !warn.length;
    return { ok: !v.length && checked, violations: v, warn: warn,
             fwdLimit: fwd, aftLimit: aft,
             fwdMargin: checked ? stt.cg - fwd : null,
             aftMargin: checked ? aft - stt.cg : null };
  }

  // POH 7-1/7-2 certified straight-line check: the compliance method computes
  // the loading TWICE — once at max fuel (takeoff, most rearward CG) and once
  // at minimum fuel (landing, most forward CG) — and requires BOTH points to
  // fall inside the envelope. This builds that segment for the CG-vs-weight
  // chart: the TAKEOFF point using the ACTUAL per-tank fuel entered, the
  // ZERO-FUEL point (same load, no fuel — always computed, never omitted) as
  // the line's other end, and a LANDING marker placed BY LINEAR INTERPOLATION
  // on that line at the given landing weight (clamped between the zero-fuel
  // and takeoff weights).
  // NOTE: this is the certified straight-line MODEL, not a fuel-feed
  // simulation — it does not reproduce the POH 7-2 sample problem's own
  // Point II exactly, because that point assumes the 24.6 gal reserve sits
  // entirely in the fuselage tank (see wb_n8247j.json validation.reserve_note)
  // rather than being interpolated proportionally along the line. QA checks
  // Point I/Point II directly via wbState with the sample's own fuel figures,
  // independent of this function.
  // loads: same shape as wbState's (wingL_gal/wingR_gal/fusGal — the takeoff
  //   fuel actually loaded). landingWeight: lb; omit/null defaults to the
  //   takeoff weight (i.e. a zero-length line at full fuel).
  // Returns { to, zf, landing, warn } where to/zf/landing are each
  //   {weight, moment, cg} (to and zf also carry the wbState per-tank fields).
  function wbBurnLine(loads, landingWeight) {
    var to = wbState(loads);
    var zf = wbState({ emptyW: loads.emptyW, emptyMoment: loads.emptyMoment, items: loads.items,
                        wingL_gal: 0, wingR_gal: 0, fusGal: 0 });
    var warn = [];
    var lw = (typeof landingWeight === 'number' && isFinite(landingWeight)) ? landingWeight : to.weight;
    if (lw > to.weight) { warn.push('landing weight above takeoff weight — clamped'); lw = to.weight; }
    if (lw < zf.weight) { warn.push('landing weight below zero-fuel weight — clamped'); lw = zf.weight; }
    var span = to.weight - zf.weight;
    var frac = span > 0 ? (lw - zf.weight) / span : 0;
    var moment = zf.moment + (to.moment - zf.moment) * frac;
    var landing = { weight: lw, moment: moment, cg: lw > 0 ? moment / lw : 0 };
    return { to: to, zf: zf, landing: landing, warn: warn };
  }

  // Enumerate every seat assignment of the non-pilot occupants to the
  // INSTALLED seat positions (one occupant per seat, pilot's own seat fixed
  // and never reassigned) and evaluate CG at BOTH extremes of the POH 7-2
  // straight-line check (takeoff/max-fuel and zero-fuel) for each assignment.
  // Exact enumeration — cabin has at most ~6 seats, so this is cheap; no
  // heuristic search.
  //
  // occupants: [{id, label, weightLb, seatId}] — one entry IS the pilot
  //   (its id === pilotId); its seatId is the pilot's fixed seat and its arm
  //   never changes. Every OTHER occupant is reassignable to any installed
  //   non-pilot seat.
  // seats: [{seatId, armIn}] — installed seat positions (from CONFIG). Must
  //   include the pilot's own seatId.
  // pilotId: id of the occupant treated as pilot.
  // baseLoads: { emptyW, emptyMoment (lb-in), otherItems:[{wt, arm}] (fixed
  //   loads that are NOT reassignable, e.g. baggage), wingL_gal, wingR_gal,
  //   fusGal } — the fuel is the takeoff fuel; the zero-fuel endpoint is
  //   derived automatically, same as wbBurnLine.
  // opts: passed through to wbCheck (e.g. {maxW}).
  //
  // Returns one of:
  //   { error: string, warn: [string] }   — pilot/seat data invalid, OR
  //   {
  //     count,               // number of assignments enumerated
  //     worstForward,        // {assignment, point:'to'|'zf', cg, weight, margin} — smallest fwdMargin found (may be negative)
  //     worstAft,             // same shape, smallest aftMargin found
  //     band: {               // CG range across ALL assignments, for chart shading
  //       to: { cgMin, cgMax },  // at the (fixed) takeoff weight
  //       zf: { cgMin, cgMax }   // at the (fixed) zero-fuel weight
  //     },
  //     exceeding: [           // assignments that violate fwd or aft limit at
  //                             // either endpoint, WORST (most negative margin) first
  //       { assignment, worst: {point, cg, weight, margin, limit:'fwd'|'aft'}, chkTo, chkZf }
  //     ],
  //     worstLegal,           // the still-legal assignment with the smallest
  //                            // margin to either limit at either endpoint, or
  //                            // null if every assignment is illegal.
  //                            // {assignment, worstMargin, worst, to, zf}
  //     warn
  //   }
  //   assignment: [{occupantId, label, seatId, armIn, weightLb, pilot:bool}, ...]
  function wbAutoCurtailments(occupants, seats, pilotId, baseLoads, opts) {
    var warn = [];
    var pilot = null, movable = [], i, j;
    for (i = 0; i < occupants.length; i++) {
      if (occupants[i].id === pilotId) pilot = occupants[i]; else movable.push(occupants[i]);
    }
    if (!pilot) return { error: 'pilot occupant not found', warn: ['pilotId "' + pilotId + '" not present in occupants'] };
    var pilotSeat = null;
    for (i = 0; i < seats.length; i++) if (seats[i].seatId === pilot.seatId) pilotSeat = seats[i];
    if (!pilotSeat) return { error: 'pilot seat not installed', warn: ['pilot seatId "' + pilot.seatId + '" not among installed seats'] };
    var openSeats = seats.filter(function (s) { return s.seatId !== pilot.seatId; });
    if (movable.length > openSeats.length) {
      return { error: 'more occupants than installed non-pilot seats', warn: [] };
    }

    // k-permutations of openSeats, k = movable.length
    function permute(arr, k) {
      var out = [];
      (function rec(remaining, chosen) {
        if (chosen.length === k) { out.push(chosen.slice()); return; }
        for (var n = 0; n < remaining.length; n++) {
          var rest = remaining.slice(); rest.splice(n, 1);
          chosen.push(remaining[n]);
          rec(rest, chosen);
          chosen.pop();
        }
      })(arr, []);
      return out;
    }

    var otherItems = (baseLoads.otherItems || []).slice();
    var perms = permute(openSeats, movable.length);
    var worstForward = null, worstAft = null, worstLegal = null;
    var exceeding = [];
    var bandToMin = Infinity, bandToMax = -Infinity, bandZfMin = Infinity, bandZfMax = -Infinity;

    perms.forEach(function (combo) {
      var items = otherItems.concat([{ wt: pilot.weightLb, arm: pilotSeat.armIn }]);
      var assignment = [{ occupantId: pilot.id, label: pilot.label, seatId: pilotSeat.seatId,
                           armIn: pilotSeat.armIn, weightLb: pilot.weightLb, pilot: true }];
      for (j = 0; j < movable.length; j++) {
        items.push({ wt: movable[j].weightLb, arm: combo[j].armIn });
        assignment.push({ occupantId: movable[j].id, label: movable[j].label, seatId: combo[j].seatId,
                           armIn: combo[j].armIn, weightLb: movable[j].weightLb, pilot: false });
      }
      var to = wbState({ emptyW: baseLoads.emptyW, emptyMoment: baseLoads.emptyMoment, items: items,
                          wingL_gal: baseLoads.wingL_gal, wingR_gal: baseLoads.wingR_gal, fusGal: baseLoads.fusGal });
      var zf = wbState({ emptyW: baseLoads.emptyW, emptyMoment: baseLoads.emptyMoment, items: items,
                          wingL_gal: 0, wingR_gal: 0, fusGal: 0 });
      var chkTo = wbCheck(to, opts), chkZf = wbCheck(zf, opts);
      if (to.cg < bandToMin) bandToMin = to.cg;
      if (to.cg > bandToMax) bandToMax = to.cg;
      if (zf.cg < bandZfMin) bandZfMin = zf.cg;
      if (zf.cg > bandZfMax) bandZfMax = zf.cg;

      var pts = [
        { point: 'to', cg: to.cg, weight: to.weight, chk: chkTo },
        { point: 'zf', cg: zf.cg, weight: zf.weight, chk: chkZf }
      ];
      var worstMargin = Infinity, worstDetail = null;
      pts.forEach(function (p) {
        if (p.chk.fwdMargin != null) {
          if (p.chk.fwdMargin < worstMargin) { worstMargin = p.chk.fwdMargin; worstDetail = { point: p.point, cg: p.cg, weight: p.weight, margin: p.chk.fwdMargin, limit: 'fwd' }; }
          if (worstForward == null || p.chk.fwdMargin < worstForward.margin) {
            worstForward = { assignment: assignment, point: p.point, cg: p.cg, weight: p.weight, margin: p.chk.fwdMargin };
          }
        }
        if (p.chk.aftMargin != null) {
          if (p.chk.aftMargin < worstMargin) { worstMargin = p.chk.aftMargin; worstDetail = { point: p.point, cg: p.cg, weight: p.weight, margin: p.chk.aftMargin, limit: 'aft' }; }
          if (worstAft == null || p.chk.aftMargin < worstAft.margin) {
            worstAft = { assignment: assignment, point: p.point, cg: p.cg, weight: p.weight, margin: p.chk.aftMargin };
          }
        }
      });

      var legal = chkTo.ok && chkZf.ok;
      if (!legal) {
        exceeding.push({ assignment: assignment, worst: worstDetail, chkTo: chkTo, chkZf: chkZf });
      } else if (worstLegal == null || worstMargin < worstLegal.worstMargin) {
        worstLegal = { assignment: assignment, worstMargin: worstMargin, worst: worstDetail, to: to, zf: zf };
      }
    });

    exceeding.sort(function (a, b) { return a.worst.margin - b.worst.margin; });

    return {
      count: perms.length,
      worstForward: worstForward, worstAft: worstAft,
      band: { to: { cgMin: bandToMin, cgMax: bandToMax }, zf: { cgMin: bandZfMin, cgMax: bandZfMax } },
      exceeding: exceeding, worstLegal: worstLegal, warn: warn
    };
  }

  // ---------- helpers ----------
  function pushAll(dst, src) { for (var i = 0; i < src.length; i++) dst.push(src[i]); }
  function dedup(arr) {
    var seen = {}, out = [], i;
    for (i = 0; i < arr.length; i++) if (!seen[arr[i]]) { seen[arr[i]] = 1; out.push(arr[i]); }
    return out;
  }

  return {
    lin: lin, interp1: interp1, interpPts: interpPts,

      activeTab = first ? first.id : 'dep';
      store.tab = activeTab;
    } else {
      activeTab = typeof store.tab === 'string' ? store.tab : 'dep';
    }
    store.lastUsed = Date.now();
    saveStore();
    render();
    if (stale) {
      clearModal('WELCOME BACK', 'The app was idle for over ' +
        (idleMs < 3600000 ? Math.round(idleMs / 1000) + ' seconds (DEV)' : hrs + ' hours') + '.');
    }
  }

  // ---------- clear-data modal (welcome-back + settings → CLEAR DATA) ----------
  // One row per clearable scope, in app order: CLEAR · ↺ · what it clears.
  // Every clear snapshots exactly the keys it touches so ↺ restores them.
  // CLEAR ALL and KEEP DATA have no state of their own — they are derived
  // from the rows (all cleared → "ALL CLEARED"; none cleared → "KEPT"), so
  // the three can never disagree. Owner 2026-08-23: no sweep/hold — DONE
  // closes the modal anyway and every clear is undoable.
  var SCOPES = [
    { id: 'wb', label: 'W&B LOADING', what: 'occupants, baggage, shelf, manual items',
      keys: ['wbOcc', 'wbOccLabel', 'wbShelf', 'wbBaggage', 'wbManualLines', 'wbPushed', 'wbFuelMode'],
      run: resetWbLoading },
    { id: 'dep', label: 'DEPARTURE', what: 'conditions, TORA/ASDA/TODA/LDA, gradients, top of climb, obstacles, cruise PA',
      keys: ['fieldElev', 'altimeter', 'oat', 'windDir', 'windSpd', 'rwyHdg', 'rwyLen', 'rwyAsda', 'rwyToda',
        'rwyLda', 'reqGradient', 'reqGradientTop', 'reqObstGradient', 'reqObstGradientTop', 'obstacleMsl',
        'cruiseAlt', 'obstHgtAgl', 'obstDistNm', 'depObstacles'],
      run: resetDeparture },
    { id: 'crz', label: 'CRUISE', what: 'OAT, fuel remaining, MAP pick, cabin-plan overrides',
      keys: ['cruiseOat', 'cruiseFuelGal', 'cruiseMap', 'pressDestElev', 'pressClimbFpm', 'pressDescFpm'],
      run: function () {
        ['cruiseOat', 'cruiseFuelGal', 'cruiseMap', 'pressDestElev', 'pressClimbFpm', 'pressDescFpm']
          .forEach(function (k) { store[k] = null; });
      } },
    { id: 'ldg', label: 'LANDING', what: 'destination conditions, LDA, landing fuel',
      keys: ['ldgFieldElev', 'ldgAltimeter', 'ldgOat', 'ldgWindDir', 'ldgWindSpd', 'ldgRwyHdg', 'ldgLda', 'ldgFuelGal'],
      run: resetLanding }
  ];
  function snapshot(keys) {
    var s = {};
    keys.forEach(function (k) { if (own(store, k)) s[k] = JSON.parse(JSON.stringify(store[k] === undefined ? null : store[k])); });
    return s;
  }
  function restore(snap) {
    for (var k in snap) if (own(snap, k)) store[k] = snap[k];
  }
  function commit() { store.lastUsed = Date.now(); saveStore(); render(); }

  function clearModal(title, idleText) {
    var m = modal(title, function (b) {
      if (idleText) b.appendChild(el('div', 'clr-idle', idleText));
      var list = el('div', 'clrlist');
      b.appendChild(list);
      var rows = [];   // {clear(), undo(), cleared()}
      function row(scope) {
        var r = el('div', 'clrrow');
        var snap = null;
        var btn = el('button', 'clrbtn danger', 'CLEAR');
        var undo = el('button', 'undo', '↺');
        undo.setAttribute('aria-label', 'undo');
        function paint() {
          r.className = 'clrrow' + (snap ? ' cleared' : '');
          btn.disabled = !!snap;
          btn.innerHTML = snap ? '✓ CLEARED' : 'CLEAR';
          undo.style.visibility = snap ? 'visible' : 'hidden';
        }
        var e = {
          cleared: function () { return !!snap; },
          clear: function () { if (snap) return; snap = snapshot(scope.keys); scope.run(); paint(); },
          undo: function () { if (!snap) return; restore(snap); snap = null; paint(); }
        };
        btn.addEventListener('click', function () { e.clear(); commit(); paintAll(); });
        undo.addEventListener('click', function () { e.undo(); commit(); paintAll(); });
        r.appendChild(btn);
        r.appendChild(undo);
        r.appendChild(el('div', 'clrtxt', '<b>' + scope.label + '</b><span>' + scope.what + '</span>'));
        list.appendChild(r);
        paint();
        rows.push(e);
      }
      SCOPES.forEach(row);
      // derived rows
      var allRow = el('div', 'clrrow all');
      var allBtn = el('button', 'clrbtn danger', 'CLEAR ALL');
      allBtn.addEventListener('click', function () { rows.forEach(function (e) { e.clear(); }); commit(); paintAll(); });
      allRow.appendChild(allBtn);
      allRow.appendChild(el('span', 'undo-gap'));
      allRow.appendChild(el('div', 'clrtxt', '<b>EVERYTHING ABOVE</b><span>settings, seat config and fuel are never touched</span>'));
      list.appendChild(allRow);
      var keepRow = el('div', 'clrrow keep');
      var keepBtn = el('button', 'clrbtn', 'KEEP DATA');
      keepBtn.addEventListener('click', function () { rows.forEach(function (e) { e.undo(); }); commit(); paintAll(); });
      keepRow.appendChild(keepBtn);
      keepRow.appendChild(el('span', 'undo-gap'));
      keepRow.appendChild(el('div', 'clrtxt', '<b>KEEP</b><span>undo every clear above — leave everything as entered</span>'));
      list.appendChild(keepRow);
      function paintAll() {
        var n = rows.filter(function (e) { return e.cleared(); }).length;
        var all = n === rows.length, none = n === 0;
        allBtn.disabled = all; allBtn.innerHTML = all ? '✓ ALL CLEARED' : 'CLEAR ALL';
        keepBtn.disabled = none; keepBtn.innerHTML = none ? '✓ KEPT' : 'KEEP DATA';
      }
      paintAll();
      var foot = el('div', 'clrfoot');
      var done = el('button', 'btn primary', 'DONE');
      done.addEventListener('click', function () { if (m) m.close(); });
      foot.appendChild(done);
      b.appendChild(foot);
    }, { width: 'min(94%, 560px)' });
    return m;
  }

  // settings → RESET SETTINGS: display, ASI corr, insets, features, auto
  // reset (incl. the dev hook) back to the shipped defaults. Data untouched.
  var SETTING_KEYS = ['theme', 'iasUnit', 'cabinCtrl', 'insets', 'features', 'staleHours', 'devStaleSec'];
  function resetSettings() {
    SETTING_KEYS.forEach(function (k) { store[k] = JSON.parse(JSON.stringify(DEFAULTS[k])); });
    applyInsets(); applyTheme(); saveStore(); rebuildRail(); render();
  }

  function applyInsets() {
    var r = document.documentElement.style, ins = store.insets;
    if (phone) {
      // no GoodReader chrome on the phone: fill the screen inside the device
      // safe areas (notch above; the tab bar pads itself over the home bar)
      r.setProperty('--inset-top', 'env(safe-area-inset-top, 0px)');
      r.setProperty('--inset-bottom', '0px');
      r.setProperty('--inset-left', 'env(safe-area-inset-left, 0px)');
      r.setProperty('--inset-right', 'env(safe-area-inset-right, 0px)');
      return;
    }
    r.setProperty('--inset-top', ins.top + 'px');
    r.setProperty('--inset-bottom', ins.bottom + 'px');
    r.setProperty('--inset-left', ins.left + 'px');
    r.setProperty('--inset-right', ins.right + 'px');
  }

  function applyTheme() {
    document.body.className = (store.theme === 'light' ? 'light' : '') + (phone ? ' phone' : '');
  }

  // ---------- widgets ----------
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function sect(parent, title) {
    if (title) parent.appendChild(el('h2', null, title));
    var s = el('div', 'sect');
    parent.appendChild(s);
    return s;
  }

  // numeric field bound to store key (or custom get/set). Tap-to-edit:
  // numeric keypad only (inputmode), select-all on focus. Fields that can go
  // negative get a ± button (the iPad numeric pad has no minus key).
  function num(parent, opts) {
    // opts: {label, key, unit, min, max, dp, getFn, setFn, chip, allowNeg,
    //        size (expected digits — sizes the field to content instead of
    //        stretching; keeps rows compact on the iPad mini), grow,
    //        allowNull (blank entry commits null — optional fields like
    //        ASDA/TODA; displays empty), extras ([els] appended after unit),
    //        labelUnit (phone only: '' drops the unit, a string prints it in
    //        the label instead of beside the value — compact conditions rows)}
    var f = el('div', 'fld' + (opts.grow ? ' grow' : ''));
    var lu = phone && opts.labelUnit != null;
    var lab = el('label', null, opts.label + (lu && opts.labelUnit ? ' <span class="lu">' + opts.labelUnit + '</span>' : '') +
      (opts.chip ? ' <span class="chip src">' + opts.chip + '</span>' : ''));
    f.appendChild(lab);
    var row = el('div', 'row');
    var input = el('input');
    input.type = 'text';
    input.setAttribute('inputmode', (opts.dp ? 'decimal' : 'numeric'));
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocorrect', 'off');
    // content-based width: digits + breathing room (min 3ch); the .fld itself
    // no longer flex-grows (see app.css) so short fields stay short
    var size = opts.size;
    if (!size) {
      var lens = [5];
      if (opts.max != null) lens.push(String(Math.round(opts.max)).length + (opts.dp ? opts.dp + 1 : 0));
      if (opts.min != null) lens.push(String(Math.round(opts.min)).length + (opts.dp ? opts.dp + 1 : 0));
      size = Math.max.apply(null, opts.max != null ? lens.slice(1) : lens);
    }
    input.style.width = (Math.max(3, size) + 2) + 'ch';
    row.appendChild(input);
    if (opts.allowNeg) {
      var sign = el('button', 'st sign', '±');
      row.appendChild(sign);
    }
    if (opts.unit && !lu) row.appendChild(el('span', 'unit', opts.unit));
    if (opts.extras) opts.extras.forEach(function (x) { row.appendChild(x); });
    f.appendChild(row);
    parent.appendChild(f);

    var getV = opts.getFn || function () { return store[opts.key]; };
    var setV = opts.setFn || function (v) { set(opts.key, v); };
    var dp = opts.dp != null ? opts.dp : 0;

    function fmt(v) { return v == null ? '' : (+v).toFixed(dp); }
    input.value = fmt(getV());

    // strict: parseFloat would take "30abc" as 30. Blank reverts to the stored
    // value. opts.parseFn(s) may pre-translate shorthand forms (altimeter
    // "2992") — it returns a number, or NaN to fall through to strict parse.
    function parse(s) {
      s = String(s).trim();
      if (opts.parseFn) {
        var v = opts.parseFn(s);
        if (!isNaN(v)) return v;
      }
      if (!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return NaN;
      return Number(s);
    }

    function commit(v) {
      if (opts.allowNull && String(input.value).trim() === '') {
        if (getV() != null) setV(null);   // no-op when already empty
        return;
      }
      if (isNaN(v)) { input.value = fmt(getV()); return; }
      // round before clamping, or a dp-rounded value can step past max
      v = +v.toFixed(dp);
      if (opts.min != null && v < opts.min) v = opts.min;
      if (opts.max != null && v > opts.max) v = opts.max;
      setV(v);
    }
    // whole number is assumed to be replaced: select all on focus
    input.addEventListener('focus', function () {
      var self = input;
      setTimeout(function () {
        try { self.setSelectionRange(0, self.value.length); } catch (e) { try { self.select(); } catch (e2) {} }
      }, 0);
    });
    input.addEventListener('change', function () { commit(parse(input.value)); });
    input.addEventListener('blur', function () { commit(parse(input.value)); });
    // opts.focus: modal() focuses this field synchronously once the modal is in
    // the DOM — synchronous so iOS treats it as part of the tap gesture and
    // raises the keyboard (a setTimeout focus would not)
    if (opts.focus) input.setAttribute('data-autofocus', '1');
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        enterAdvance(input, function () { commit(parse(input.value)); });
      }
    });
    if (opts.allowNeg) {
      sign.addEventListener('click', function () {
        var v = getV();
        if (v == null || !isFinite(v)) return;
        v = +(+v).toFixed(dp);
        if (v === 0) return;
        // mirror the magnitude, do not clamp: ± must be its own inverse, and an
        // asymmetric range (OAT −40..50) would otherwise change the value typed.
        setV(-v);
      });
    }
    return f;
  }

  // speed display honoring the IAS-unit setting (ASI is MPH on this aircraft).
  // kias: the chart value in knots IAS. Returns {main, sub} html strings.
  function spdFmt(kias) {
    var mph = Math.round(kias * 1.15078);
    if (store.iasUnit === 'kt') return { main: kias + ' <small>KIAS</small>', sub: mph + ' MPH' };
    return { main: mph + ' <small>MPH</small>', sub: kias + ' KIAS' };
  }

  // OPT-style runway distance graphic: legend rows (color, label, value) +
  // runway band with one thin distance line per entry. Distances beyond an
  // entry's own limit render red past that limit.
  //
  // rwyGraphic(parent, entries, rwyLen)            — single limit (EMER;
  //   opts.rwLabel overrides the band label, e.g. "LDA 4,600 FT")
  // rwyGraphic(parent, entries, tora, {asda,toda}) — declared distances (DEP):
  //   asphalt band runs 0→ASDA with a marker line at TORA; TODA continues past
  //   ASDA as a dashed (non-asphalt) clearway; each entry checks e.limit.
  function rwyGraphic(parent, entries, rwyLen, opts) {
    // ASDA/TODA are optional (null = not entered): the asphalt band then ends
    // at TORA and every check that would use them falls back to TORA.
    var declared = !!(opts && ('asda' in opts || 'toda' in opts));
    var asda = declared && opts.asda != null ? Math.max(opts.asda, rwyLen) : null;
    var bandEnd = asda != null ? asda : rwyLen;
    var toda = declared && opts.toda != null ? Math.max(opts.toda, bandEnd) : null;
    function limOf(e) { return e.limit != null ? e.limit : rwyLen; }

    var wrap = el('div', 'rwywrap');
    var lg = el('div', 'rwylegend');
    entries.forEach(function (e) {
      // e.dash: a policy extension past the chart value (+250% air distance)
      // — drawn dashed, with its own legend row and its own over-flag
      var over = e.val != null && e.val > limOf(e);
      var rowEl = el('div', 'rwylr');
      rowEl.appendChild(el('span', 'dot', '<span style="background:' + e.color + '"></span>' + e.label));
      rowEl.appendChild(el('span', 'v' + (over ? ' over' : ''),
        (e.val == null ? '—' : fmtComma(e.val) + '<small>FT</small>') + (over ? ' ▲' : '')));
      lg.appendChild(rowEl);
    });
    // a dashed extension gets its own legend item AFTER the chart entries
    // (owner order: over 50 · gnd roll · powered app): dashed swatch in the
    // entry's colour + the total distance it reaches, own over-flag
    entries.forEach(function (e) {
      if (e.dash == null) return;
      var dOver = e.dash > limOf(e);
      var dRow = el('div', 'rwylr');
      dRow.appendChild(el('span', 'dot',
        '<span class="dash" style="border-color:' + e.color + '"></span>' + (e.dashLabel || 'POWERED APP')));
      dRow.appendChild(el('span', 'v' + (dOver ? ' over' : ''), fmtComma(e.dash) + '<small>FT</small>' + (dOver ? ' ▲' : '')));
      lg.appendChild(dRow);
    });
    wrap.appendChild(lg);

    var W = chartW(620), rowH = 20, pad = 6;
    var bandH = entries.length * rowH + 18;
    var maxV = Math.max(rwyLen, bandEnd, toda != null ? toda : 0);
    entries.forEach(function (e) {
      if (e.val != null && e.val > maxV) maxV = e.val;
      if (e.dash != null && e.dash > maxV) maxV = e.dash;
    });
    var scale = (W - 12) / (maxV * 1.04);
    var toraX = rwyLen * scale;
    // opts mode: up to THREE label tiers below the band so TORA/ASDA/TODA
    // labels never overlap even 100 ft apart. Tiers assigned before the svg
    // string is built so the height can fit exactly what is used.
    var marks = [], maxTier = 0, H;
    if (declared) {
      marks.push({ x: toraX, t: 'TORA ' + fmtComma(rwyLen) });
      if (asda != null && asda > rwyLen) marks.push({ x: asda * scale, t: 'ASDA ' + fmtComma(asda) });
      if (toda != null && toda > bandEnd) marks.push({ x: toda * scale, t: 'TODA ' + fmtComma(toda) });
      var tierEnd = [-1e9, -1e9, -1e9];
      marks.forEach(function (m) {
        var w2 = m.t.length * 6.6, x0 = m.x - 5 - w2;
        var tier = 0;
        while (tier < 2 && x0 <= tierEnd[tier] + 6) tier++;
        m.tier = tier;
        tierEnd[tier] = m.x - 5;
        if (tier > maxTier) maxTier = tier;
      });
      H = bandH + 16 + 12 * maxTier;
    } else {
      H = bandH + 16;
    }
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
      '<rect x="0" y="0" width="' + (bandEnd * scale) + '" height="' + bandH + '" rx="3" class="rwyband"/>';
    if (toda != null && toda > bandEnd) {
      svg += '<rect x="' + (bandEnd * scale) + '" y="0" width="' + ((toda - bandEnd) * scale) + '" height="' + bandH +
        '" fill="none" class="rwyclear"/>';
    }
    if (declared) {
      marks.forEach(function (m) {
        svg += '<line x1="' + m.x + '" y1="0" x2="' + m.x + '" y2="' + bandH + '" class="rwyend2"/>' +
          '<text x="' + (m.x - 5) + '" y="' + (bandH + 12 + 12 * m.tier) +
          '" text-anchor="end" class="rwytxt">' + m.t + '</text>';
      });
    } else {
      svg += '<line x1="' + toraX + '" y1="0" x2="' + toraX + '" y2="' + bandH + '" class="rwyend2"/>' +
        '<text x="' + (toraX - 5) + '" y="' + (H - 4) + '" text-anchor="end" class="rwytxt">' +
        ((opts && opts.rwLabel) || 'RWY ' + fmtComma(rwyLen) + ' FT') + '</text>';
    }
    entries.forEach(function (e, i) {
      if (e.val == null) return;
      var y = pad + rowH / 2 + i * rowH;
      var x = e.val * scale;
      var limX = limOf(e) * scale;
      var over = e.val > limOf(e);
      if (over) {
        svg += '<line x1="4" y1="' + y + '" x2="' + limX + '" y2="' + y + '" stroke="' + e.color + '" stroke-width="4"/>' +
          '<line x1="' + limX + '" y1="' + y + '" x2="' + x + '" y2="' + y + '" stroke="#ff5252" stroke-width="4"/>' +
          '<line x1="' + x + '" y1="' + (y - 6) + '" x2="' + x + '" y2="' + (y + 6) + '" stroke="#ff5252" stroke-width="3"/>';
      } else {
        svg += '<line x1="4" y1="' + y + '" x2="' + x + '" y2="' + y + '" stroke="' + e.color + '" stroke-width="4"/>' +
          '<line x1="' + x + '" y1="' + (y - 6) + '" x2="' + x + '" y2="' + (y + 6) + '" stroke="' + e.color + '" stroke-width="3"/>';
      }
      // policy extension: dashed continuation past the chart value with its
      // own termination bar; red from where it passes the entry's limit
      if (e.dash != null && e.dash > e.val) {
        var dx = e.dash * scale;
        var dOver = e.dash > limOf(e);
        var brk = Math.max(x, Math.min(limX, dx));
        if (brk > x) {
          svg += '<line x1="' + x + '" y1="' + y + '" x2="' + brk + '" y2="' + y +
            '" stroke="' + e.color + '" stroke-width="3" stroke-dasharray="7 5"/>';
        }
        if (dx > brk) {
          svg += '<line x1="' + brk + '" y1="' + y + '" x2="' + dx + '" y2="' + y +
            '" stroke="#ff5252" stroke-width="3" stroke-dasharray="7 5"/>';
        }
        svg += '<line x1="' + dx + '" y1="' + (y - 6) + '" x2="' + dx + '" y2="' + (y + 6) +
          '" stroke="' + (dOver ? '#ff5252' : e.color) + '" stroke-width="3"/>';
      }
    });
    svg += '</svg>';
    var g = el('div');
    g.innerHTML = svg;
    wrap.appendChild(g);
    parent.appendChild(wrap);
    return wrap;
  }

  // combined WIND cell "dir/spd" (°M / kt), shared by DEP and LDG. Accepts
  // "35015", "350/15" or "350 15" — the 5-digit form is the iPad numeric
  // keypad path (it has no "/" key). Blank clears the pair; garbage reverts.
  // A bare "0" means no wind: stored 0/0, shown CALM (owner 2026-09-29).
  function windCell(parent, dirKey, spdKey) {
    var wf = el('div', 'fld');
    wf.appendChild(el('label', null, 'Wind °M'));   // ATIS / tower reference (a METAR wind is converted on the way in)
    var wrow = el('div', 'row');
    var winput = el('input');
    winput.type = 'text';
    winput.setAttribute('inputmode', 'numeric');
    winput.setAttribute('autocomplete', 'off');
    winput.style.width = '9ch';
    function windFmt() {
      if (store[dirKey] == null || store[spdKey] == null) return '';
      return store[spdKey] === 0 ? 'CALM' : ('00' + store[dirKey]).slice(-3) + '/' + store[spdKey];   // 040/8, not 40/8 (owner 2026-09-12)
    }
    winput.value = windFmt();
    function windCommit() {
      var s2 = String(winput.value).trim(), m;
      if (s2 === '') {                                   // blank clears the pair
        if (store[dirKey] != null || store[spdKey] != null) {
          store[dirKey] = null;
          set(spdKey, null);
        }
        return;
      }
      if (/^0+$/.test(s2)) {                             // "0" → calm
        store[dirKey] = 0;
        set(spdKey, 0);
        return;
      }
      m = /^(\d{1,3})[\/\s]+(\d{1,3})$/.exec(s2);       // 350/15 · 350 15
      if (!m) m = /^(\d{3})(\d{1,2})$/.exec(s2);        // 35015
      if (m) {
        store[dirKey] = +m[2] ? Math.min(360, Math.max(0, +m[1])) : 0;   // speed 0 → calm (dir 0)
        set(spdKey, Math.min(60, Math.max(0, +m[2])));
        return;
      }
      winput.value = windFmt();                          // unrecognized → revert
    }
    winput.addEventListener('focus', function () {
      setTimeout(function () { try { winput.setSelectionRange(0, winput.value.length); } catch (e) {} }, 0);
    });
    winput.addEventListener('change', windCommit);
    winput.addEventListener('blur', windCommit);
    winput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { enterAdvance(winput, windCommit); }
    });
    wrow.appendChild(winput);
    if (!phone) wrow.appendChild(el('span', 'unit', '°M / kt'));   // phone: the label says °M
    wf.appendChild(wrow);
    parent.appendChild(wf);
    return wf;
  }

  // altimeter shorthand for U.num's parseFn: "2992", "29 92" or "29.92"
  // (some keypad layouts have no "." key)
  function parseAltimeter(s2) {
    var m4 = /^(\d{4})$/.exec(s2);
    if (m4) return +m4[1] / 100;
    var msp = /^(\d{2})[\s.](\d{1,2})$/.exec(s2);
    if (msp) return +(msp[1] + '.' + msp[2]);
    return NaN;
  }

  // wraps related fields so they stay on one line together (runway hdg+length,
  // wind dir+speed). Returns the group element to pass to num() as the parent.
  function group(parent) {
    var g = el('div', 'fldgroup');
    parent.appendChild(g);
    return g;
  }

  // full-screen modal (Data & Methods popup etc.). buildFn(bodyEl) fills content.
  // One at a time — repeated taps used to stack scrims, each needing its own ✕.

  // highlight: optional array of {seatId, cls} to outline (auto-curtail layouts).
  // Geometry: top-down planform after the POH Section 7 loading figure —
  // nose LEFT, pilot side (aircraft left) at the BOTTOM, as in a real top view.
  // x maps fuselage station through piecewise-linear anchors: the cabin is
  // expanded and the nose/tail compressed (tail cropped at the frame) so the
  // seats are big enough to tap; station ORDER and relative sense are kept.
  // Two layouts share the code: the iPad planform ('wide') and a compact one
  // for the phone — nose and tailcone compressed harder and the rows pulled
  // together, so seats stay finger-sized at phone width. PF.use(compact)
  // switches; station ORDER is identical, only the anchor x's differ.
  var PF = (function () {
    var H = 250, CL = 125, HW = 78;
    var LAYOUTS = {
      wide: { W: 840, AX: [[40, 10], [96, 190], [132, 330], [165, 470], [177, 528],
                           [224, 566], [265, 700], [310, 840]],
              nose: [10, 40, 70, 150], wall0: 156, ws: [118, 92], shelfW: 40, zoneW: 80,
              wing: [40, 146], taper: 50 / 340, tailY: 40, crop: [130, 444], ptrGap: 150, ptrBack: 200 },
      compact: { W: 460, AX: [[40, 4], [96, 62], [132, 140], [165, 218], [177, 276],
                              [224, 300], [265, 402], [310, 460]],
                 nose: [4, 12, 20, 38], wall0: 42, ws: [22, 12], shelfW: 40, zoneW: 76,
                 wing: [22, 100], taper: 40 / 160, tailY: 40, crop: [20, 286], ptrGap: 120, ptrBack: 150 }
    };
    var L = LAYOUTS.wide, AX = L.AX, P;
    function use(compact) {
      L = compact ? LAYOUTS.compact : LAYOUTS.wide;
      AX = L.AX;
      P.W = L.W; P.L = L;
      P.taperX = fsx(224);
      P.rowX = { cockpit: fsx(96), mid: fsx(132), aft: fsx(165) };
      P.rowZone = {
        'row-mid': { cx: P.rowX.mid, cy: CL, w: L.zoneW, h: 156 },
        'row-aft': { cx: P.rowX.aft, cy: CL, w: L.zoneW, h: 156 }
      };
    }
    function fsx(fs) {
      if (fs <= AX[0][0]) return AX[0][1];
      for (var i = 1; i < AX.length; i++) {
        if (fs <= AX[i][0]) {
          var a = AX[i - 1], b = AX[i];
          return a[1] + (fs - a[0]) * (b[1] - a[1]) / (b[0] - a[0]);
        }

      return AX[AX.length - 1][1];
    }
    function fsinv(x) {
      if (x <= AX[0][1]) return AX[0][0];
      for (var i = 1; i < AX.length; i++) {
        if (x <= AX[i][1]) {
          var a = AX[i - 1], b = AX[i];
          return a[0] + (x - a[1]) * (b[0] - a[0]) / (b[1] - a[1]);
        }
      }
      return AX[AX.length - 1][0];
    }

    function hw(x) { return x <= P.taperX ? HW : HW - (x - P.taperX) * L.taper; }

    // zones used by the CONFIG furniture drag (x ±40 about the anchor, full
    // cabin height) are set by use()
    P = { H: H, CL: CL, HW: HW, fsx: fsx, fsinv: fsinv, hw: hw, use: use };
    use(false);
    return P;
  })();

  // Seat geometry for the CURRENT configuration (computed per render — the
  // chairs and bench sit at whichever row they are in). slots: the 7 occupant
  // positions (bench as 3); seats: the 5 furniture units (bench as one box).
  // Chairs keep their side: midL (pilot side) below the centreline, midR above.
  function cabinGeom() {
    var CL = PF.CL, rx = PF.rowX, sW = 64, sH = 64, off = 36;
    var benchX = rx[unitRow('bench')];
    var slots = {
      pilot:   { cx: rx.cockpit, cy: CL + off, w: sW, h: sH, glyph: true },
      copilot: { cx: rx.cockpit, cy: CL - off, w: sW, h: sH, glyph: true },
      midL:    { cx: rx[unitRow('midL')], cy: CL + off, w: sW, h: sH, glyph: true },
      midR:    { cx: rx[unitRow('midR')], cy: CL - off, w: sW, h: sH, glyph: true },
      benchL:  { cx: benchX, cy: CL + 46, w: 62, h: 44 },
      benchC:  { cx: benchX, cy: CL,      w: 62, h: 44 },
      benchR:  { cx: benchX, cy: CL - 46, w: 62, h: 44 }
    };
    var seats = {
      pilot: slots.pilot, copilot: slots.copilot, midL: slots.midL, midR: slots.midR,
      bench: { cx: benchX, cy: CL, w: 70, h: 144, glyph: true }
    };
    return { slots: slots, seats: seats, benchX: benchX, benchRow: unitRow('bench') };
  }
  function benchBoxSvg(benchX) {
    return '<rect class="wb-benchbox" x="' + (benchX - 35) + '" y="53" width="70" height="144" rx="10"/>';
  }

  // static airframe (fuselage, wing stubs, windshield, cabin wall dashes);
  // tailcone cropped at the right edge (owner: crop the tail, grow the seats)
  function planformShell() {
    var L = PF.L, W = PF.W, n = L.nose, tp = PF.taperX, ty = L.tailY;
    var le = Math.round(PF.fsx(150)), sw = L.wing[0], te = le + L.wing[1];
    return '' +
      // wing stubs, cropped at the frame edge (LE at FS 150 — true position)
      '<polygon class="wb-wing" points="' + le + ',48 ' + (le + sw) + ',2 ' + (te + sw) + ',2 ' + te + ',48"/>' +
      '<polygon class="wb-wing" points="' + le + ',202 ' + (le + sw) + ',248 ' + (te + sw) + ',248 ' + te + ',202"/>' +
      // fuselage: nose cone → cabin → straight taper, cropped mid-tailcone
      '<path class="wb-fuse" d="M ' + n[0] + ',125 C ' + n[1] + ',95 ' + n[2] + ',49 ' + n[3] + ',47 L ' + tp + ',47 L ' + W + ',' + (47 + ty) + ' ' +
        'L ' + W + ',' + (203 - ty) + ' L ' + tp + ',203 L ' + n[3] + ',203 C ' + n[2] + ',201 ' + n[1] + ',155 ' + n[0] + ',125 Z"/>' +
      // windshield (bows forward) + dashed inner cabin wall, POH-figure style
      '<path class="wb-inner" d="M ' + L.ws[0] + ',55 Q ' + L.ws[1] + ',125 ' + L.ws[0] + ',195"/>' +
      '<path class="wb-inner" d="M ' + L.wall0 + ',53 L ' + tp + ',53"/>' +
      '<path class="wb-inner" d="M ' + L.wall0 + ',197 L ' + tp + ',197"/>';
  }

  // Occupant move on the live loading: weight AND label (name) travel
  // together; the target's occupant, if any, swaps back. Pilot seat is fixed.
  function moveOccupant(from, to) {
    if (from === to || from === 'pilot' || to === 'pilot') return;
    var slot = occSlots().filter(function (x) { return x.id === to; })[0];
    if (!slot || !slot.installed) return;
    var occ = U.store.wbOcc, lab = U.store.wbOccLabel;
    var w = occ[from] || 0, l = lab[from] || '';
    occ[from] = occ[to] || 0; lab[from] = lab[to] || '';
    occ[to] = w; lab[to] = l;
    U.set('wbOcc', occ);
  }

  // Shared pointer drag-with-tap-fallback for seat slots. The ghost chip is
  // placed ABOVE the finger immediately on drag start (no jump from 0,0), a
  // shaded dot marks the touch point, and the seat currently under the finger
  // highlights so the drop target is unambiguous.
  // cfg: {VX, VW, H, geo:{id:{cx,cy,w,h}}, targets:[ids], dragInfo(id)->
  //       {label,wt}|{text}|null, onTap(id)|null, onMove(fromId, toId)}
  // Targets are looked up in cfg.geo (occupant slots, or the synthetic
  // 'row-mid' / 'row-aft' drop zones of the CONFIG furniture drag); their
  // svg element is g[data-seat] for slots and .wb-rowzone[data-row] for the
  // zones. Every target is marked .wb-target for the duration of a drag, the
  // one under the finger .wb-hover.
  function eatGhostClick(x, y) {
    try {
      var h = function (e) {
        if (Math.abs(e.clientX - x) < 30 && Math.abs(e.clientY - y) < 30) { e.stopPropagation(); e.preventDefault(); }
        off();
      };
      var off = function () { document.removeEventListener('click', h, true); };
      document.addEventListener('click', h, true);
      setTimeout(off, 400);
    } catch (e) {}
  }

  function bindSlotDrag(btn, slotId, outer, cfg) {
    var start = null, dragging = false, ghost = null, dot = null, hoverId = null, far = 0;
    function pos(ev) {

      return { x: ev.clientX - rect.left, y: ev.clientY - rect.top,
               vx: cfg.VX + (ev.clientX - rect.left) * cfg.VW / rect.width,
               vy: (ev.clientY - rect.top) * cfg.H / rect.height };
    }
    function slotAtP(p) {
      var hit = null;
      cfg.targets.forEach(function (id) {
        var g = cfg.geo[id];
        if (g && Math.abs(p.vx - g.cx) <= g.w / 2 + 8 && Math.abs(p.vy - g.cy) <= g.h / 2 + 8) hit = id;
      });
      return hit;
    }
    function gEl(sid) {
      if (!outer.querySelector) return null;
      return /^row-/.test(sid) ? outer.querySelector('.wb-rowzone[data-row="' + sid + '"]')
                               : outer.querySelector('g[data-seat="' + sid + '"]');
    }

      cfg.targets.forEach(function (id) {
        var g = gEl(id);

      });

      var next = id ? gEl(id) : null;

      if (ghost) { ghost.style.left = (p.x - 40) + 'px'; ghost.style.top = (p.y - 54) + 'px'; }
      if (dot) { dot.style.left = (p.x - 18) + 'px'; dot.style.top = (p.y - 18) + 'px'; }
    }

      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);

      if (!dragging) {
        if (!start.info) return; // not draggable — stays a tap
        if (Math.abs(p.x - start.x) < 8 && Math.abs(p.y - start.y) < 8) return;
        dragging = true;
        // name follows if one was entered; otherwise just the weight moves
        // (furniture drags pass their own chip text)
        var txt = start.info.text ? esc(start.info.text)
          : start.info.label ? esc(start.info.label) + ' ' + U.fmtComma(start.info.wt)
                             : U.fmtComma(start.info.wt) + ' lb';

        dot = U.el('div', 'wb-touchdot');
