      setHover(slotAtP(p));
    });
    btn.addEventListener('pointerup', function (ev) {
      var wasDragging = dragging, p = pos(ev);
      var target = wasDragging && p ? slotAtP(p) : null;
      // a finger tap wobbles: Android browsers report more than the 8-px
      // drag threshold for an ordinary tap, which turned every tap on a
      // draggable seat into a drag to nowhere (owner 2026-10-04: could not
      // remove a seat on Android). A "drag" that never left the seat's
      // neighbourhood and found no target is the tap it was meant to be.
      var wobble = wasDragging && !target && far < 24;
      cleanup();
      // Android browsers follow this pointerup with a click hit-tested at the
      // finger. The tap/move below re-renders first, so that click landed on
      // whatever now sits there — a just-removed seat's "tap to install"
      // button put the seat straight back (owner 2026-10-04: seats could not
      // be removed on Android). Swallow that one click.
      eatGhostClick(ev.clientX, ev.clientY);
      if (wasDragging && !wobble) { if (target) cfg.onMove(slotId, target); }
      else if (cfg.onTap) cfg.onTap(slotId);
    });
    btn.addEventListener('pointercancel', cleanup);
  }

  // manual weight/moment lines drawn as angled leader pointers at their mapped
  // stations — below the fuselage first, moving above when below is crowded
  function manualPointersSvg() {
    var out = '', belowX = -Infinity, aboveX = -Infinity;
    var lines = manualLines().filter(function (ln) { return ln.wt !== 0; })
      .slice().sort(function (a, b) { return a.arm - b.arm; });
    lines.forEach(function (ln) {
      var x = PF.fsx(ln.arm);
      var below;
      if (x - belowX >= PF.L.ptrGap) below = true;
      else if (x - aboveX >= PF.L.ptrGap) below = false;
      else below = true;
      var edgeY = below ? PF.CL + PF.hw(x) : PF.CL - PF.hw(x);
      var ly = below ? 240 : 18;
      var lx = Math.max(30, Math.min(x + 26, PF.W - PF.L.ptrBack));
      out += '<line class="wb-ptr" x1="' + x + '" y1="' + edgeY + '" x2="' + (lx - 4) + '" y2="' + (below ? ly - 5 : ly + 4) + '"/>' +
        '<circle class="wb-ptrdot" cx="' + x + '" cy="' + edgeY + '" r="3.5"/>' +
        '<text class="wb-ptrlabel" x="' + lx + '" y="' + (ly + 4) + '" text-anchor="start">' +
        esc(ln.label || 'Item') + ' ' + U.fmtComma(ln.wt) + ' lb</text>';
      if (below) belowX = x; else aboveX = x;
    });
    return out;
  }

  function seatDiagramSvg(orientation, opts) {
    // opts.slots: draw occupant SLOTS (7, bench as 3 positions) instead of the
    // removable furniture SEATS (5) — WEIGHTS/curtailment layouts vs CONFIG.
    // opts.zones: also draw the shelf + baggage bays as tappable load zones
    // (opts.onZone(id) on tap). opts.onMoveSeat(unitId, row) (furniture mode):
    // installed chairs/bench become draggable to the other cabin row.
    // orientation is legacy — the planform is always nose-left (owner: match
    // the POH figure).
    var cab = cabinGeom();
    var geo = opts.slots ? cab.slots : cab.seats;
    // which unit kind each row holds (installed units only) — an uninstalled,
    // weightless slot in a row another unit occupies is not drawn (the removed
    // bench's slots under a chair moved aft, say); orphan weight always draws
    var rowHolds = {};
    seatDefs().forEach(function (s) { if (s.installed && s.movable) rowHolds[s.row] = s.id === 'bench' ? 'bench' : 'chair'; });
    var seats = opts.slots ? occSlots().filter(function (sl) {
      if (sl.installed || (U.store.wbOcc[sl.id] || 0) > 0) return true;
      var kind = SLOT_SEAT[sl.id] === 'bench' ? 'bench' : 'chair';
      return !rowHolds[sl.row] || rowHolds[sl.row] === kind;

        .concat(seats.filter(function (x) { return x.installed; }));

    var bgX = PF.taperX + 6, bgX1 = PF.fsx(265), bgDy = Math.round(PF.HW - PF.hw(bgX1));
    var zones = opts.zones ? [
      { id: 'shelf', label: 'SHELF', wt: U.store.wbShelf, small: true,
        shape: '<rect class="wb-zone" x="' + shX + '" y="53" width="' + shW + '" height="144" rx="6"/>',
        rect: [shX, 53, shW, 144] },
      { id: 'baggage', label: 'BAGGAGE', wt: U.store.wbBaggage,
        shape: '<polygon class="wb-zone" points="' + bgX + ',53 ' + bgX1 + ',' + (53 + bgDy) + ' ' + bgX1 + ',' + (197 - bgDy) + ' ' + bgX + ',197"/>',

        '<text class="' + (z.wt > 0 ? wtCls : 'wb-zonesub') + '" x="' + cx + '" y="' + (cy + 14) +

    // elements absolutely positioned over each seat on a same-aspect-ratio

    var outer = U.el('div', 'wb-diagram');
    outer.style.position = 'relative';
    outer.style.width = '100%';
    outer.style.maxWidth = '660px';
    outer.style.margin = '0 auto';
    outer.style.aspectRatio = W + ' / ' + H;
    var bg = U.el('div');
    bg.style.position = 'absolute'; bg.style.inset = '0';

    outer.appendChild(bg);
    function overlayBtn(label, x, y, w, h, onClick) {

      b.style.left = (100 * x / W) + '%';
      b.style.top = (100 * y / H) + '%';
      b.style.width = (100 * w / W) + '%';
      b.style.height = (100 * h / H) + '%';
      b.style.background = 'transparent'; b.style.border = 'none'; b.style.padding = '0'; b.style.cursor = 'pointer';

      var dragTargets = opts.slots ? seats.filter(function (s) { return s.installed && s.id !== 'pilot'; })
        .map(function (s) { return s.id; }) : [];
      seats.forEach(function (seat) {
        var g = geo[seat.id];
        var b;

  function blockedFlash(outer, unitId) {

  function placeBench(row) {

  // furniture drag drop: true = moved (store set, re-rendered); false = refused
  function moveSeat(unit, row) {
    if (!HOME_ROW[unit] || (row !== 'mid' && row !== 'aft') || unitRow(unit) === row) return false;
    if (unit === 'bench') { placeBench(row); U.set('wbSeatRow', U.store.wbSeatRow); return true; }
    if (unitInstalled('bench') && unitRow('bench') === row) return false;   // bench fills that row
    U.store.wbSeatRow[unit] = row;

    }

    s.appendChild(seatDiagramSvg('vertical', {

        var nextInstalled = !seat.installed;
        // removing an occupied seat clears its occupant weight(s) too — one tap,
        // with an explicit notice (never silently: the notice names the pounds)
        if (!nextInstalled) {
          var occSl = seatOccupiedSlots(seatId);

        // bench now fills goes to the other row; the bench takes its row back

  function fuelTanksSvg() {

    function wingText(cx, name, gal) {

    }

  function envelopeSvg(r, band) {
    var dd = d();
    var W = U.chartW(620), H = U.isPhone() ? 300 : 340, padL = U.isPhone() ? 32 : 46, padR = 14, padT = 10, padB = 38;
    var cgMin = 155.5, cgMax = 170, wMin = 4300, wMax = 6150;
    function x(cg) { return padL + (W - padL - padR) * (cg - cgMin) / (cgMax - cgMin); }
    function y(w) { return H - padB - (H - padT - padB) * (w - wMin) / (wMax - wMin); }

    var fwd = dd.envelope.fwd_limit, aft = dd.envelope.aft_limit;
    function fwdAt(w) { return C.wbFwdLimit(w); }
    function aftAt(w) { return C.wbAftLimit(w); }
    var maxW = dd.limits.max_takeoff_lb;

    var svg = '';
    for (var wgl = 4400; wgl <= 6000; wgl += 200) {
      svg += '<line class="svg-grid" x1="' + padL + '" y1="' + y(wgl) + '" x2="' + (W - padR) + '" y2="' + y(wgl) + '"/>' +
        '<text class="svg-axis" x="2" y="' + (y(wgl) + 3) + '">' + (wgl / 100) / 10 + 'k</text>';
    }
    for (var cgl = 156; cgl <= 170; cgl += 2) {
      svg += '<line class="svg-grid" x1="' + x(cgl) + '" y1="' + padT + '" x2="' + x(cgl) + '" y2="' + (H - padB) + '"/>' +
        '<text class="svg-axis" x="' + x(cgl) + '" y="' + (H - padB + 14) + '" text-anchor="middle">' + cgl + '</text>';
    }
    svg += '<text class="svg-axis" x="' + (W / 2) + '" y="' + (H - 4) + '" text-anchor="middle">CG — INCHES AFT OF DATUM</text>';

    var wBot = Math.max(3600, wMin + 20);
    var pts = [];
    pts.push([fwdAt(wBot), wBot]);
    fwd.forEach(function (p) { if (p.wt >= wBot) pts.push([p.cg, p.wt]); });
    pts.push([aftAt(maxW), maxW]);
    for (var i = aft.length - 1; i >= 0; i--) { if (aft[i].wt >= wBot) pts.push([aft[i].cg, aft[i].wt]); }
    pts.push([aftAt(wBot), wBot]);
    svg += '<polygon class="env-poly" points="' +
      pts.map(function (p) { return x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' ') + '"/>';

    // manual curtailed inset
    var cc = curtailCheck(wBot);
    if (cc && cc.ok) {
      var cl = cc.cl, cw = cc.cw;
      var cpts = [
        [fwdAt(wBot) + cl.fwd, wBot],
        [fwdAt(4600) + cl.fwd, Math.min(4600, cw)],
        [fwdAt(cw) + cl.fwd, cw],
        [aftAt(cw) - cl.aft, cw],
        [aftAt(wBot) - cl.aft, wBot]
      ];
      svg += '<polygon class="env-curt" points="' +
        cpts.map(function (p) { return x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' ') + '"/>';
    }

    // curtailment excursion band at TO / ZF weight — auto mode: scan extremes;
    // manual mode: the user's chosen worst fwd/aft arrangements; off: nothing
    if (band) {
      var bp = [
        [band.to.cgMin, r.to.weight], [band.to.cgMax, r.to.weight],
        [band.zf.cgMax, r.zf.weight], [band.zf.cgMin, r.zf.weight]
      ];
      svg += '<polygon class="env-autoband" points="' +
        bp.map(function (p) { return x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1); }).join(' ') + '"/>';
    }

    // certified TO->ZF line drawn as a STRAIGHT chord (owner 2026-08-22: the
    // exact moment-linear path bows <0.05 in and the curve read as an error
    // next to the straight curtailment edges). The LDG marker keeps its true
    // computed position from wbBurnLine — its deviation from this chord is
    // sub-pixel; POH 7-2 compliance checks the two endpoints.
    svg += '<polyline class="env-cert" fill="none" points="' +
      x(r.to.cg).toFixed(1) + ',' + y(r.to.weight).toFixed(1) + ' ' +
      x(r.zf.cg).toFixed(1) + ',' + y(r.zf.weight).toFixed(1) + '"/>';

    [['TO', r.to, r.chkTo], ['LDG', r.ldg, r.chkLdg], ['ZF', r.zf, r.chkZf]].forEach(function (pp) {
      var p = pp[1], chk = pp[2];
      svg += '<circle class="env-pt ' + (chk.ok ? 'ok' : 'viol') + '" cx="' + x(p.cg) + '" cy="' + y(p.weight) + '" r="5"/>' +
        '<text class="env-ptlabel" x="' + (x(p.cg) + 8) + '" y="' + (y(p.weight) + 4) + '">' + pp[0] + '</text>';
    });

    var div = U.el('div');
    div.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + svg + '</svg>';
    return div;
  }

  // ----- STATION PICKER POPUP -----
  var STATIONS = [
    { v: 96, label: 'Pilot/copilot 96' },
    { v: 132, label: 'Middle 132' },
    { v: 165, label: 'Bench 165' },

  function openStationPicker(onAccept, currentArm) {
    var picked = (typeof currentArm === 'number' && isFinite(currentArm)) ? Math.round(currentArm) : 150;
    var railMin = 90, railMax = 270;
    // snap targets: seat backs (= seat stations), shelf, baggage ends
    var SNAPS = [
      { v: 96, t: 'Pilot/Copilot' }, { v: 132, t: 'Middle' }, { v: 165, t: 'Bench' },
      { v: 177, t: 'Shelf' }, { v: 224, t: 'Bag fwd' }, { v: 265, t: 'Bag aft' }
    ];

    var modalRef = U.modal('CHOOSE STATION', function (b) {
      var W = PF.W, H = PF.H;
      var valLine = U.el('div', 'res');
      b.appendChild(valLine);
      var wrapDiv = U.el('div', 'wb-railwrap');
      wrapDiv.style.touchAction = 'none';
      b.appendChild(wrapDiv);

      // static: the planform with ghost seats and snap ticks; dynamic: the arm
      // line + knob, updated by attribute (no innerHTML churn while dragging)
      var svg = planformShell();
      var ghostGeo = cabinGeom().seats;
      Object.keys(ghostGeo).forEach(function (id) {
        if (!unitInstalled(id)) return;
        var g = ghostGeo[id];
        svg += '<rect class="wb-ghost" x="' + (g.cx - g.w / 2) + '" y="' + (g.cy - g.h / 2) +
          '" width="' + g.w + '" height="' + g.h + '" rx="8"/>';
      });
      SNAPS.forEach(function (sn) {
        var px = PF.fsx(sn.v);
        svg += '<line class="wb-tick" x1="' + px + '" y1="206" x2="' + px + '" y2="216"/>' +
          '<text class="svg-axis" x="' + px + '" y="230" text-anchor="middle">' + sn.v + '</text>';
      });
      svg += '<line class="wb-armline" x1="0" y1="8" x2="0" y2="212"/>' +
        '<circle class="wb-knob" cx="0" cy="225" r="14"/>';
      wrapDiv.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H +
        '" style="width:100%;height:auto;display:block">' + svg + '</svg>';
      var armLine = wrapDiv.querySelector('.wb-armline');
      var knob = wrapDiv.querySelector('.wb-knob');

      function snapInfo(arm) {
        for (var i = 0; i < SNAPS.length; i++) {
          if (Math.abs(arm - SNAPS[i].v) <= SNAP_IN) return SNAPS[i];
        }
        return null;
      }
      function updateDisplay() {
        var x = PF.fsx(picked);
        if (armLine) { armLine.setAttribute('x1', x); armLine.setAttribute('x2', x); }
        if (knob) knob.setAttribute('cx', x);
        var sn = snapInfo(picked);
        valLine.innerHTML = '<label>Arm</label><div class="v wb-armval">' + picked.toFixed(0) +
          ' <small>in</small>' + (sn && sn.v === picked ? ' <span class="chip src">' + sn.t + '</span>' : '') + '</div>';
      }
      updateDisplay();

      function setFromClientX(clientX) {
        var svgEl = wrapDiv.querySelector('svg');
        var rect = svgEl && svgEl.getBoundingClientRect ? svgEl.getBoundingClientRect() : null;
        if (!rect || !rect.width) return;
        var px = (clientX - rect.left) * W / rect.width;
        var arm = PF.fsinv(px);
        if (arm < railMin) arm = railMin; if (arm > railMax) arm = railMax;
        var sn = snapInfo(arm);
        picked = sn ? sn.v : Math.round(arm);
        updateDisplay();
      }
      // pointer events: tap anywhere to place, drag the line/knob — works for
      // touch and mouse; listeners live on the wrapper so they survive updates
      var dragging = false;
      wrapDiv.addEventListener('pointerdown', function (ev) {
        dragging = true;
        try { wrapDiv.setPointerCapture(ev.pointerId); } catch (e) {}
        try { ev.preventDefault(); setFromClientX(ev.clientX); } catch (e) {}
      });
      wrapDiv.addEventListener('pointermove', function (ev) {
        if (dragging) { try { setFromClientX(ev.clientX); } catch (e) {} }
      });
      wrapDiv.addEventListener('pointerup', function () { dragging = false; });
      wrapDiv.addEventListener('pointercancel', function () { dragging = false; });

      var pg = U.el('div', 'grid'); b.appendChild(pg);
      STATIONS.forEach(function (sInfo) {
        var pb = U.el('button', 'btn sm', sInfo.label);
        pb.addEventListener('click', function () { picked = sInfo.v; updateDisplay(); });
        pg.appendChild(pb);
      });

      var accept = U.el('button', 'btn primary', 'ACCEPT ARM →');
      accept.style ? (accept.style.marginTop = '10px') : 0;
      accept.addEventListener('click', function () {
        onAccept(picked);
        if (modalRef) modalRef.close();
      });
      b.appendChild(accept);
    });
  }

  // ----- CURTAILMENTS -----

  // Manual curtailments state (session-local; reseeded from the auto scan
  // whenever the loading changes): the user's OWN worst-forward and worst-aft
  // seatings, dragged into place starting from what the scan produced.
  var man = null; // {sig, fwd:{occId:slotId}, aft:{...}, hist:{fwd:{undo,redo}, aft:{undo,redo}}}

  function expOccList() {
    var out = [];
    occSlots().forEach(function (sl) {
      if (!sl.installed) return;
      var wt = U.store.wbOcc[sl.id] || 0;
      if (wt > 0) out.push({ id: sl.id, label: occLabel(sl.id), wt: wt });
    });
    return out;
  }
  // any change to the loaded people, the installed seats, the rows the
  // furniture sits in, or the row arms reseeds the manual worst cases
  function expSig() {
    return JSON.stringify(expOccList()) + '|' +
      occSlots().filter(function (sl) { return sl.installed; }).map(function (sl) { return sl.id + '@' + sl.arm; }).join(',') +
      '|' + JSON.stringify(U.store.wbSeatRow) + '|' + JSON.stringify(U.store.wbRowArm);
  }
  function assignFromArrangement(arr) {
    var a = {};
    arr.forEach(function (x) { a[x.occupantId] = x.seatId; });
    return a;
  }
  function seedAssign(key, ac) {
    if (key === 'fwd' && ac && ac.worstForward) return assignFromArrangement(ac.worstForward.assignment);
    if (key === 'aft' && ac && ac.worstAft) return assignFromArrangement(ac.worstAft.assignment);
    var a = {};
    expOccList().forEach(function (o) { a[o.id] = o.id; }); // fallback: as loaded
    return a;
  }
  function manEnsure(ac) {
    var sig = expSig();
    if (man && man.sig === sig) return;
    man = { sig: sig, fwd: seedAssign('fwd', ac), aft: seedAssign('aft', ac),
            hist: { fwd: { undo: [], redo: [] }, aft: { undo: [], redo: [] } } };
  }
  function manMove(key, occId, toSlot) {
    var a = man[key];
    if (a[occId] === toSlot) return;
    // pilot never moves and nobody displaces the pilot
    if (occId === 'pilot' || (a.pilot || 'pilot') === toSlot) return;
    var snapshot = JSON.parse(JSON.stringify(a));
    var otherId = null;
    Object.keys(a).forEach(function (k) { if (a[k] === toSlot) otherId = k; });
    if (otherId) a[otherId] = a[occId]; // occupied target: swap
    a[occId] = toSlot;
    man.hist[key].undo.push(snapshot); man.hist[key].redo = [];
    U.render();
  }
  function slotArm(slotId) { return rowArm(slotRow(slotId)); }

  function stateForAssign(r, assign) {
    var items = [];
    expOccList().forEach(function (o) {
      var sl = assign[o.id];
      items.push({ wt: o.wt, arm: slotArm(sl || o.id), label: o.label });
    });
    var s2 = U.store;
    if (s2.wbShelf > 0) items.push({ wt: s2.wbShelf, arm: d().stations.shelf.arm_in });
    if (s2.wbBaggage > 0) items.push({ wt: s2.wbBaggage, arm: d().stations.baggage.arm_in });
    manualLines().forEach(function (ln) { items.push({ wt: ln.wt, arm: ln.arm }); });
    var to = C.wbState({ emptyW: r.ec.ew, emptyMoment: r.ec.moment, items: items,
      wingL_gal: r.toFuel.wingL, wingR_gal: r.toFuel.wingR, fusGal: r.toFuel.fus });
    var zf = C.wbState({ emptyW: r.ec.ew, emptyMoment: r.ec.moment, items: items,
      wingL_gal: 0, wingR_gal: 0, fusGal: 0 });
    return { to: to, zf: zf, chkTo: C.wbCheck(to, {}), chkZf: C.wbCheck(zf, {}) };
  }

  // the amber excursion band on the WEIGHTS envelope, by curtailment mode
  function curtailBand(r, ac) {
    if (!U.feat('wbCurtail')) return null;
    var mode = U.store.wbCurtMode;
    if (mode === 'auto') return (ac && !ac.error && ac.band) ? ac.band : null;
    if (mode === 'manual') {
      manEnsure(ac);
      var f = stateForAssign(r, man.fwd), a = stateForAssign(r, man.aft);
      return {
        to: { cgMin: Math.min(f.to.cg, a.to.cg), cgMax: Math.max(f.to.cg, a.to.cg) },
        zf: { cgMin: Math.min(f.zf.cg, a.zf.cg), cgMax: Math.max(f.zf.cg, a.zf.cg) }
      };
    }
    return null;
  }

          },
          onTap: null,
          onMove: function (fromSlot, toSlot) {
            var o = bySlot[fromSlot];
            if (o) onMoveOcc(o.id, toSlot);
          }
        });
        outer.appendChild(b);
      });
    }
    return outer;
  }

  function minFinite(a, b) {
    var vals = [a, b].filter(function (v) { return v != null && isFinite(v); });
    return vals.length ? Math.min.apply(null, vals) : null;
  }

  // one worst-case block — IDENTICAL layout for auto and manual: caption,
  // (chips when editable), then cabin ~68% with the CG graph beside it
  function worstCaseBlock(parent, r, key, label, assign, editable, ac) {
    var es = stateForAssign(r, assign);
    var mar = key === 'fwd' ? minFinite(es.chkTo.fwdMargin, es.chkZf.fwdMargin)
                            : minFinite(es.chkTo.aftMargin, es.chkZf.aftMargin);

    parent.appendChild(U.el('div', bad ? 'caution' : 'note',

      es.zf.cg.toFixed(2) + ' in · margin ' + (mar != null ? mar.toFixed(2) + ' in' : '—')));

      un.addEventListener('click', function () {

        h.redo.push(JSON.parse(JSON.stringify(man[key])));
        man[key] = h.undo.pop(); U.render();
      });

      var re = U.el('button', 'btn sm', '↪ REDO');
      re.disabled = !man.hist[key].redo.length;
      re.addEventListener('click', function () {

    var split = U.el('div', 'wb-case'); parent.appendChild(split);

      editable ? function (occId, toSlot) { manMove(key, occId, toSlot); } : null));
    var right = U.el('div', 'wb-case-gph'); split.appendChild(right);

  // graphical-only mini CG envelope drawn INTO an svg at (x0,y0,w,h):
  // certified shape, margins inset (if the setting is on), TO→ZF burn line.
  // Off-scale points clamp to the frame edge — the WEIGHTS chart is the
  // authoritative display, this is a pictogram.
  function envelopeMiniStr(es, x0, y0, w, h) {
    var dd = d();
    var cgMin = 155.5, cgMax = 170, wMin = 4300, wMax = 6150;
    function cx(v) { return Math.max(x0 + 3, Math.min(x0 + w - 3, x0 + w * (v - cgMin) / (cgMax - cgMin))); }
    function cy(v) { return Math.max(y0 + 3, Math.min(y0 + h - 3, y0 + h - h * (v - wMin) / (wMax - wMin))); }
    function fwdAt(wt) { return C.wbFwdLimit(wt); }
    function aftAt(wt) { return C.wbAftLimit(wt); }
    var maxW = dd.limits.max_takeoff_lb, wBot = 4320;
    var svg = '<rect class="env-minibg" x="' + x0 + '" y="' + y0 + '" width="' + w + '" height="' + h + '" rx="8"/>';
    var pts = [[fwdAt(wBot), wBot]];
    dd.envelope.fwd_limit.forEach(function (p) { if (p.wt >= wBot) pts.push([p.cg, p.wt]); });
    pts.push([aftAt(maxW), maxW]);
    for (var i = dd.envelope.aft_limit.length - 1; i >= 0; i--) {
      if (dd.envelope.aft_limit[i].wt >= wBot) pts.push([dd.envelope.aft_limit[i].cg, dd.envelope.aft_limit[i].wt]);
    }
    pts.push([aftAt(wBot), wBot]);
    svg += '<polygon class="env-poly" points="' +
      pts.map(function (p) { return cx(p[0]).toFixed(1) + ',' + cy(p[1]).toFixed(1); }).join(' ') + '"/>';
    var cc = curtailCheck(wBot);
    if (cc && cc.ok) {
      var cl = cc.cl, cw = cc.cw;
      var cpts = [
        [fwdAt(wBot) + cl.fwd, wBot], [fwdAt(4600) + cl.fwd, Math.min(4600, cw)],
        [fwdAt(cw) + cl.fwd, cw], [aftAt(cw) - cl.aft, cw], [aftAt(wBot) - cl.aft, wBot]
      ];
      svg += '<polygon class="env-curt" points="' +
        cpts.map(function (p) { return cx(p[0]).toFixed(1) + ',' + cy(p[1]).toFixed(1); }).join(' ') + '"/>';
    }
    svg += '<polyline class="env-cert" fill="none" points="' +
      cx(es.to.cg).toFixed(1) + ',' + cy(es.to.weight).toFixed(1) + ' ' +
      cx(es.zf.cg).toFixed(1) + ',' + cy(es.zf.weight).toFixed(1) + '"/>';
    [[es.to, es.chkTo], [es.zf, es.chkZf]].forEach(function (pp) {
      svg += '<circle class="env-pt ' + (pp[1].ok ? 'ok' : 'viol') + '" cx="' + cx(pp[0].cg).toFixed(1) +
        '" cy="' + cy(pp[0].weight).toFixed(1) + '" r="6"/>';
    });
    return svg;
  }

  function envelopeMiniSvg(es) {
    var div = U.el('div');
    div.innerHTML = '<svg viewBox="0 0 340 300" style="width:100%;height:auto;display:block">' +

        U.res(o, label, verdict, cls, 'CG ' + U.fmtN(p.cg, 2) + ' in · limits ' + lim);

    // ----- AUTO: the scan's worst-forward / worst-aft seatings -----

    }

    // ----- MANUAL: user-adjusted worst cases, seeded from the scan -----
    if (s2.wbCurtMode === 'manual') {
      var sM = U.sect(page, 'MANUAL — YOUR WORST CASES');
      if (!expOccList().filter(function (o) { return o.id === 'pilot'; }).length) {

        return;
      }
      sM.appendChild(U.el('div', 'note',
        'Manually configure worst case forward/rearward CG.'));
      manEnsure(ac);
      worstCaseBlock(sM, r, 'fwd', 'WORST FORWARD', man.fwd, true, ac);
      worstCaseBlock(sM, r, 'aft', 'WORST AFT', man.aft, true, ac);
    }
  }

/* tab_dep.js — Departure planning: conditions → takeoff distances (checked
   against declared distances TORA/ASDA/TODA, with an optional personal
   margin) → climb gradients (ATC + obstacle, twin and OEI) → climbout path
   vs a LIST of obstacles → SE ceiling → time/fuel/distance to climb. */

(function () {
  'use strict';
  var C = Core, U = UI;

  var NM_FT = 6076.12;

  function depPA() { return C.pressureAlt(U.store.fieldElev, U.store.altimeter); }

  function windHead() {
    var w = C.windComponents(U.store.windDir, U.store.windSpd, U.store.rwyHdg);
    return w;
  }

  // climb CAS/TAS chain from a chart KIAS speed (documented conversions only).
  function tasFromKias(kias, altFt, oatCAtAlt) {
    var iasKt = kias; // Section 5 position error applied below; no ASI-corr field (removed 2026-08-29)
    var cas = C.casFromIasKt(iasKt, 'clean');
    var pa = altFt + (29.92 - U.store.altimeter) * 1000;
    return { tasKt: C.tasFromCas(cas.v, pa, oatCAtAlt), casKt: cas.v, warn: cas.warn };
  }

  function pushWarn(dst, src) {
    if (!src) return;
    for (var i = 0; i < src.length; i++) if (dst.indexOf(src[i]) < 0) dst.push(src[i]);
  }

  // The tailwind fail-closed flag (core: past the printed fan there is no POH
  // answer) arrives once for the entered wind and again for the 150%-factored
  // value the climb sections use — one condition, two chips saying the same
  // thing with two different kt numbers. Collected here and printed ONCE, with
  // both readings named. Nothing is suppressed: the chart lookups still return
  // null and every "NO CHART ANSWER" banner and flag stays exactly as it was.
  var TW_RE = /^tailwind (\d+(?:\.\d+)?) kt beyond the printed (\d+(?:\.\d+)?)-kt fan/;

  function twSeen(warns) {
    var i, m, out = null;
    for (i = 0; i < warns.length; i++) {
      m = TW_RE.exec(warns[i]);
      if (m) out = { kt: m[1], fan: m[2] };
    }
    return out;
  }

  function dropTw(warns) {
    return warns.filter(function (w) { return !TW_RE.test(w); });
  }

  // largest printed tailwind on a three-panel chart, so the one chip can state
  // what the factored value does to THIS figure rather than assume every
  // takeoff chart prints the same fan
  function twFanMax(fig) {
    var tw = fig && fig.wind_panel && fig.wind_panel.tailwind;
    var k = tw && tw.wind_kt;
    return k && k.length ? Math.max(k[0], k[k.length - 1]) : null;
  }

  // A null distance means the POH chart has no answer for these conditions.
  // rwyGraphic simply omits that line, which reads as "fits the runway" — so
  // say it out loud and paint the legend swatch red instead of a fits colour.
  function noDataBanner(parent, entries, what) {
    var miss = [], i;
    for (i = 0; i < entries.length; i++) {
      if (entries[i].val == null) { entries[i].color = '#ff5252'; miss.push(entries[i].label); }
    }
    if (!miss.length) return false;
    parent.appendChild(U.el('div', 'banner viol',
      'NO CHART ANSWER — ' + miss.join(', ') + '. Runway fit is NOT checked for ' +
      (miss.length === entries.length ? 'any ' + what + ' distance'
        : (miss.length === 1 ? 'that distance' : 'those distances')) +
      '; see the flags below.'));
    return true;
  }

  // ---- climbout obstacle list helpers ----
  // {label ≤10 chars, h, hu:'agl'|'msl', d (past TORA end), du:'nm'|'ft'}

  function sanitizeObstacles(st) {
    var arr = Array.isArray(st.depObstacles) ? st.depObstacles : [];
    var out = [];
    arr.forEach(function (o) {
      if (!o || typeof o !== 'object') return;
      var h = +o.h, d = +o.d;
      if (!isFinite(h) || !isFinite(d)) return;
      out.push({ label: (String(o.label == null ? '' : o.label).slice(0, 10)) || '?',
        h: h, hu: o.hu === 'msl' ? 'msl' : 'agl', d: d, du: o.du === 'ft' ? 'ft' : 'nm' });
    });
    // legacy single-obstacle store (pre-list): carry it in once, then
    // neutralize the old keys so deleting it later sticks
    if (!out.length && (st.obstHgtAgl !== 200 || st.obstDistNm !== 1)) {
      out.push({ label: 'A', h: st.obstHgtAgl, hu: 'agl', d: st.obstDistNm, du: 'nm' });
      st.obstHgtAgl = 200; st.obstDistNm = 1.0;
    }
    st.depObstacles = out;
    return out;
  }

  // a second numeric input living inside another field's row (the "to ####
  // MSL" half of a gradient requirement) — same behaviors as U.num's input:
  // strict integer parse, clamp, blank → null, select-all, Enter-to-advance
  function bareNum(opts) {
    var input = U.el('input');
    input.type = 'text';
    input.setAttribute('inputmode', 'numeric');
    input.setAttribute('autocomplete', 'off');
    input.style.width = (Math.max(3, opts.size || 5) + 2) + 'ch';
    function fmt(v) { return v == null ? '' : String(Math.round(v)); }
    input.value = fmt(opts.getFn());
    function commit() {
      var s2 = String(input.value).trim();
      if (s2 === '') { if (opts.getFn() != null) opts.setFn(null); return; }

        if (x >= dEnd) { x = dEnd; last = true; }
        var la = 35 + (x - rwyNm) * req.grad;
        var alt = pathAltAt(p, x);
        if (alt == null) { na = true; break; }
        var m = alt - la;
        if (minM == null || m < minM) { minM = m; atX = x; }
        x += 0.05;
      }
      if (minM != null && minM < 0) return { status: 'viol', min: minM, atNm: atX - rwyNm };

    }

    if (condOk) {
      rwyNm = st.rwyLen / NM_FT;

      r50f = C.evalThreePanel(to50, st.oat, pa, gw, fw);
      startNm = r50f.v != null ? r50f.v / NM_FT : null;
      var maxNeedAgl = 0;
      obs.forEach(function (ob) { maxNeedAgl = Math.max(maxNeedAgl, obAgl(ob)); });
      REQS.forEach(function (rq) {
        if (rq.grad != null && rq.top != null) maxNeedAgl = Math.max(maxNeedAgl, rq.top - st.fieldElev);
      });
      maxAgl = Math.max(maxNeedAgl + 400, 800);
      pTwin = climbPathPts(D.fig8_09, twinSpdK);

      // per-obstacle check against BOTH paths (owner: obstacle applies to both

      checked = obs.map(function (ob) {

        var ase = pathAltAt(pSe, x);
        var m2 = a2 == null ? null : a2 - agl;

        var worst = null;
        if (m2 != null && mse != null) worst = Math.min(m2, mse);
        else if (m2 != null) worst = m2;
        else if (mse != null) worst = mse;
        return { ob: ob, agl: agl, x: x, m2: m2, mse: mse, status: status, worst: worst };
      });
    } else {

    }

    // ---- climb gradients ----
    if (U.feat('depGrad')) {

      extras: [U.el('span', 'unit', 'to'),

    if (!condOk) {
      U.awaitBlock(s, condMiss);
    } else {

    U.warnChips(s, twin0.warn.concat(twinT.warn, se0.warn, seT.warn, twinTas.warn, seTas.warn));
    s.appendChild(U.el('div', 'footnote', U.isPhone() ?
      '* 50% of headwind, 150% of tailwind. Standard temp lapse rate.' :

      fw.toFixed(0) + ' kt used). Standard temp lapse rate. Obstacle / ATC verdicts check the ' +

    checked.forEach(function (c, i) {

    listWrap.appendChild(add);
    s.appendChild(listWrap);

    } else {
    // per-path verdict cells across all obstacles
    function pathVerdict(parent, label, p, marginKey) {

        U.res(parent, label, '—', null, 'no obstacles entered');

      var worstViol = null, unchecked = [], minOk = null;
      checked.forEach(function (c) {

        if (m == null) { unchecked.push(c.ob.label); return; }
        if (m < 0 && (worstViol == null || m < worstViol.m)) worstViol = { m: m, lab: c.ob.label };

    o = U.el('div', 'out'); s.appendChild(o);

    zbtn('+', zi < ZOOMS.length - 1 ? ZOOMS[zi + 1] : null, false);
    s.appendChild(zrow);
    s.appendChild(climboutSvg(st, pTwin.pts, pSe.pts, checked, maxAgl, startNm, rwyNm, REQS, zoom));
    var pathWarn = [];
    pushWarn(pathWarn, r50f.warn);
    pushWarn(pathWarn, pTwin.warn);
    pushWarn(pathWarn, pSe.warn);

    if (pSe.blocked) pushWarn(pathWarn, ['OEI path incomplete — ' + pSe.blocked]);

    pathWarn = dropTw(pathWarn);

    if (st.cruiseAlt == null) ceilMiss = ceilMiss.concat(['CRUISE PRESSURE ALT']);
    if (U.missing(['fieldElev', 'altimeter', 'oat']).length) {

    var ceilOat = null, ceil = { v: null, warn: [] };

    var guess = 15000, i;
    for (i = 0; i < 8; i++) {
      ceilOat = C.tempAloft(st.oat, pa, guess);

    var above = ceil.v != null && st.cruiseAlt != null && st.cruiseAlt > ceil.v;
    var rCeil = U.res(o, 'SE ceiling (MSL)', U.fmtComma(ceilMsl) + ' <small>ft</small>',

    } // conditions entered
